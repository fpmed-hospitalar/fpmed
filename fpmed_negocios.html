/* ── A DUPLICATA ─────────────────────────────────────────────────────────────────────────────
   Procura por portal + número + órgão, que é o trio que identifica um certame na prática. A
   comparação ignora acento, maiúscula e pontuação: "PE 050/2026" e "pe050/2026" são o mesmo
   pregão pra quem trabalha, e seriam dois pro banco. */
const _chaveCert = s => String(s||'').normalize('NFD').replace(/\p{M}/gu,'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function achaDuplicata(portal, numero, orgao){
  const n = _chaveCert(numero), o = _chaveCert(orgao), p = _chaveCert(portal);
  if(!n) return null;
  return NEG.find(x => _chaveCert(x.numero) === n
    && (!o || !x.orgao || _chaveCert(x.orgao) === o)
    && (!p || !x.portal || _chaveCert(x.portal) === p)) || null;
}

async function salvarManual(){
  const msg = document.getElementById('m-msg'), bt = document.getElementById('m-bt');
  const v = id => (document.getElementById(id).value || '').trim();
  const orgao = v('m-orgao'), numero = v('m-numero'), portal = v('m-portal');
  // O MÍNIMO PRA UM NEGÓCIO SER RECONHECÍVEL. Sem órgão nem número, o card do funil fica sem
  // título e ninguém acha aquilo de novo — o negócio existiria só pra atrapalhar a contagem.
  if(!orgao && !numero){ msg.textContent = 'escreva ao menos o órgão ou o número do certame.'; return; }

  const dup = achaDuplicata(portal, numero, orgao);
  if(dup){
    if(!confirm('Já existe um negócio com esse número' + (dup.orgao ? ' no ' + dup.orgao : '') + '.\n\n'
      + 'OK = abrir o que já existe\nCancelar = voltar pro formulário (pra corrigir o número)')) return;
    fecharFormManual(); abrirDrawer(dup.id); return;
  }

  bt.disabled = true; msg.textContent = 'incluindo…';
  try{
    const ab = v('m-abertura');
    const valor = parseFloat(v('m-valor').replace(',', '.'));
    const corpo = {
      empresa_id: Number(v('m-empresa')) || null,
      estagio: v('m-estagio') || 'oportunidade',
      situacao: v('m-situacao') || 'normal',
      portal: portal || null, numero: numero || null, orgao: orgao || null,
      municipio: v('m-municipio') || null,
      uf: v('m-uf') ? v('m-uf').toUpperCase().slice(0,2) : null,
      modalidade: v('m-modalidade') || null,
      objeto: v('m-objeto') || null,
      abertura: ab ? new Date(ab).toISOString() : null,
      valor_estimado: isFinite(valor) && valor > 0 ? valor : null,
      // >>> A ORIGEM É O QUE DIZ A VERDADE SOBRE ESTE REGISTRO. `manual` fica ao lado de
      //     `calendario_2025` e `licitacoes` — três procedências, e a ficha mostra qual foi.
      origem: 'manual',
      criado_por: (window.gmAuth && gmAuth.user && gmAuth.user.email) || null,
      arquivado: false,
    };
    const r = await fetch(`${SB_URL}/rest/v1/negocios`, {method:'POST',
      headers: Object.assign({'Prefer':'return=representation'}, SB_H, {'Content-Type':'application/json'}),
      body: JSON.stringify(corpo)});
    if(!r.ok) throw new Error('HTTP ' + r.status + (r.status===401||r.status===403 ? ' — sem permissão de gravar' : ''));
    const novo = (await r.json())[0];
    fecharFormManual();
    await carregar(); pinta();
    if(novo && novo.id) abrirDrawer(novo.id);
  }catch(e){ msg.textContent = 'não consegui incluir: ' + e.message; bt.disabled = false; }
}

/* ══ OS NÚMEROS DO TOPO — UM LUGAR SÓ ════════════════════════════════════════════════════════
   As caixinhas viraram botões, e os painéis que elas abrem mostram A MESMA lista que gerou o
   número. Se cada um contasse por conta própria, o dia em que a definição mudasse teria dois
   resultados na mesma tela — e o operador não teria como saber qual acreditar.

   ══ A TAXA DE VITÓRIA: O QUE ELA É DE VERDADE ══════════════════════════════════════════════
   Foi pedido pra conferir de onde o número vem e ESCREVER. Conferido no banco em 11/08:
     · GANHAS ......... negócio com `valor_ganho > 0`. São 105, e todas estão na fase Ata.
     · O DENOMINADOR .. era `estagio='classificacao' OR valor_ganho>0` = 696.
   Ou seja: quem chegou à Habilitação e não ganhou conta como PERDIDA, e quem parou antes
   (Oportunidade, Qualificação) não conta em lugar nenhum. Isso está certo — perder na
   habilitação é perder; desistir na triagem não é disputa.

   >>> MAS HAVIA UMA DISTORÇÃO, e ela foi corrigida: o denominador contava também os negócios que
       ainda ESTÃO na Habilitação, ou seja, em disputa. Um pregão que acontece semana que vem
       entrava na conta como já perdido. Hoje isso é 1 de 696 e quase não muda o número — mas
       numa semana com 20 disputas abertas a taxa despencaria sozinha, sem nada ter dado errado.
       A regra passou a ser: só entra no denominador o que JÁ ACABOU (arquivado) ou já ganhou.
   >>> E A TELA DIZ A CONTA. "10,6%" sem denominador é um número que ninguém pode conferir. */
function numerosDoTopo(){
  const ganhos = NEG.filter(n => Number(n.valor_ganho) > 0);
  // DECIDIDAS = ganhou, ou chegou à Habilitação e o processo já terminou.
  const perdidas = NEG.filter(n => n.estagio === 'classificacao' && n.arquivado && !(Number(n.valor_ganho) > 0));
  const decididas = ganhos.length + perdidas.length;
  const emDisputa = NEG.filter(n => n.estagio === 'classificacao' && !n.arquivado).length;
  return {
    ganhos, perdidas, decididas, emDisputa,
    noFunil: NEG.filter(n => !n.arquivado).length,
    historico: NEG.length,
    total: ganhos.reduce((s,n) => s + Number(n.valor_ganho||0), 0),
    taxa: decididas ? (ganhos.length / decididas * 100) : null,
    taxaTxt: decididas ? (ganhos.length / decididas * 100).toFixed(1) + '%' : '—',
  };
}

let ITENS_GANHOS_MAPA = {};   // negocio_id -> {itens, soma, diferenca}, pro painel das ganhas

/* ── O PAINEL ────────────────────────────────────────────────────────────────────────────────
   Painel dentro do próprio Negócios, e não uma tela nova: o pedido foi explícito ("sem criar
   tela nova pesada"), e uma tela a mais teria o seu próprio boot, a sua própria sessão e o seu
   próprio jeito de discordar desta sobre o que é uma "ganha". */
function fecharPainel(){
  const p = document.getElementById('painel-kpi');
  if(p){ p.style.display = 'none'; p.innerHTML = ''; }
}
async function abrirPainel(qual){
  const p = document.getElementById('painel-kpi'); if(!p) return;
  p.style.display = 'block';
  p.scrollIntoView({behavior:'smooth', block:'nearest'});

  // "no funil" e "histórico" não abrem lista própria: eles MEXEM NOS FILTROS da tela, que já é
  // a lista. Duplicar a lista aqui seria manter dois lugares que mostram a mesma coisa.
  if(qual === 'funil' || qual === 'historico'){
    document.getElementById('f-arquivados').checked = (qual === 'historico');
    FASE_SEL = null;
    /* A BUSCA POR ÓRGÃO/Nº NASCE ESCONDIDA nesta tela (só aparece pela lupa). No histórico ela
       é obrigatória: mil e tantos negócios sem campo de busca é uma lista pra rolar, não pra
       usar — e a busca foi parte do pedido. Então abrir o histórico REVELA o campo, e limpa o
       que estivesse escrito nele, porque um filtro sobrando explicaria mal o número de cima. */
    const b = document.getElementById('f-busca');
    if(b){ b.value = ''; b.style.display = (qual === 'historico') ? '' : 'none'; if(qual === 'historico') setTimeout(()=>b.focus(), 60); }
    pinta();
    const k = numerosDoTopo();
    p.innerHTML = '<div class="pk-topo"><b>' + (qual === 'funil'
        ? k.noFunil + ' no funil agora' : k.historico.toLocaleString('pt-BR') + ' no histórico')
      + '</b><button class="btn-ed sec" onclick="fecharPainel()">fechar</button></div>'
      + '<div class="salvo">' + (qual === 'funil'
          ? 'A lista abaixo está mostrando <b>só os ativos</b> — os filtros foram limpos.'
          : 'A lista abaixo está mostrando <b>tudo</b>, inclusive os arquivados: os negócios do '
            + 'Calendário 2025 e os que saíram do funil. Use a busca por órgão ou nº.')
      + '</div>';
    return;
  }

  p.innerHTML = '<div class="pk-topo"><b>carregando…</b><button class="btn-ed sec" onclick="fecharPainel()">fechar</button></div>';
  // A SOMA DOS ITENS vem do banco, e não da tela: é ela que precisa BATER com o valor da ficha,
  // e uma conta feita aqui seria uma terceira versão do mesmo número.
  try{
    const r = await fetch(`${SB_URL}/rest/v1/v_negocios_ganhos`
      + '?select=id,itens_confirmados,soma_itens,diferenca&limit=2000', {headers:SB_H});
    ITENS_GANHOS_MAPA = {};
    if(r.ok) for(const x of await r.json()) ITENS_GANHOS_MAPA[x.id] = x;
  }catch(e){ ITENS_GANHOS_MAPA = {}; }
  pintaPainelGanhas(qual);
}

function pintaPainelGanhas(qual){
  const p = document.getElementById('painel-kpi');
  const k = numerosDoTopo();
  // ORDENADA POR VALOR, como pedido: o relatório de ganhos começa pelo que pesa.
  const linhas = k.ganhos.slice().sort((a,b) => Number(b.valor_ganho||0) - Number(a.valor_ganho||0));
  window._painelGanhas = linhas;

  const titulo = qual === 'taxa' ? 'Taxa de vitória' : qual === 'total' ? 'Total ganho' : 'Negócios ganhos';
  // >>> A CONTA APARECE POR EXTENSO. "10,6%" é um número que ninguém confere; "105 ganhas de 695
  //     decididas" é uma frase que qualquer um refaz na calculadora.
  const contexto = qual === 'taxa'
    ? `<div class="pk-conta"><b>${k.ganhos.length} ganhas</b> de <b>${k.decididas} decididas</b> = <b>${k.taxaTxt}</b>

          <b>Decididas</b> = as que a empresa ganhou (${k.ganhos.length}) + as que chegaram à Habilitação e o
          processo já terminou (${k.perdidas.length}). Quem parou antes da Habilitação (triagem, qualificação)
          <b>não entra</b>: desistir na triagem não é perder uma disputa.
          ${k.emDisputa ? `<br><b>${k.emDisputa}</b> negócio(s) ainda em disputa <b>não contam</b> — nem como ganho, nem como perda.` : ''}
        </div></div>`
    : qual === 'total'
    ? `<div class="pk-conta"><b>${brl(k.total)}</b> é a soma do valor ganho das ${k.ganhos.length} abaixo.</div>`
    : '';

  const comItens = linhas.filter(n => (ITENS_GANHOS_MAPA[n.id]||{}).itens_confirmados > 0).length;
  const somaTotal = linhas.reduce((s,n) => s + Number(n.valor_ganho||0), 0);

  p.innerHTML = '<div class="pk-topo"><b>' + titulo + ' · ' + linhas.length + ' negócio(s)</b>'
      + '<span style="margin-left:auto;display:flex;gap:8px">'
      + '<button class="btn-ed sec" onclick="excelGanhas()">⬇ Excel</button>'
      + '<button class="btn-ed sec" onclick="imprimirGanhas()">🖨️ Imprimir</button>'
      + '<button class="btn-ed sec" onclick="fecharPainel()">fechar</button></span></div>'
    + contexto
    + '<div class="salvo" style="margin:8px 0">'
    +   comItens + ' de ' + linhas.length + ' têm os itens detalhados gravados. '
    +   'Os demais vieram do histórico do calendário, que guarda o valor total sem item a item — '
    +   '<b>isso é normal, não é erro</b>.</div>'
    + '<div style="max-height:430px;overflow:auto"><table class="pk-tab">'
    + '<thead><tr>' + ['ÓRGÃO','Nº','MUNICÍPIO','ABERTURA','ITENS','VALOR GANHO'].map(h =>
        '<th>'+h+'</th>').join('') + '</tr></thead><tbody>'
    + linhas.map(n => {
        const g = ITENS_GANHOS_MAPA[n.id] || {};
        // A DIFERENÇA APARECE, e não é escondida — mas só quando HÁ itens pra comparar.
        const dif = (g.diferenca != null && Math.abs(Number(g.diferenca)) >= 0.01)
          ? `<div class="pk-dif">ficha ${brl(n.valor_ganho)} · itens ${brl(g.soma_itens)} — conferir</div>` : '';
        return `<tr onclick="irPara(${n.id})" title="abrir a ficha deste negócio">
          <td>${esc(String(n.orgao||'—').slice(0,42))}${dif}</td>
          <td>${esc(n.numero||'—')}</td>
          <td>${esc(n.municipio||'—')}${n.uf?' · '+esc(n.uf):''}</td>
          <td>${n.abertura ? esc(new Date(n.abertura).toLocaleDateString('pt-BR')) : '—'}</td>
          <td style="text-align:right">${g.itens_confirmados ? g.itens_confirmados : '<span class="salvo">—</span>'}</td>
          <td style="text-align:right"><b>${brl(n.valor_ganho)}</b></td>
        </tr>`;
      }).join('')
    + '</tbody><tfoot><tr>'
    // >>> O RODAPÉ TEM QUE BATER COM O CARTÃO. É a mesma soma, da mesma lista — se um dia
    //     divergirem, é porque alguém criou uma segunda contagem, e é isso que o assert trava.
    + '<td colspan="5" style="text-align:right"><b>total</b></td>'
    + '<td style="text-align:right"><b>' + brl(somaTotal) + '</b></td>'
    + '</tr></tfoot></table></div>';
}

/* ══ GERENCIAMENTO DE ATA ═════════════════════════════════════════════════════════════════════
   A fase final: os documentos assinados, o que se ganhou, e por quanto se perdeu.

   >>> AS DUAS LEITURAS DE IA ENTRAM NA `ler-edital`, e não numa função nova. Ela já tem a
       permissão do piloto conferida no servidor, o contador de custo, o teto por tarefa e o
       bloqueio de leitura cortada. Função nova seria uma segunda permissão e um segundo contador
       para a mesma cobrança — e o dia em que uma das duas ficasse pra trás seria um dia em que
       alguém lê de graça, ou lê sem poder.
   >>> E A IA NUNCA ESCREVE SOZINHA NO `valor_ganho`. Ele alimenta a taxa de vitória, que é o
       número que a empresa usa pra decidir onde disputar. O relatório SUGERE; confirmar é um
       clique de gente, e o rastro guarda que veio de leitura. */
const ATA_CATS = [
  { k:'ata',            n:'Ata de registro de preços' },
  { k:'contrato',       n:'Contrato' },
  { k:'proposta_final', n:'Proposta final' },
  { k:'ata_sessao',     n:'Ata da sessão' },
  { k:'itens_ganhos',   n:'Itens ganhos' },
  { k:'retorno_precos', n:'Retorno de preços' },
];
const nomeCat = k => (ATA_CATS.find(c => c.k === k) || {}).n || k;
let ANEXOS_ATA = [], RELATORIO_ATA = null;

async function carregarAta(id){
  const box = document.getElementById('ata-lista'); if(!box) return;
  try{
    const cats = ATA_CATS.map(c => c.k).join(',');
    const r = await fetch(`${SB_URL}/rest/v1/negocio_anexos?negocio_id=eq.${id}`
      + `&categoria=in.(${cats})&select=*&order=categoria.asc,versao.desc`, {headers:SB_H});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    ANEXOS_ATA = await r.json();
    pintaAta(id);
  }catch(e){
    ANEXOS_ATA = [];
    box.innerHTML = '<div class="salvo">não consegui ler os documentos ('+esc(e.message)+') — '
      + 'isto <b>não</b> quer dizer que não existam.</div>';
  }
}

function pintaAta(id){
  const box = document.getElementById('ata-lista'); if(!box) return;
  const cnt = document.getElementById('dw-ata-n');
  if(cnt) cnt.textContent = ANEXOS_ATA.length ? ANEXOS_ATA.length : '';

  // AGRUPADO POR TIPO, como pedido. Categoria vazia NÃO aparece: seis cabeçalhos com "nenhum"
  // embaixo empurram pra baixo os dois que existem, e a lista deixa de ser lida.
  const porCat = {};
  for(const a of ANEXOS_ATA) (porCat[a.categoria] ||= []).push(a);
  const cheias = ATA_CATS.filter(c => porCat[c.k]);
  box.innerHTML = cheias.length
    ? cheias.map(c => `<div style="margin-bottom:10px">
        <div class="salvo" style="color:var(--azul-claro);font-weight:600">${esc(c.n)} (${porCat[c.k].length})</div>
        ${porCat[c.k].map(a => `<div class="anx">
          <span class="v">v${a.versao}</span>
          <span class="n" onclick="abrirAnexo('${esc(a.arquivo_path)}')" title="abrir">${esc(a.arquivo_nome)}</span>
          <span class="q">${esc(new Date(a.enviado_em).toLocaleDateString('pt-BR'))}${a.enviado_por?' · '+esc(String(a.enviado_por).split('@')[0]):''}</span>
        </div>`).join('')}
      </div>`).join('')
    : '<div class="salvo">Nenhum documento anexado ainda.</div>';

  pintaBotoesAta(id, porCat);
}

/* OS BOTÕES DOS RELATÓRIOS SÓ APARECEM QUANDO HÁ O DOCUMENTO QUE ELES LEEM. Um botão "ler itens
   ganhos" sem nenhum documento de resultado anexado só pode fazer uma coisa: gastar uma leitura
   pra dizer "não achei". E ele é do piloto — quem não tem permissão não vê nada disso. */
function pintaBotoesAta(id, porCat){
  const box = document.getElementById('ata-relatorios'); if(!box) return;
  if(!podeLerEdital()){
    box.innerHTML = '<div class="salvo">Os relatórios com IA estão em piloto, liberados só para o '
      + 'gestor de licitação — cada leitura tem custo e é cobrada.</div>';
    return;
  }
  const temGanhos = porCat['itens_ganhos'] || porCat['ata_sessao'];
  const temMapa   = porCat['ata_sessao'] || porCat['retorno_precos'];
  box.innerHTML = '<h4>Relatórios com IA</h4>'
    + '<div class="dica" style="font-size:11.5px;color:var(--muted);margin-bottom:8px">'
    +   'Cada leitura <b>custa dinheiro e fica registrada</b> no seu nome. Leitura cortada é '
    +   'bloqueada — nunca entregue pela metade.</div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
    + (temGanhos
        ? `<button class="btn-ed" onclick="lerAtaIA(${id},'itens-ganhos')">🏆 O que eu ganhei</button>`
        : '<span class="salvo">Anexe <b>Itens ganhos</b> ou <b>Ata da sessão</b> para ler o que foi ganho.</span>')
    + (temMapa
        ? `<button class="btn-ed sec" onclick="lerAtaIA(${id},'mapa-precos')">📉 Mapa de preços da disputa</button>`
        : '<span class="salvo">Anexe <b>Ata da sessão</b> ou <b>Retorno de preços</b> para montar o mapa.</span>')
    + '</div>';
}

/* ══ O QUADRO DO RESULTADO — "clicou no processo ganho, já tá lá o que ganhou" ═══════════════
   Este é o quadro que o Lemuel descreveu. Ele lê do BANCO (a confirmação mais nova), e não de
   documento nenhum: quem confirmou uma vez não paga leitura de novo pra ver o que ganhou.

   >>> O NEGÓCIO ANTIGO DO CALENDÁRIO NÃO FICA COM TABELA VAZIA. Ele tem valor e não tem itens —
       isso é o normal de quem foi importado, não uma falta. Tabela vazia com cabeçalho pareceria
       um erro de carregamento e faria alguém procurar um defeito que não existe. Em vez disso, o
       quadro diz o que ele é: resultado importado do histórico, sem detalhe por item.
   >>> E QUANDO OS DOIS NÚMEROS DIVERGEM, A TELA MOSTRA A DIFERENÇA. Escondê-la seria escolher em
       qual dos dois acreditar — e essa escolha é de quem confere, não da tela. */
let ITENS_GANHOS = [];
async function carregarItensGanhos(id){
  const box = document.getElementById('ata-resultado'); if(!box) return;
  const n = NEG.find(x => x.id === id) || {};
  const ganhou = Number(n.valor_ganho) > 0;
  if(!ganhou){ box.innerHTML = ''; ITENS_GANHOS = []; return; }
  try{
    const r = await fetch(`${SB_URL}/rest/v1/v_negocio_itens_ganhos?negocio_id=eq.${id}`
      + '&select=*&order=item_n.asc', {headers:SB_H});
    ITENS_GANHOS = r.ok ? await r.json() : [];
    pintaItensGanhos(id);
  }catch(e){
    // "não sei" e "não tem" outra vez: um erro de leitura mostrando "sem detalhe por item"
    // faria alguém concluir que o resultado nunca foi confirmado — e confirmar de novo.
    box.innerHTML = '<h4>Resultado</h4><div class="salvo">não consegui ler os itens ('+esc(e.message)+') — '
      + 'isto <b>não</b> quer dizer que não existam.</div>';
  }
}

function pintaItensGanhos(id){
  const box = document.getElementById('ata-resultado'); if(!box) return;
  const n = NEG.find(x => x.id === id) || {};
  const cnt = document.getElementById('dw-ata-n');
  const num = v => { const x = Number(v); return isFinite(x) && v != null ? x : null; };

  if(!ITENS_GANHOS.length){
    box.innerHTML = '<h4>Resultado</h4>'
      + '<div class="pk-conta" style="border-color:rgba(124,197,118,.45)">'
      +   '<b style="color:var(--verde)">Ganho · ' + brl(n.valor_ganho) + '</b>'
      +   '<div class="salvo" style="margin-top:6px">Resultado <b>importado do histórico</b> — '
      +   'sem detalhe por item. Os negócios do Calendário guardam o valor total, e não a relação '
      +   'de itens; para ter o detalhe, anexe o documento de resultado e use o relatório abaixo.</div>'
      + '</div>';
    return;
  }
  const soma = ITENS_GANHOS.reduce((s,x) => s + (num(x.total) || 0), 0);
  const dif = Number(n.valor_ganho||0) - soma;
  const semMarca = ITENS_GANHOS.filter(x => !x.marca).length;
  const quando = ITENS_GANHOS[0] ? new Date(ITENS_GANHOS[0].confirmado_em) : null;
  if(cnt) cnt.textContent = ITENS_GANHOS.length;

  box.innerHTML = '<h4>Resultado</h4>'
    + '<div class="pk-conta" style="border-color:rgba(124,197,118,.45)">'
    +   '<b style="color:var(--verde)">Ganhou ' + ITENS_GANHOS.length + ' item(ns) · ' + brl(soma) + '</b>'
    +   '<div class="salvo" style="margin-top:6px">'
    +     'confirmado' + (quando ? ' em ' + esc(quando.toLocaleDateString('pt-BR')) : '')
    +     (ITENS_GANHOS[0] && ITENS_GANHOS[0].confirmado_por ? ' por ' + esc(String(ITENS_GANHOS[0].confirmado_por).split('@')[0]) : '')
    +     (ITENS_GANHOS[0] && ITENS_GANHOS[0].confirmacao > 1 ? ' · <b>' + ITENS_GANHOS[0].confirmacao + 'ª confirmação</b> (as anteriores ficam no rastro)' : '')
    +   '</div>'
    // A DIFERENÇA, quando existe, aparece aqui — no lugar onde os dois números estão juntos.
    +   (Math.abs(dif) >= 0.01
        ? '<div class="salvo" style="margin-top:6px;color:#e0a04a"><b>⚠️ Conferir:</b> valor da ficha '
          + brl(n.valor_ganho) + ' · soma dos itens ' + brl(soma) + ' — diferença de ' + brl(Math.abs(dif)) + '.</div>'
        : '')
    + '</div>'
    + '<div style="max-height:300px;overflow:auto"><table class="pk-tab">'
    + '<thead><tr>' + ['Nº','ITEM','MARCA','QTD','UNIT.','TOTAL'].map(h => '<th>'+h+'</th>').join('') + '</tr></thead><tbody>'
    + ITENS_GANHOS.map(x => `<tr style="cursor:default">
        <td>${esc(x.item_n || '—')}</td>
        <td>${esc(String(x.descricao||'').slice(0,64))}</td>
        <td>${x.marca ? esc(x.marca) + (x.marca_origem === 'estoque' ? ' <span class="salvo">(do estoque)</span>' : '')
                      : '<span class="salvo">sem marca no documento</span>'}</td>
        <td style="text-align:right">${num(x.quantidade) != null ? Number(x.quantidade).toLocaleString('pt-BR') : '—'}</td>
        <td style="text-align:right">${brl(num(x.valor_unitario))}</td>
        <td style="text-align:right"><b>${brl(num(x.total))}</b></td>
      </tr>`).join('')
    + '</tbody><tfoot><tr><td colspan="5" style="text-align:right"><b>total</b></td>'
    +   '<td style="text-align:right"><b>' + brl(soma) + '</b></td></tr></tfoot></table></div>'
    + (semMarca ? '<div class="salvo" style="margin-top:6px">' + semMarca + ' item(ns) sem marca: o documento '
        + 'não trouxe. <b>Marca em branco é marca não sabida</b> — nunca preenchida por dedução.</div>' : '');
}

async function anexarAta(id){
  const msg = document.getElementById('ata-msg'), bt = document.getElementById('ata-bt');
  const arq = (document.getElementById('ata-arq').files || [])[0];
  const cat = document.getElementById('ata-cat').value;
  if(!arq){ msg.textContent = 'escolha o arquivo.'; return; }
  bt.disabled = true; msg.textContent = 'enviando…';
  try{
    const limpo = arq.name.normalize('NFD').replace(/\p{M}/gu,'').toLowerCase().replace(/[^a-z0-9._-]+/g,'-');
    const path = 'negocio-' + id + '/' + cat + '/' + Date.now() + '-' + limpo;
    const up = await fetch(`${SB_URL}/storage/v1/object/documentos/${encodeURIComponent(path)}`, {
      method:'POST', headers: Object.assign({}, SB_H), body: arq });
    if(!up.ok) throw new Error(up.status===403 ? 'só gestor pode enviar arquivo' : ('não consegui enviar (HTTP '+up.status+')'));
    const r = await fetch(`${SB_URL}/rest/v1/negocio_anexos`, {method:'POST',
      headers: Object.assign({'Prefer':'return=representation'}, SB_H, {'Content-Type':'application/json'}),
      body: JSON.stringify({ negocio_id: id, categoria: cat, arquivo_path: path,
        arquivo_nome: arq.name, bytes: arq.size,
        enviado_por: (window.gmAuth && gmAuth.user && gmAuth.user.email) || null })});
    if(!r.ok) throw new Error('o arquivo subiu, mas não consegui registrar (HTTP ' + r.status + ')');
    const nova = (await r.json())[0];
    document.getElementById('ata-arq').value = '';
    msg.textContent = nomeCat(cat) + ' anexado como v' + (nova ? nova.versao : '?') + '.';
    await carregarAta(id);
  }catch(e){ msg.textContent = 'não consegui anexar: ' + e.message; }
  bt.disabled = false;
}

/* ── AS DUAS LEITURAS ────────────────────────────────────────────────────────────────────────
   O documento que cada uma lê é escolhido por CATEGORIA, e não por "o mais recente": ler a
   proposta final quando se pediu o mapa de preços gastaria uma leitura pra devolver nada. */
async function lerAtaIA(id, tarefa){
  const saida = document.getElementById('ata-saida');
  const prefs = tarefa === 'itens-ganhos' ? ['itens_ganhos','ata_sessao'] : ['ata_sessao','retorno_precos'];
  let anexo = null;
  for(const c of prefs){ anexo = ANEXOS_ATA.find(a => a.categoria === c); if(anexo) break; }
  if(!anexo){ saida.innerHTML = '<div class="salvo">anexe o documento primeiro.</div>'; return; }

  saida.innerHTML = '<div class="salvo">baixando o documento…</div>';
  try{
    const rs = await fetch(`${SB_URL}/storage/v1/object/sign/documentos/${encodeURIComponent(anexo.arquivo_path)}`, {
      method:'POST', headers: Object.assign({'Content-Type':'application/json'}, SB_H),
      body: JSON.stringify({ expiresIn: 120 }) });
    if(!rs.ok) throw new Error('não consegui abrir o anexo (HTTP ' + rs.status + ')');
    const buf = await (await fetch(SB_URL + '/storage/v1' + (await rs.json()).signedURL)).arrayBuffer();

    saida.innerHTML = '<div class="salvo">lendo o PDF…</div>';
    const texto = await pdfParaTextoNeg(buf);
    if(texto.trim().length < 500) throw new Error('a extração de texto veio pobre — este PDF parece escaneado. '
      + 'O caminho de imagem existe no leitor de edital; aqui ele ainda não foi ligado.');

    saida.innerHTML = '<div class="salvo">lendo com IA (isto custa e fica registrado)…</div>';
    const tok = tokenSessaoNeg();
    if(!tok) throw new Error('sua sessão expirou — entre de novo');
    const r = await fetch(`${SB_URL}/functions/v1/ler-edital`, {method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer ' + tok},
      body: JSON.stringify({ tarefa, modo:'texto', texto, titulo: anexo.arquivo_nome,
        chars: texto.length, cambio: await cambioNeg() }),
      signal: AbortSignal.timeout(600000)});
    const txt = await r.text();
    if(r.status === 403) throw new Error('os relatórios com IA estão em piloto, liberados só para o gestor de licitação.');
    if(!r.ok) throw new Error('o serviço de leitura respondeu ' + r.status);
    const j = JSON.parse(txt);
    // ERRO COM CUSTO JUNTO, como em toda leitura paga deste sistema.
    if(j.ok === false) throw new Error((j.erro || 'a leitura não deu certo')
      + (j.usd ? ' · esta tentativa já custou ' + (j.brl != null ? 'R$ '+Number(j.brl).toFixed(2) : 'US$ '+Number(j.usd).toFixed(4)) + '.' : ''));
    if(!j.dados) throw new Error('a leitura voltou fora do formato esperado — não vou adivinhar o que ela quis dizer.');

    RELATORIO_ATA = { tarefa, anexo, dados: j.dados, custo: j, negocio: id };
    if(tarefa === 'itens-ganhos') pintaGanhos(id); else pintaMapa(id);
  }catch(e){ saida.innerHTML = '<div class="aviso-err salvo" style="color:#ff9d92">⚠️ ' + esc(e.message) + '</div>'; }
}

function tokenSessaoNeg(){
  try{
    for(const k of Object.keys(localStorage)){
      if(!/gm.?auth|sess/i.test(k)) continue;
      const v = JSON.parse(localStorage.getItem(k) || '{}');
      if(v && v.access_token) return v.access_token;
    }
  }catch(e){}
  return null;
}
async function cambioNeg(){
  try{
    const r = await fetch('https://economia.awesomeapi.com.br/last/USD-BRL', {signal: AbortSignal.timeout(6000)});
    const v = parseFloat((await r.json()).USDBRL.bid);
    return isFinite(v) && v > 0 ? v : null;
  }catch(e){ return null; }
}
function custoDaLeitura(j){
  return '<div class="salvo" style="margin-top:10px">'
    + 'custo desta leitura: <b>' + (j.brl != null ? 'R$ ' + Number(j.brl).toFixed(2) : 'US$ ' + Number(j.usd||0).toFixed(4)) + '</b>'
    + (j.registrado === false
        ? ' · <b style="color:#ff9d92">⚠️ NÃO entrou no contador</b>' + (j.regErro ? ' (' + esc(j.regErro) + ')' : '')
        : (j.leituraId ? ' · registrada com o nº ' + j.leituraId : ''))
    + '</div>';
}

/* ── O QUE EU GANHEI ─────────────────────────────────────────────────────────────────────────
   O total daqui vira SUGESTÃO para `valor_ganho`. Nunca escrita automática: esse campo alimenta
   a taxa de vitória, e um número que a IA pôs sozinha contaminaria a estatística que a empresa
   usa pra decidir onde disputar — sem ninguém lembrar de onde ele veio. */
function pintaGanhos(id){
  const saida = document.getElementById('ata-saida');

    saida.innerHTML = '<div class="aviso-err salvo" style="color:#ffd98a">Não achei resultado neste documento. '
      + '<b>Isto não quer dizer que a empresa não ganhou nada</b> — quer dizer que não foi encontrado aqui.'
      + (d.observacao ? '<br>O que a leitura disse: <i>' + esc(d.observacao) + '</i>' : '') + '</div>'
      + custoDaLeitura(RELATORIO_ATA.custo);
    return;
  }
  const num = v => { const n = Number(v); return isFinite(n) && v != null && v !== '' ? n : null; };
  const comTotal = g.filter(x => num(x.total) != null || (num(x.quantidade) != null && num(x.valor_unitario) != null));
  const total = comTotal.reduce((s,x) => s + (num(x.total) != null ? num(x.total) : num(x.quantidade)*num(x.valor_unitario)), 0);
  const y = num(d.itens_no_documento);

  saida.innerHTML =
      '<div class="aviso-err salvo" style="color:#ffd98a;margin-bottom:8px">⚠️ <b>Confira contra o documento antes de usar.</b> '
    +   'Isto foi lido por IA. O número que importa conferir é simples: o documento tem quantos itens?</div>'
    + '<h4>O que ganhamos</h4>'
    + '<div class="salvo" style="margin-bottom:8px">'
    +   '<b>' + g.length + (y ? ' de ' + y : '') + ' item(ns)</b>'
    +   (comTotal.length ? ' · total <b>' + brl(total) + '</b>'
          + (comTotal.length < g.length ? ' <span style="color:#e0a04a">(' + (g.length-comTotal.length) + ' sem valor legível ficaram de fora da soma)</span>' : '')
        : ' · nenhum item trouxe valor — não há total a somar')
    +   (d.empresa ? '<br>lido como: ' + esc(d.empresa) : '')
    + '</div>'
    + (g.length ? '<div style="max-height:280px;overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">'
        + '<thead><tr><th style="text-align:left;padding:5px;color:var(--muted);font-size:10.5px;border-bottom:1px solid var(--linha)">Nº</th>'
        + '<th style="text-align:left;padding:5px;color:var(--muted);font-size:10.5px;border-bottom:1px solid var(--linha)">ITEM</th>'
        + '<th style="text-align:right;padding:5px;color:var(--muted);font-size:10.5px;border-bottom:1px solid var(--linha)">QTD</th>'
        + '<th style="text-align:right;padding:5px;color:var(--muted);font-size:10.5px;border-bottom:1px solid var(--linha)">UNIT.</th>'
        + '<th style="text-align:right;padding:5px;color:var(--muted);font-size:10.5px;border-bottom:1px solid var(--linha)">TOTAL</th></tr></thead><tbody>'
        + g.map(x => `<tr>
            <td style="padding:5px;border-bottom:1px solid rgba(34,55,79,.4)">${esc(x.n)}</td>
            <td style="padding:5px;border-bottom:1px solid rgba(34,55,79,.4)">${esc(String(x.descricao||'').slice(0,70))}</td>
            <td style="padding:5px;text-align:right;border-bottom:1px solid rgba(34,55,79,.4)">${num(x.quantidade)!=null?Number(x.quantidade).toLocaleString('pt-BR'):'—'}</td>
            <td style="padding:5px;text-align:right;border-bottom:1px solid rgba(34,55,79,.4)">${brl(num(x.valor_unitario))}</td>
            <td style="padding:5px;text-align:right;border-bottom:1px solid rgba(34,55,79,.4)">${brl(num(x.total)!=null?num(x.total):(num(x.quantidade)!=null&&num(x.valor_unitario)!=null?num(x.quantidade)*num(x.valor_unitario):null))}</td>
          </tr>`).join('') + '</tbody></table></div>' : '')
    + ((d.nao_consegui_ler||[]).length
        ? '<div class="salvo" style="margin-top:8px;color:#ffd98a"><b>O que a leitura NÃO conseguiu ler ('+d.nao_consegui_ler.length+'):</b><br>'
          + d.nao_consegui_ler.map(esc).join('<br>') + '</div>' : '')
    // ── A SUGESTÃO, COM CONFIRMAÇÃO DE GENTE ──────────────────────────────────────────────
    + (comTotal.length && ehGestor()
        ? `<div class="aviso-err salvo" style="margin-top:12px;padding:10px 12px;border:1px solid rgba(124,197,118,.5);border-radius:9px">

            </div>
            <button class="btn-ed" onclick="confirmarValorGanho(${id}, ${total.toFixed(2)})">✓ Confirmar ${brl(total)} e gravar os ${g.length} itens</button>
          </div>`
        : (comTotal.length ? '<div class="salvo" style="margin-top:10px">O valor ganho é campo de gestor.</div>' : ''))
    + custoDaLeitura(RELATORIO_ATA.custo);
}

async function confirmarValorGanho(id, valor){
  const n = NEG.find(x => x.id === id); if(!n) return;
  const saida = document.getElementById('ata-saida');
  const antes = n.valor_ganho;
  const itensIA = (RELATORIO_ATA && RELATORIO_ATA.dados && Array.isArray(RELATORIO_ATA.dados.ganhos))
    ? RELATORIO_ATA.dados.ganhos : [];
  if(!confirm('Gravar ' + brl(valor) + ' como valor ganho deste negócio'
    + (itensIA.length ? ' e os ' + itensIA.length + ' itens do resultado' : '') + '?'
    + (antes ? '\n\nO valor atual é ' + brl(antes) + ' e será substituído.' : '')
    + '\n\nEste número alimenta a taxa de vitória.')) return;
  try{
    // >>> O RASTRO DIZ DE ONDE VEIO. `gravar` já registra a alteração; o que se acrescenta aqui é
    //     a anotação de que o número nasceu de uma leitura por IA e foi CONFIRMADO por alguém.
    //     Daqui a seis meses, "por que este negócio vale R$ 84 mil?" tem resposta.
    await gravar(id, { valor_ganho: valor });
    n.valor_ganho = valor;
    await fetch(`${SB_URL}/rest/v1/negocio_alteracoes`, {method:'POST',
      headers: Object.assign({}, SB_H, {'Content-Type':'application/json'}),
      body: JSON.stringify({ negocio_id: id, campo: 'valor_ganho',
        de: antes == null ? null : String(antes), para: String(valor),
        quem: (window.gmAuth && gmAuth.user && gmAuth.user.email) || null,
        nota: 'confirmado a partir do relatório de itens ganhos lido por IA ('
              + (RELATORIO_ATA && RELATORIO_ATA.anexo ? RELATORIO_ATA.anexo.arquivo_nome : 'documento') + ')' })
    }).catch(()=>{});
    /* ── E OS ITENS VÃO JUNTO ────────────────────────────────────────────────────────────────
       O relatório deixou de ser papel: o que foi confirmado fica no banco, ligado ao negócio.
       Assim "o que a gente ganhou naquele pregão?" tem resposta sem reabrir documento nenhum —
       e sem pagar outra leitura de IA pela mesma informação.
       >>> A MARCA NUNCA É INVENTADA. Vem da ata quando o documento trouxer (`marca_origem:'ata'`)
           e fica VAZIA quando não trouxer. O casamento com o estoque é o terceiro caminho e ainda
           não foi ligado aqui — enquanto não estiver, vazio é vazio, e a tela põe etiqueta.
       >>> GRAVAR OS ITENS FALHAR NÃO DESFAZ O VALOR. São duas gravações e a primeira já valeu;
           dizer "não deu certo" faria a pessoa confirmar de novo e criar uma segunda confirmação
           de um valor que já estava lá. */
    let msgItens = '';
    if(itensIA.length){
      const num = v => { const x = Number(v); return isFinite(x) && v != null && v !== '' ? x : null; };
      const linhas = itensIA.map(x => ({
        negocio_id: id,
        item_n: x.n == null ? null : String(x.n).slice(0,40),
        descricao: String(x.descricao || '').slice(0, 600) || '(sem descrição no documento)',
        marca: x.marca ? String(x.marca).slice(0,120) : null,
        marca_origem: x.marca ? 'ata' : null,
        quantidade: num(x.quantidade),
        valor_unitario: num(x.valor_unitario),
        total: num(x.total) != null ? num(x.total)
             : (num(x.quantidade) != null && num(x.valor_unitario) != null ? num(x.quantidade) * num(x.valor_unitario) : null),
        origem: 'ia',
        confirmado_por: (window.gmAuth && gmAuth.user && gmAuth.user.email) || null,
      }));
      try{
        const ri = await fetch(`${SB_URL}/rest/v1/negocio_itens_ganhos`, {method:'POST',
          headers: Object.assign({}, SB_H, {'Content-Type':'application/json'}), body: JSON.stringify(linhas)});
        msgItens = ri.ok
          ? ' · ' + linhas.length + ' item(ns) gravados'
          : ' · <b style="color:#ff9d92">os itens NÃO foram gravados (HTTP ' + ri.status + ')</b> — o valor sim';
      }catch(e){ msgItens = ' · <b style="color:#ff9d92">os itens não foram gravados: ' + esc(e.message) + '</b>'; }
    }
    saida.innerHTML += '<div class="salvo ok" style="margin-top:8px">✓ valor ganho gravado como ' + brl(valor)
      + msgItens + ' — a confirmação está no histórico.</div>';
    carregarRastro(id); carregarItensGanhos(id); pinta();
  }catch(e){ saida.innerHTML += '<div class="salvo erro" style="margin-top:8px">não consegui gravar: ' + esc(e.message) + '</div>'; }
}

/* ── O MAPA DE PREÇOS DA DISPUTA ─────────────────────────────────────────────────────────────
   A inteligência comercial da derrota. A DIFERENÇA (R$ e %) é calculada AQUI, com aritmética —
   o prompt manda a IA copiar os valores e proíbe que ela calcule. Modelo de linguagem errando
   uma subtração é um jeito silencioso de a análise inteira ficar errada, e essa conta é barata
   demais pra terceirizar. */
function pintaMapa(id){
  const saida = document.getElementById('ata-saida');
  const d = RELATORIO_ATA.dados, itens = Array.isArray(d.itens) ? d.itens : [];
  if(d.encontrado === false || !itens.length){
    saida.innerHTML = '<div class="aviso-err salvo" style="color:#ffd98a">Não achei um mapa de preços neste documento. '
      + '<b>Isto não quer dizer que não houve disputa</b> — quer dizer que não foi encontrado aqui.'
      + (d.observacao ? '<br>' + esc(d.observacao) : '') + '</div>' + custoDaLeitura(RELATORIO_ATA.custo);
    return;
  }
  const num = v => { const n = Number(v); return isFinite(n) && v != null && v !== '' ? n : null; };
  const linhas = itens.map(x => {
    const nosso = num(x.nosso_preco), venc = num(x.preco_vencedor);
    // A diferença só existe quando os DOIS números existem. Meio dado vira "—", e não zero.
    const difRS = (nosso != null && venc != null) ? +(nosso - venc).toFixed(4) : null;
    const difPct = (difRS != null && venc > 0) ? +((difRS / venc) * 100).toFixed(2) : null;
    return Object.assign({}, x, { _nosso: nosso, _venc: venc, difRS, difPct });
  });
  const perdidos = linhas.filter(l => l.nossa_situacao === 'perdedor' && l.difRS != null);
  const ganhos = linhas.filter(l => l.nossa_situacao === 'vencedor');
  // "Perdemos por pouco" é a informação que faz mudar a estratégia da próxima. A mediana diria
  // menos: o que interessa é ver a lista, e o pior e o melhor caso dela.
  const perto = perdidos.filter(l => l.difPct != null && l.difPct <= 5).length;

  saida.innerHTML =
      '<div class="aviso-err salvo" style="color:#ffd98a;margin-bottom:8px">⚠️ <b>Confira contra a ata antes de usar.</b> '
    +   'Isto foi lido por IA. As diferenças em R$ e % foram calculadas aqui, com aritmética — a IA só copiou os valores.</div>'
    + '<h4>Mapa de preços da disputa</h4>'
    + '<div class="salvo" style="margin-bottom:8px">'
    +   itens.length + ' item(ns) no mapa · <b style="color:var(--verde)">' + ganhos.length + ' ganhos</b>'
    +   ' · <b style="color:#ff9d92">' + perdidos.length + ' perdidos</b>'
    +   (perto ? ' · <b style="color:#e0a04a">' + perto + ' perdidos por 5% ou menos</b>' : '')

/* ══ CREDENCIAMENTO JUNTO À INDÚSTRIA ═════════════════════════════════════════════════════════
   O que esta seção existe pra pegar não é "cadastrar credenciamento" — é o PEDIDO ESQUECIDO. Um
   credenciamento solicitado e não respondido não dói em lugar nenhum até o dia do pregão, quando
   a empresa descobre que não pode cotar aquela marca. Por isso o cartão de um pedido parado muda
   de cor, e por isso o sino conta os parados.

   >>> A TRILHA NÃO É ESCRITA AQUI. Quem grava a mudança de status é uma trigger no banco (ver
       ddl/credenciamentos.sql). Esta tela só faz o UPDATE do status; o histórico aparece porque
       o banco o escreveu. Se um dia outro caminho mudar o status — um script, o painel do
       Supabase —, a trilha continua completa. Histórico que a tela escreve é histórico que a
       tela pode esquecer de escrever. */
const CRED_FASES = [
  { k:'solicitado', n:'Solicitado', c:'#8fa3b8' },
  { k:'em_analise', n:'Em análise', c:'#e0a04a' },
  { k:'aprovado',   n:'Aprovado',   c:'#7CC576' },
  { k:'negado',     n:'Negado',     c:'#e5675a' },
];
const credNome = k => (CRED_FASES.find(f => f.k === k) || {}).n || k;
const credCor  = k => (CRED_FASES.find(f => f.k === k) || {}).c || '#8fa3b8';
/* QUANTOS DIAS SEM RESPOSTA É "PARADO". O Lemuel pediu 7 como padrão. Ele mora aqui, sozinho, e
   trocar este número muda o cartão, o contador da aba e o sino de uma vez — três lugares que, se
   tivessem cada um o seu número, um dia discordariam sobre o que é estar parado. */
const CRED_DIAS_PARADO = 7;
const CRED_ABERTOS = ['solicitado','em_analise'];   // negado e aprovado já foram respondidos

let CREDS = [], CRED_HIST = {};
const diasDesde = iso => iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : null;
function credParado(c){
  return CRED_ABERTOS.includes(c.status) && (diasDesde(c.solicitado_em) || 0) >= CRED_DIAS_PARADO;
}

async function carregarCredenciamentos(id){
  const box = document.getElementById('cred-lista'); if(!box) return;
  const n = NEG.find(x => x.id === id);
  try{
    // Filtra pela EMPRESA, e não pelo negócio: o credenciamento vale pra todos os pregões dela.
    const q = n && n.empresa_id ? `empresa_id=eq.${n.empresa_id}` : 'id=gt.0';
    const r = await fetch(`${SB_URL}/rest/v1/credenciamentos?${q}&select=*&order=solicitado_em.desc`, {headers:SB_H});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    CREDS = await r.json();
    // A trilha vem de UMA leitura pra todos, e não uma por cartão: são 4 linhas por
    // credenciamento, e N chamadas seriam N erros possíveis pra uma informação que cabe numa.
    CRED_HIST = {};
    if(CREDS.length){
      const ids = CREDS.map(c => c.id).join(',');
      const rh = await fetch(`${SB_URL}/rest/v1/credenciamento_historico?credenciamento_id=in.(${ids})`
        + '&select=*&order=quando.asc', {headers:SB_H});
      if(rh.ok) for(const h of await rh.json()) (CRED_HIST[h.credenciamento_id] ||= []).push(h);
    }
    pintaCredenciamentos(id);
  }catch(e){
    // "Não sei" e "nenhum" são coisas diferentes. Uma lista vazia num negócio que na verdade não
    // conseguiu ler o banco faria alguém concluir que não há credenciamento — e pedir de novo.
    CREDS = [];
    box.innerHTML = '<div class="salvo">não consegui ler os credenciamentos ('+esc(e.message)+') — '
      + 'isto <b>não</b> quer dizer que não existam.</div>';
  }
}

function pintaCredenciamentos(id){
  const box = document.getElementById('cred-lista'); if(!box) return;
  const cnt = document.getElementById('dw-cred-n');
  // O CONTADOR DA ABA CONTA OS PARADOS, e não o total: "Credenciamentos 12" não pede nada de
  // ninguém. "Credenciamentos 2" querendo dizer "2 pedidos parados" é o número que faz agir.
  const parados = CREDS.filter(credParado).length;
  if(cnt){ cnt.textContent = parados ? parados : ''; cnt.style.color = parados ? '#e0a04a' : ''; }

  if(!CREDS.length){
    box.innerHTML = '<div class="salvo">Nenhum credenciamento registrado para esta empresa ainda.</div>';
    return;
  }
  box.innerHTML = CREDS.map(c => {
    const d = diasDesde(c.solicitado_em), parado = credParado(c);
    const daqui = c.negocio_id === id;
    const trilha = (CRED_HIST[c.id] || []);
    return `<div class="cred${parado?' parado':''}">
      <div class="topo">
        <span class="nome">${esc(c.industria)}</span>
        <span class="selo" style="color:${credCor(c.status)};border-color:${credCor(c.status)}">${esc(credNome(c.status))}</span>
        ${daqui ? '<span class="selo" style="color:var(--azul-claro);border-color:var(--azul-claro)">deste negócio</span>' : ''}
        ${parado ? `<span class="selo" style="color:#e0a04a;border-color:#e0a04a">parado há ${d} dias</span>` : ''}
      </div>
      <div class="meta">
        pedido em ${esc(new Date(c.solicitado_em).toLocaleDateString('pt-BR'))}${d != null ? ` · há ${d} dia(s)` : ''}
        ${c.canal ? ' · por ' + esc(c.canal) : ''}${c.protocolo ? ' · protocolo ' + esc(c.protocolo) : ''}
        ${c.respondido_em ? '<br>respondido em ' + esc(new Date(c.respondido_em).toLocaleDateString('pt-BR')) : ''}
        ${c.contato_nome ? '<br>contato: ' + esc(c.contato_nome) + (c.contato_email ? ' · ' + esc(c.contato_email) : '') : ''}
        ${c.obs ? '<br>' + esc(c.obs) : ''}
      </div>
      <div class="passos">
        ${CRED_FASES.filter(f => f.k !== c.status)
          .map(f => `<button onclick="mudaCredenciamento(${c.id},'${f.k}',${id})">→ ${esc(f.n)}</button>`).join('')}
        <button onclick="cartaCredenciamento(${c.id})" title="monta o pedido pronto pra enviar">📝 Gerar o pedido</button>
      </div>
      ${trilha.length > 1 ? `<div class="trilha"><b>Trilha</b> (escrita pelo banco, não se apaga)<br>
        ${trilha.map(h => esc(new Date(h.quando).toLocaleDateString('pt-BR')) + ' · '
            + (h.de_status ? esc(credNome(h.de_status)) + ' → ' : '') + '<b>' + esc(credNome(h.para_status)) + '</b>'
            + (h.quem ? ' · ' + esc(String(h.quem).split('@')[0]) : '')).join('<br>')}</div>` : ''}
    </div>`;
  }).join('');
}

async function criarCredenciamento(id){
  const msg = document.getElementById('cred-msg'), bt = document.getElementById('cred-bt');
  const industria = (document.getElementById('cred-industria').value||'').trim();
  if(!industria){ msg.textContent = 'escreva a indústria ou laboratório.'; return; }
  bt.disabled = true; msg.textContent = 'salvando…';
  try{
    const n = NEG.find(x => x.id === id);
    if(!n || !n.empresa_id) throw new Error('este negócio não está vinculado a uma empresa — o credenciamento é da empresa');
    const r = await fetch(`${SB_URL}/rest/v1/credenciamentos`, {method:'POST',
      headers: Object.assign({'Prefer':'return=representation'}, SB_H, {'Content-Type':'application/json'}),
      body: JSON.stringify({ empresa_id: n.empresa_id, industria, negocio_id: id,
        canal: document.getElementById('cred-canal').value || null,
        criado_por: (window.gmAuth && gmAuth.user && gmAuth.user.email) || null })});
    if(r.status === 409){
      // O ÍNDICE ÚNICO FALANDO. Não é erro do operador: é a resposta certa pra "eu já pedi isso?".
      throw new Error('já existe um credenciamento desta empresa com "' + industria + '" — ele está na lista acima');
    }
    if(!r.ok) throw new Error('HTTP ' + r.status + (r.status===401||r.status===403 ? ' — sem permissão de gravar' : ''));
    document.getElementById('cred-industria').value = '';
    msg.textContent = 'pedido registrado. A trilha começa agora.';
    await carregarCredenciamentos(id);
  }catch(e){ msg.textContent = 'não consegui salvar: ' + e.message; }
  bt.disabled = false;
}

async function mudaCredenciamento(credId, status, negId){
  const msg = document.getElementById('cred-msg');
  const c = CREDS.find(x => x.id === credId); if(!c) return;
  if(msg) msg.textContent = 'atualizando…';
  try{
    const campos = { status, criado_por: (window.gmAuth && gmAuth.user && gmAuth.user.email) || c.criado_por };
    // RESPONDIDO É UM FATO COM DATA. Aprovado e negado são respostas da indústria; carimbar a
    // data aqui é o que permite dizer depois "levou 23 dias". Voltar pra solicitado LIMPA a data,
    // porque o pedido refeito ainda não foi respondido — manter a antiga faria a conta de dias
    // do novo pedido nascer errada.
    campos.respondido_em = (status === 'aprovado' || status === 'negado') ? new Date().toISOString() : null;
    const r = await fetch(`${SB_URL}/rest/v1/credenciamentos?id=eq.${credId}`, {method:'PATCH',
      headers: Object.assign({}, SB_H, {'Content-Type':'application/json'}), body: JSON.stringify(campos)});
    if(!r.ok) throw new Error('HTTP ' + r.status + (r.status===401||r.status===403 ? ' — sem permissão de gravar' : ''));
    if(msg) msg.textContent = 'status atualizado — a trilha registrou.';
    await carregarCredenciamentos(negId);
    carregar().then(pinta);   // o sino conta os parados do funil inteiro
  }catch(e){ if(msg) msg.textContent = 'não consegui atualizar: ' + e.message; }
}

/* ── O PEDIDO (o documento) ──────────────────────────────────────────────────────────────────
   Gerado, e não escrito na hora, pelo mesmo motivo do aviso de sessão no zap: o que se erra numa
   carta de credenciamento é sempre o mesmo — CNPJ trocado, razão social pela metade, esquecer de
   dizer para qual pregão. Nada aqui é criativo; é a mesma carta com os dados certos.
   >>> OS DADOS DA EMPRESA SAEM DO cliente.config.js, que é a fonte única deles no sistema. Digitar
       o CNPJ aqui criaria a segunda cópia — e número de documento em dois lugares é número que
       um dia diverge. Se o config não tiver o dado, a carta DIZ que falta, em vez de imprimir uma
       linha vazia que passa despercebida. */
function cartaCredenciamento(credId){
  const c = CREDS.find(x => x.id === credId); if(!c) return;
  const emp = (window.LIMEDTEC_CLIENTE && LIMEDTEC_CLIENTE.empresa) || {};
  const n = c.negocio_id ? NEG.find(x => x.id === c.negocio_id) : null;
  const falta = [];
  const dado = (v, nome) => { if(v) return v; falta.push(nome); return '«' + nome + ' — falta no cadastro»'; };
  const hoje = new Date().toLocaleDateString('pt-BR', {day:'2-digit', month:'long', year:'numeric'});

  const corpo = [
    'Ao Departamento Comercial de ' + c.industria,
    '',
    'Assunto: solicitação de credenciamento como distribuidor',
    '',
    'Prezados,',
    '',
    'A empresa ' + dado(emp.razaoSocial || emp.nome, 'razão social')
      + ', inscrita no CNPJ ' + dado(emp.cnpj, 'CNPJ')
      + (emp.endereco ? ', com sede em ' + emp.endereco : '')
      + ', vem solicitar seu credenciamento junto a ' + c.industria
      + ' para aquisição e revenda de seus produtos.',
    '',
    (n ? 'A solicitação decorre da participação no certame ' + (n.numero ? 'nº ' + n.numero : '')
        + (n.orgao ? ' — ' + n.orgao : '') + (n.objeto ? ', cujo objeto é ' + n.objeto : '') + '.'
       : 'A solicitação decorre da participação em certames públicos de fornecimento de medicamentos '
        + 'e material hospitalar.'),
    '',
    'Colocamo-nos à disposição para o envio da documentação que se fizer necessária.',
    '',
    'Atenciosamente,',
    '',
    dado(emp.razaoSocial || emp.nome, 'razão social'),
    'CNPJ ' + dado(emp.cnpj, 'CNPJ'),
    [emp.telefone, emp.email].filter(Boolean).join(' · '),
    '',
    // A CIDADE DA ASSINATURA É A DA EMPRESA, e não um padrão. Chutar "Goiânia" numa carta
    // assinada por uma empresa de Aparecida de Goiânia é errar o único dado que ninguém confere.
    dado(emp.cidade, 'cidade da empresa') + ', ' + hoje + '.',
  ].join('\n');

  // O AVISO DO QUE FALTA VEM ANTES do texto, e o texto sai com o buraco MARCADO («…»). Uma carta
  // com o CNPJ faltando em branco é uma carta que alguém envia sem ver.
  const janela = window.open('', '_blank');
  if(!janela){ alert('o navegador bloqueou a janela — libere o pop-up pra gerar o pedido'); return; }
  janela.document.write('<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">'
    + '<title>Pedido de credenciamento — ' + esc(c.industria) + '</title>'
    + '<style>body{font:14px/1.7 Georgia,serif;max-width:720px;margin:36px auto;padding:0 24px;color:#111}'
    + 'pre{font:inherit;white-space:pre-wrap}'
    + '.falta{background:#fff4d6;border-left:4px solid #e0a04a;padding:11px 14px;margin-bottom:22px;'
    + 'font-family:system-ui,sans-serif;font-size:13px}'
    + '.acao{margin:26px 0;font-family:system-ui,sans-serif}'
    + 'button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid #ccc;background:#f5f5f5;cursor:pointer}'
    + '@media print{.falta,.acao{display:none}}</style></head><body>'
    + (falta.length ? '<div class="falta"><b>Falta no cadastro da empresa: ' + esc(falta.join(', ')) + '.</b><br>'
        + 'O texto abaixo está com o lugar marcado entre «». Complete no cadastro e gere de novo — '
        + 'carta com dado em branco é carta que se envia sem ver.</div>' : '')
    + '<div class="acao"><button onclick="window.print()">🖨️ Imprimir / PDF</button></div>'
    + '<pre>' + esc(corpo) + '</pre></body></html>');
  janela.document.close();
}

/* ── "AVISAR NO ZAP" — o que dá pra fazer DE GRAÇA, dito com todas as letras ─────────────────
   Mandar WhatsApp SOZINHO exige contratar (API oficial do WhatsApp Business ou provedor tipo
   Twilio): tem custo por mensagem e cadastro da empresa. Nada disso foi contratado.
   O que existe aqui é o caminho gratuito: abrir o WhatsApp já com a MENSAGEM ESCRITA, e a
   pessoa só escolhe o contato e aperta enviar. Um clique a mais, zero mensalidade.
   >>> A MENSAGEM É MONTADA AQUI, e não digitada na hora, porque é isso que ela entrega: ninguém
       erra o horário nem esquece o nº do pregão às 7h da manhã. É o mesmo motivo de a carta de
       credenciamento ser gerada em vez de escrita. */
function textoAvisoSessao(n){
  const q = n.abertura ? new Date(n.abertura) : null;
  const dia = q ? q.toLocaleDateString('pt-BR') : 'data a confirmar';
  const hora = horaDe(n.abertura);
  const partes = [
    '*Sessão de licitação*',
    [n.modalidade, n.numero].filter(Boolean).join(' ') || 'Certame',
    n.orgao ? 'Órgão: ' + n.orgao : null,
    (n.municipio || n.uf) ? 'Local: ' + [n.municipio, n.uf].filter(Boolean).join('/') : null,
    'Abertura: ' + dia + (hora ? ' às ' + hora : ''),
    n.portal ? 'Portal: ' + n.portal : null,
  ].filter(Boolean);
  return partes.join('\n');
}
function avisarNoZap(id){
  const n = NEG.find(x => x.id === id); if(!n) return;
  // wa.me sem número: o WhatsApp abre a lista de contatos com o texto pronto. Escolher o contato
  // é da pessoa — o sistema não tem (nem quer ter) a agenda dela.
  window.open('https://wa.me/?text=' + encodeURIComponent(textoAvisoSessao(n)), '_blank', 'noopener');
}

async function criarLembrete(id){
  const msg = document.getElementById('lem-msg'), bt = document.getElementById('lem-bt');
  const titulo = (document.getElementById('lem-titulo').value||'').trim();
  const quando = document.getElementById('lem-quando').value;
  if(!titulo){ msg.textContent = 'escreva o que precisa ser feito.'; return; }
  if(!quando){ msg.textContent = 'escolha a data e a hora — lembrete sem quando não avisa nada.'; return; }
  bt.disabled = true; msg.textContent = 'agendando…';
  try{
    const n = NEG.find(x => x.id === id);
    const r = await fetch(`${SB_URL}/rest/v1/lembretes`, {method:'POST',
      headers: Object.assign({'Prefer':'return=representation'}, SB_H, {'Content-Type':'application/json'}),
      body: JSON.stringify({ negocio_id: id, empresa_id: (n && n.empresa_id) || null, titulo,
        quando: new Date(quando).toISOString(), prioridade: document.getElementById('lem-prio').value })});
    if(!r.ok) throw new Error(r.status===401||r.status===403 ? 'só gestor agenda lembrete' : ('HTTP '+r.status));
    document.getElementById('lem-titulo').value = '';
    msg.textContent = '';
    await carregarLembretes(id);
    pintaNotif();                       // o sino passa a contar este lembrete na hora
  }catch(e){ msg.textContent = '⚠️ ' + e.message; }
  bt.disabled = false;
}
async function marcarLembrete(negId, id, feito){
  try{
    await fetch(`${SB_URL}/rest/v1/lembretes?id=eq.${id}`, {method:'PATCH',
      headers: Object.assign({}, SB_H, {'Content-Type':'application/json'}),
      body: JSON.stringify({ feito, feito_em: feito ? new Date().toISOString() : null,
                             atualizado_em: new Date().toISOString() })});
    const l = LEMBRETES.find(x => x.id === id); if(l) l.feito = feito;
    pintaLembretes(negId); pintaNotif();
  }catch(e){ /* a marcação volta no próximo carregamento; não vale travar a ficha por isso */ }
}

// ══ SITUAÇÃO DO CERTAME ══════════════════════════════════════════════════════════════════
// É FATO DO MUNDO, não fase do funil — por isso é campo próprio e não um `estagio` novo. Um
// pregão suspenso continua na fase em que estava (qualificação, disputa); misturar as duas
// coisas faria a empresa perder a informação de onde parou quando ele voltar.
const SITUACOES = [
  { k:'normal',    n:'Normal',    cor:null },
  { k:'adiado',    n:'ADIADO',    cor:'#e0a04a' },
  { k:'remarcado', n:'REMARCADO', cor:'#5CC3F0' },
  { k:'suspenso',  n:'SUSPENSO',  cor:'#e0a04a' },
  { k:'cancelado', n:'CANCELADO', cor:'#e5675a' },
];
const rotuloSituacao = k => (SITUACOES.find(s=>s.k===k)||{}).n || k;
const corSituacao    = k => (SITUACOES.find(s=>s.k===k)||{}).cor || null;
// >>> "PARADO" NÃO É "SUMIDO": cancelado e suspenso continuam no funil, com etiqueta e visual
//     esmaecido. Sumir sozinho esconderia da empresa que ela tinha algo ali — e arquivar
//     continua sendo decisão de gente, como já era.
const paradoDeVez = k => k === 'cancelado' || k === 'suspenso';

// ══ EDITAR UM CAMPO POR VEZ ══════════════════════════════════════════════════════════════
// Cada campo abre sozinho, salva sozinho e fecha. Só UM aberto de cada vez — dois campos
// abertos já seriam o "modo edição" de volta, com o mesmo risco de salvar o que não se quis.
const CAMPOS_FICHA = {
  abertura:       { rot:'Abertura',                tipo:'datahora' },
  situacao:       { rot:'Situação',                tipo:'lista' },
  portal:         { rot:'Portal',                  tipo:'texto' },
  numero:         { rot:'Número',                  tipo:'texto' },
  orgao:          { rot:'Órgão',                   tipo:'texto' },
  objeto:         { rot:'Objeto',                  tipo:'longo' },
  valor_estimado: { rot:'Valor estimado',          tipo:'moeda' },
  valor_ganho:    { rot:'Valor do contrato ganho', tipo:'moeda' },
};
let _campoAberto = null;

function editarCampo(id, k){
  const n = NEG.find(x => x.id === id); if(!n) return;
  const cfg = CAMPOS_FICHA[k]; if(!cfg) return;
  if(_campoAberto && _campoAberto !== k) abrirDrawer(id);      // fecha o outro antes de abrir este
  _campoAberto = k;
  const box = document.getElementById('fc-' + k); if(!box) return;
  let entrada;
  if(cfg.tipo === 'datahora'){
    entrada = `<input type="date" id="ec-data" value="${esc(diaDe(n.abertura)||'')}">
               <input type="time" id="ec-hora" value="${esc(horaDe(n.abertura)||'')}">`;
  } else if(cfg.tipo === 'lista'){
    entrada = `<select id="ec-v">${SITUACOES.map(s =>
      `<option value="${s.k}"${(n.situacao||'normal')===s.k?' selected':''}>${esc(s.n)}</option>`).join('')}</select>`;
  } else if(cfg.tipo === 'longo'){
    entrada = `<textarea id="ec-v" rows="3">${esc(n[k]||'')}</textarea>`;
  } else if(cfg.tipo === 'moeda'){
    entrada = `<input type="number" id="ec-v" step="0.01" min="0" value="${n[k]!=null?n[k]:''}" placeholder="0,00">`;
  } else {
    entrada = `<input type="text" id="ec-v" value="${esc(n[k]||'')}">`;
  }
  box.innerHTML = `<div class="fc-edit">
      <label>${esc(cfg.rot)}</label>
      <div class="fc-in">${entrada}</div>
      <div class="fc-acoes">
        <button class="btn-ed" onclick="salvarCampo(${id},'${k}')" id="ec-bt">Salvar</button>
        <button class="btn-ed sec" onclick="abrirDrawer(${id})">Cancelar</button>
        <span class="salvo" id="ec-msg"></span>
      </div>
    </div>`;
  const foco = document.getElementById('ec-v') || document.getElementById('ec-data');
  if(foco) foco.focus();
}

async function salvarCampo(id, k){
  const n = NEG.find(x => x.id === id); if(!n) return;
  const cfg = CAMPOS_FICHA[k];
  const bt = document.getElementById('ec-bt'), msg = document.getElementById('ec-msg');
  let valor;
  if(cfg.tipo === 'datahora'){
    const data = (document.getElementById('ec-data').value||'').trim();
    const hora = (document.getElementById('ec-hora').value||'').trim();
    // A REGRA DO FUSO já mordeu este projeto uma vez (negócio nascendo arquivado por causa de
    // meia-noite UTC): a abertura é montada como hora LOCAL e o navegador converte.
    valor = data ? new Date(data + 'T' + (hora || '00:00') + ':00').toISOString() : null;
  } else if(cfg.tipo === 'moeda'){
    const s = (document.getElementById('ec-v').value||'').trim();
    valor = s === '' ? null : Number(s);
    if(valor != null && !isFinite(valor)){ msg.textContent = 'valor inválido.'; return; }
  } else {
    valor = (document.getElementById('ec-v').value||'').trim() || null;
    if(k === 'situacao' && !valor) valor = 'normal';
  }
  bt.disabled = true; msg.textContent = 'salvando…';
  try{
    await gravar(id, { [k]: valor });
    n[k] = valor;                       // memória local acompanha, sem recarregar tudo
    _campoAberto = null;
    abrirDrawer(id);                    // repinta a ficha com o valor novo e recarrega o rastro
    // A AGENDA E O SINO PASSAM A USAR O VALOR NOVO NA HORA. Sem isto o operador salvaria a nova
    // data e continuaria vendo o negócio no dia velho — e concluiria que não salvou.
    pinta(); pintaNotif();
  }catch(e){
    msg.textContent = '⚠️ não salvou: ' + e.message;
    bt.disabled = false;
  }
}

// ── O RASTRO ── quem mudou o quê, e quando. Gravado por GATILHO no banco (ddl/negocios_
// editavel.sql): se dependesse desta tela, alterar por outra via não deixaria rastro nenhum.
async function carregarRastro(id){
  const box = document.getElementById('dw-rastro'); if(!box) return;
  try{
    const r = await fetch(`${SB_URL}/rest/v1/negocio_alteracoes?negocio_id=eq.${id}&select=campo,de,para,quem_email,quando&order=quando.desc&limit=12`, {headers:SB_H});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    if(!d.length){ box.innerHTML = ''; return; }
    const rot = { abertura:'Abertura', situacao:'Situação', portal:'Portal', numero:'Número', orgao:'Órgão', objeto:'Objeto' };
    box.innerHTML = '<h4>O que já foi alterado</h4>'
      + d.map(x => `<div class="rastro"><b>${esc(rot[x.campo]||x.campo)}</b>: ${esc(x.de||'—')} → ${esc(x.para||'—')}
           <span>por ${esc((x.quem_email||'alguém').split('@')[0])} em ${new Date(x.quando).toLocaleString('pt-BR')}</span></div>`).join('');
  }catch(e){ box.innerHTML = '<h4>O que já foi alterado</h4><div class="salvo">não consegui ler o histórico de alterações</div>'; }
}

async function mudaFase(id, fase){
  const n = NEG.find(x => x.id === id); if(!n || n.estagio === fase) return;
  const antes = n.estagio;
  n.estagio = fase; abrirDrawer(id); pinta();
  try{ await gravar(id, { estagio: fase }); }
  catch(e){ n.estagio = antes; abrirDrawer(id); pinta(); alert('Não consegui mudar o estágio: ' + e.message); }
}

// `marcaTarefa` foi REMOVIDA em 11/08, junto com o checklist fixo que a chamava. Código morto
// guardado "por via das dúvidas" é o que envelhece errado — o `negocios.tarefas` continua no
// banco, e o git guarda esta função inteira se um dia ela voltar a ser necessária.

async function salvaAnot(id, txt){
  const n = NEG.find(x => x.id === id); if(!n) return;
  const v = String(txt||'');
  const msg = document.getElementById('dw-anot-msg');
  if(v === String(n.anotacoes||'')) { if(msg){ msg.className='salvo'; msg.textContent='salva ao sair do campo'; } return; }
  if(msg){ msg.className='salvo'; msg.textContent='salvando…'; }

    pinta();
  }catch(e){
    if(msg){ msg.className='salvo erro'; msg.textContent='não salvou: ' + e.message + ' — copie o texto antes de sair'; }
  }
}

// ── o sino na tela ──────────────────────────────────────────────────────────────────────
function pintaNotif(){
  const n = notificacoes(NEG);
  const cnt = document.getElementById('sino-n');
  // >>> DOCUMENTO VENCIDO ENTRA NO BADGE, e a sessão atrasada não — a diferença não é capricho.
  //     O badge não soma sessão passada porque aquilo NÃO TEM MAIS CONSERTO: o número ficaria
  //     aceso pra sempre com histórico velho, e badge que nunca zera ninguém mais olha.
  //     Certidão vencida é o oposto: fica acesa até alguém RESOLVER, e resolver é possível hoje.
  //     Um badge que apaga sozinho quando o problema continua é pior que badge nenhum.
  const docsRuins = Array.isArray(DOCS) ? DOCS.filter(d => d.situacao==='vencido' || d.situacao==='vencendo').length : 0;
  // Lembrete entra no badge pela MESMA razão do documento: ele fica aceso até alguém RESOLVER,
  // e resolver é possível — é justamente para isso que ele foi criado.
  const lemAbertos = Array.isArray(LEM_SINO) ? LEM_SINO.length : 0;
  // Credenciamento parado entra no badge pela MESMA regra do documento vencido: fica aceso até
  // alguém RESOLVER, e resolver é possível hoje — basta cobrar a indústria ou registrar a
  // resposta que já veio. É o oposto da sessão que passou, que não tem mais conserto.
  const credParados = Array.isArray(CRED_SINO) ? CRED_SINO.length : 0;
  const total = n.urgentes + docsRuins + lemAbertos + credParados;
  cnt.textContent = total;
  cnt.style.display = total ? '' : 'none';
  const linha = (x, cls, zap) => {
    const h = horaDe(x.abertura);
    // O "avisar no zap" só nas sessões de hoje e amanhã: é onde avisar alguém ainda muda o
    // resultado. Na lista do que já passou ele seria só mais um botão.
    return `<a class="nf ${cls||''}" onclick="irPara(${x.id})">
      <div class="q">${h ? h + ' · ' : ''}${esc(x.orgao || x.objeto || 'negócio')}</div>
      <div class="s">${esc([x.portal, x.numero, x.municipio].filter(Boolean).join(' · '))}
        ${zap ? `<span onclick="event.stopPropagation();avisarNoZap(${x.id})" title="abre o WhatsApp com a mensagem pronta"
             style="margin-left:8px;cursor:pointer;color:var(--verde)">📱 avisar no zap</span>` : ''}</div></a>`;
  };
  let h = '';
  if(n.hoje.length)   h += `<div class="nf-sec">abre hoje</div>` + n.hoje.map(x=>linha(x,'hoje',true)).join('');
  if(n.amanha.length) h += `<div class="nf-sec">abre amanhã</div>` + n.amanha.map(x=>linha(x,'',true)).join('');
  if(n.passou.length) h += `<div class="nf-sec">a sessão passou e o negócio continua na fase anterior (${n.passou.length})</div>`
                         + n.passou.slice(0,8).map(x=>linha(x)).join('');
  // ── DOCUMENTO VENCENDO ── o bloco que estava registrado como IMPOSSÍVEL ("depende de Meus
  //    Documentos, que não existe"). Existe desde 08/08, então ele entra.
  //    >>> ELE VEM PRIMEIRO NA LISTA, e não no fim: certidão vencida DESCLASSIFICA. Uma sessão
  //        que abre hoje ainda dá pra correr atrás; habilitação vencida na hora da sessão, não.
  if(DOCS === 'erro'){
    // mesma regra do resto do sino: falha de leitura vira "não sei", nunca "está tudo certo"
    h = '<div class="nf-sec">documentos</div><div class="nf-vazio">⚠️ Não consegui ler os documentos, então <b>não sei</b> se há certidão vencendo.</div>' + h;
  } else if(Array.isArray(DOCS)){
    const ruins = DOCS.filter(d => d.situacao === 'vencido' || d.situacao === 'vencendo');
    if(ruins.length){
      h = '<div class="nf-sec">habilitação — resolver antes da próxima sessão</div>'
        + ruins.slice(0,6).map(d => `<a class="nf ${d.situacao==='vencido'?'hoje':''}" href="fpmed_documentos.html">
             <div class="q">${d.situacao==='vencido' ? '⛔' : '⚠️'} ${esc(d.nome)}</div>
             <div class="s">${d.situacao==='vencido'
                 ? 'venceu há ' + Math.abs(d.dias_para_vencer) + ' dia(s)'
                 : 'vence em ' + d.dias_para_vencer + ' dia(s)'}</div></a>`).join('')
        + h;
    }
  }
  // ── LEMBRETES ── entram DEPOIS das sessões e antes do resto: sessão tem hora marcada pelo
  //    órgão e não se remarca; lembrete é compromisso interno, e esse a empresa controla.
  if(LEM_SINO === 'erro'){
    h += '<div class="nf-sec">lembretes</div><div class="nf-vazio">⚠️ Não consegui ler os lembretes, então <b>não sei</b> o que está agendado.</div>';
  } else if(Array.isArray(LEM_SINO) && LEM_SINO.length){
    const agora = new Date();
    h += '<div class="nf-sec">lembretes e tarefas agendados</div>'
      + LEM_SINO.slice(0,8).map(l => {
          const q = new Date(l.quando), atrasado = q < agora;
          // O sino DIZ se é tarefa ou lembrete: "tarefa atrasada" e "lembrete atrasado" pedem
          // coisas diferentes de quem lê, e um rótulo só faria as duas parecerem a mesma.
          const eTarefa = l.tipo === 'tarefa';
          return `<a class="nf ${atrasado?'hoje':''}" onclick="irPara(${l.negocio_id})">
            <div class="q">${atrasado?'⏰':(eTarefa?'✔':'🔔')} ${esc(l.titulo)}</div>
            <div class="s">${eTarefa?'tarefa · ':''}${q.toLocaleString('pt-BR')}${atrasado?' · atrasad'+(eTarefa?'a':'o'):''} · prioridade ${esc(l.prioridade)}</div></a>`;
        }).join('');
  }
  /* ── CREDENCIAMENTO PARADO ── por último na lista, e de propósito: ele é o mais LENTO dos
        avisos. Sessão é hoje, certidão vence em dias, credenciamento arrasta semanas. Pôr no
        topo o que se resolve devagar empurraria pra baixo o que se resolve hoje. */
  if(CRED_SINO === 'erro'){
    h += '<div class="nf-sec">credenciamentos</div><div class="nf-vazio">⚠️ Não consegui ler os credenciamentos, então <b>não sei</b> se há pedido parado.</div>';
  } else if(Array.isArray(CRED_SINO) && CRED_SINO.length){
    h += `<div class="nf-sec">credenciamento sem resposta há mais de ${CRED_DIAS_PARADO} dias</div>`
      + CRED_SINO.slice(0,8).map(c => {
          const d = diasDesde(c.solicitado_em);
          // Sem negócio de origem o clique não teria pra onde ir — o credenciamento é da empresa,
          // e pode ter nascido antes de qualquer negócio. Aí o item informa e não navega.
          const vai = c.negocio_id ? `onclick="irPara(${c.negocio_id})"` : '';
          return `<a class="nf" ${vai}>
            <div class="q">🏭 ${esc(c.industria)}</div>
            <div class="s">${esc(credNome(c.status))} há ${d} dia(s)${c.negocio_id?'':' · sem negócio de origem'}</div></a>`;
        }).join('');
  }
  if(!h) h = '<div class="nf-vazio">Nada abre hoje nem amanhã, nenhum documento vencendo, nenhum lembrete no prazo e nenhum credenciamento parado.<br>O sino só mostra sessão de negócio <b>ativo</b> — arquivado não avisa.</div>';
  document.getElementById('notif').innerHTML = h;
}
function toggleNotif(ev){
  if(ev) ev.stopPropagation();
  document.getElementById('notif').classList.toggle('open');
}
function irPara(id){
  document.getElementById('notif').classList.remove('open');
  abrirDrawer(id);
}
// clicar fora fecha — painel que só fecha no próprio botão vira painel que fica aberto
document.addEventListener('click', e => {
  const p = document.getElementById('notif');
  if(p && p.classList.contains('open') && !e.target.closest('.sino-cx')) p.classList.remove('open');
});

function setVis(v){
  VIS = v;
  ['lista','quadros','agenda'].forEach(x => {
    const b = document.getElementById('v-'+x); if(b) b.classList.toggle('on', x===v);
  });
  document.querySelectorAll('header nav a').forEach((a,i) => a.classList.toggle('on', (i===0&&v==='lista')||(i===1&&v==='quadros')||(i===2&&v==='agenda')));
  pinta();
}
/* ── "IR PRO FUNIL" — do cartão da lista para a coluna dele nos Quadros ──────────────────────
   A lista responde "o que eu tenho"; o funil responde "em que pé está". Quem vê um negócio na
   lista e quer o segundo tinha que trocar de visão e CAÇAR o card entre as colunas — e o
   nome/número do card é curto, então caçar com o olho é justamente o que dá errado.

   >>> O FILTRO DE FASE TEM QUE SAIR DA FRENTE, E ISSO É DITO. Se a pessoa clicou numa etiqueta de
       fase (a barra de cima) e depois manda ir pro funil de um negócio de OUTRA fase, o card
       simplesmente não estaria lá — a tela "obedeceria" e não mostraria nada, que é o pior
       desfecho: parece que o botão não funciona. Aqui o filtro é solto QUANDO ele esconderia o
       alvo, e o aviso na tela diz que foi solto. O filtro de EMPRESA não é mexido: ele responde
       "de quem é este funil", e um negócio de outra empresa aparecendo ali seria a resposta errada
       pra pergunta que a pessoa fez — nesse caso a tela avisa e não vai.
   >>> O DESTAQUE É TEMPORÁRIO de propósito: ele serve pra achar com o olho, não pra marcar
       estado. Marca que fica vira sujeira que ninguém sabe como tirar. */
let _destaque = null;
function irProFunil(id){
  const n = NEG.find(x => x.id === id);
  if(!n) return;

  // arquivado não aparece no kanban: reabrir o filtro é o único jeito de o alvo existir lá
  if(n.arquivado) document.getElementById('f-arquivados').checked = true;

  const emp = document.getElementById('f-empresa').value;
  if(emp && String(n.empresa_id) !== emp){
    avisoFunil('Este negócio é de outra empresa e o filtro atual só mostra uma. '
      + 'Troque para "Todas as empresas" e clique de novo.', true);
    return;
  }
  let soltouFase = false;
  if(FASE_SEL && FASE_SEL !== n.estagio){ FASE_SEL = null; soltouFase = true; }

  _destaque = id;
  setVis('quadros');           // pinta() roda aqui dentro e o card já sai marcado
  if(soltouFase) avisoFunil('Tirei o filtro de fase para mostrar este negócio na coluna dele.');
}

// O aviso é uma faixa curta acima do conteúdo, e some sozinha: é explicação de um clique que
// acabou de acontecer, não um estado do sistema.
function avisoFunil(txt, erro){
  const c = document.getElementById('corpo');
  if(!c) return;
  const d = document.createElement('div');
  d.className = 'vazio';
  d.style.cssText = 'margin-bottom:12px;padding:10px 14px;text-align:left;font-size:12.5px'
    + (erro ? ';border-color:#5a2622;background:#2a1614;color:#f2a99f' : '');
  d.textContent = txt;
  c.insertBefore(d, c.firstChild);
  setTimeout(() => { if(d.parentNode) d.parentNode.removeChild(d); }, 6000);
}

// Chamado no fim de cada pintura dos Quadros. Rola até o card e acende o realce.
function aplicarDestaque(){
  if(!_destaque) return;
  const alvo = document.querySelector('.card[data-id="' + _destaque + '"]');
  _destaque = null;                       // uma vez só: repintar depois não reacende
  if(!alvo) return;
  alvo.classList.add('achado');
  alvo.scrollIntoView({ behavior:'smooth', block:'center', inline:'center' });
  setTimeout(() => alvo.classList.remove('achado'), 4000);
}

function selFase(k){ FASE_SEL = (FASE_SEL===k) ? null : k; pinta(); }
function verArquivados(){ document.getElementById('f-arquivados').checked = true; setVis('lista'); }
function toggleFiltro(){
  const b = document.getElementById('f-busca');
  b.style.display = b.style.display==='none' ? '' : 'none';
  if(b.style.display==='') b.focus(); else { b.value=''; pinta(); }
}

// Mesma corrida do gm-auth que mordeu o Licitações em 05/08: com token fresco o
// `gm-auth-ready` dispara ainda dentro do <head>, antes deste script existir. Então checa
// primeiro se já está pronto, e só escuta o evento se não estiver.
/* QUEM VEIO DO ENCONTRAR clicando em "+ Incluir licitação" chega com o formulário já aberto — e
   com o termo que ele procurou no objeto. Consumido de uma vez: recarregar a tela não pode
   reabrir um formulário que a pessoa já fechou. */
function formManualDaSessao(){
  let ctx = null;
  try{
    ctx = JSON.parse(sessionStorage.getItem('fpmed_incluir_manual') || 'null');
    sessionStorage.removeItem('fpmed_incluir_manual');
  }catch(e){ return; }
  if(!ctx) return;
  abrirFormManual();
  const ob = document.getElementById('m-objeto');
  if(ob && ctx.objeto) ob.value = ctx.objeto;
}
function _aoAutenticar(){ carregar().then(() => { pinta(); formManualDaSessao(); }); abreLeitorNaBarra(); }
if(window.gmAuth) _aoAutenticar();
else document.addEventListener('gm-auth-ready', _aoAutenticar, { once:true });
</script>
