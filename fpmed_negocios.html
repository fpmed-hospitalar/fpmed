    document.getElementById('kpis').style.display='none';
    // o sino NÃO pode dizer "nada abre hoje" quando o que houve foi falha de leitura: com a
    // lista vazia por erro, "nenhum aviso" e "não sei" são a mesma tela — e não são a mesma coisa.
    document.getElementById('sino-n').style.display='none';
    document.getElementById('notif').innerHTML =
      '<div class="nf-vazio"><svg class="ic" aria-hidden="true"><use href="#ic-alerta"/></svg> Não consegui ler os negócios, então <b>não sei</b> o que abre hoje.<br>Recarregue a página.</div>';
    return;
  }
  const arq = document.getElementById('f-arquivados').checked;
  const base = NEG.filter(n => arq ? true : !n.arquivado);
  // chips: a contagem é do universo visível, NÃO do filtro de fase — senão o chip que você
  // acabou de clicar seria o único com número, e os outros mostrariam zero.
  document.getElementById('fases').innerHTML = FASES.map(f => {
    const n = base.filter(x => x.estagio === f.k).length;
    return `<div class="chip${FASE_SEL===f.k?' on':''}" onclick="selFase('${f.k}')">
      <span class="bola" style="background:${f.c}"></span>${f.n} <span class="n">(${n})</span></div>`;
  }).join('') + (FASE_SEL ? `<div class="chip" onclick="selFase(null)">✕ limpar fase</div>` : '');

  const gestor = ehGestor();
  const k = numerosDoTopo();
  document.getElementById('kpis').style.display='grid';
  /* ── AS CAIXINHAS VIRARAM BOTÕES (11/08) ─────────────────────────────────────────────────
     Cada uma abre o detalhe de onde o número veio. Cartão que é botão precisa PARECER botão:
     daí o cursor de mão e o hover — sem isso ninguém descobre que dá pra clicar, e a função
     existe só pra quem leu o commit. */
  document.getElementById('kpis').innerHTML = `
    <div class="kpi bt" onclick="abrirPainel('funil')" title="mostra os negócios ativos"><b>${k.noFunil}</b><span>no funil agora</span></div>
    <div class="kpi bt" onclick="abrirPainel('historico')" title="todos os negócios, inclusive arquivados"><b>${k.historico.toLocaleString('pt-BR')}${window._negTruncou?'+':''}</b><span>no histórico${window._negTruncou?' (leitura truncada)':''}</span></div>
    <div class="kpi bt" onclick="abrirPainel('ganhas')" title="a lista das ganhas, com valor de cada uma"><b>${k.ganhos.length}</b><span>ganhas</span></div>
    <div class="kpi bt" onclick="abrirPainel('taxa')" title="de onde sai a conta"><b>${k.taxaTxt}</b><span>taxa de vitória</span></div>
    ${gestor ? `<div class="kpi bt" onclick="abrirPainel('total')" title="a soma das ganhas"><b style="font-size:16px">${brl(k.total)}</b><span>total ganho</span></div>` : ''}`;

  pintaNotif();          // o sino conta o funil inteiro, não o que os filtros deixaram na tela
  const l = visiveis();
  const corpo = document.getElementById('corpo');
  if(VIS === 'quadros') { corpo.innerHTML = kanban(l); ligarArrasto(); aplicarDestaque(); return; }
  if(VIS === 'agenda')  { corpo.innerHTML = agenda(l); return; }
  if(VIS === 'calendario'){ corpo.innerHTML = calendario(l); return; }
  corpo.innerHTML = l.length ? l.slice(0,200).map(n => card(n)).join('') : vazioComAcao();
}

/* ══ O VAZIO QUE NÃO É BECO ══════════════════════════════════════════════════════════════════
   Ele dizia "Nenhum negócio com esses filtros." e parava ali. O problema desse texto não é ser
   curto: é que ele deixa a pessoa sem saber SE O SISTEMA QUEBROU OU SE ELA FILTROU ERRADO — e
   as duas hipóteses pedem ações opostas (chamar alguém x mexer no filtro).
   >>> ENTÃO ELE DIZ QUAL FILTRO ESTÁ SEGURANDO O RESULTADO, com o valor na frente, e oferece a
       próxima jogada. Um "limpar filtros" genérico não ensina nada; dizer "a fase Disputa e a
       busca por 'anápolis'" mostra onde a pessoa se enganou, e ela aprende a ferramenta.
   >>> E O CASO SEM FILTRO NENHUM É OUTRO TEXTO, de propósito: aí o funil está mesmo vazio, e a
       ação certa não é limpar coisa nenhuma — é incluir a primeira licitação. */
function vazioComAcao(){
  const arq = document.getElementById('f-arquivados').checked;
  const emp = document.getElementById('f-empresa');
  const q   = (document.getElementById('f-busca').value||'').trim();
  const ativos = [];
  if(FASE_SEL) ativos.push('fase <b>' + esc(nomeFase(FASE_SEL)) + '</b>');
  if(q) ativos.push('busca por <b>' + esc(q) + '</b>');
  if(emp.value) ativos.push('empresa <b>' + esc(emp.options[emp.selectedIndex].text) + '</b>');
  if(!arq) ativos.push('somente <b>não arquivados</b>');

  // sem NENHUM filtro de conteúdo, o funil está vazio de verdade
  const soPadrao = !FASE_SEL && !q && !emp.value;
  return `<div class="fp-vazio">
    <div class="fp-vazio__titulo">${soPadrao ? 'Nenhum negócio no funil ainda' : 'Nenhum negócio com esses filtros'}</div>
    <div class="fp-vazio__texto">${soPadrao
      ? 'Quando uma licitação virar negócio, ela aparece aqui — pela busca do Encontrar ou incluída à mão.'
      : 'Está filtrando por ' + ativos.join(' · ') + '.'}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
      ${soPadrao ? '' : `<button class="btn-ed sec" onclick="limparFiltros()">Limpar os filtros</button>`}
      <button class="btn-ed" onclick="abrirFormManual()">+ Incluir licitação</button>
    </div>
  </div>`;
}

function limparFiltros(){
  FASE_SEL = null;
  document.getElementById('f-busca').value = '';
  document.getElementById('f-empresa').value = '';
  // "ver arquivados" NÃO é ligado aqui: ele não estava escondendo nada por engano — é uma
  // escolha de escopo que a pessoa fez. Limpar filtro não pode trazer de volta o que ela
  // arquivou de propósito.
  pinta();
}

/* ── O SELO DA CONFERÊNCIA NO CARD ───────────────────────────────────────────────────────────
   O resultado só valia dentro da ficha, e quem precisa dele é quem está olhando o funil na
   véspera do pregão. O selo responde, sem abrir nada, a única pergunta que importa: **tem item
   acima do teto?**
   >>> ELE SÓ APARECE QUANDO HÁ CONFERÊNCIA. Card sem selo quer dizer "não conferido", e não
       "está tudo certo" — por isso não existe um selo cinza de "ok" para quem nunca conferiu.
       Um selo neutro em 200 cards ensinaria a ignorar os vermelhos. */
let CONF_POR_NEGOCIO = {};
function seloConferencia(id){
  const c = CONF_POR_NEGOCIO[id];
  if(!c) return '';
  return c.acima > 0
    ? `<span class="mod" style="color:var(--vermelho-700);border-color:var(--vermelho-300)" title="conferido contra a CMED: ${c.acima} item(ns) acima do teto legal"><svg class="ic" aria-hidden="true"><use href="#ic-alerta"/></svg> ${c.acima} acima do teto</span>`
    : `<span class="mod" style="color:var(--verde-700);border-color:var(--verde-300)" title="conferido contra a CMED: nenhum item acima do teto"><svg class="ic" aria-hidden="true"><use href="#ic-balanca"/></svg> dentro do teto</span>`;
}

function card(n, noKanban){
  // O medidor "4/15" saiu do card em 11/08 junto com o checklist fixo (decisão do Lemuel: a
  // equipe não usa). O `tarefas` continua no banco — some da tela, não do dado.
  const dia = diaDe(n.abertura), hoje = hojeYMD();
  const quando = dia === hoje ? ' hoje' : (dia && dia < hoje ? ' passou' : '');
  // Os campos do card são os que a FPMED já usa na planilha: portal, órgão, número,
  // data/hora de abertura. O valor ganho é de gestor.
  // CANCELADO/SUSPENSO ganha etiqueta e fica esmaecido, mas CONTINUA NO FUNIL. Sumir sozinho
  // esconderia da empresa que ela tinha algo ali; arquivar segue sendo decisão de gente.
  const sit = n.situacao && n.situacao !== 'normal' ? n.situacao : null;
  return `<div class="card${sit&&paradoDeVez(sit)?' parado':''}" ${noKanban?`draggable="true" data-id="${n.id}"`:''} onclick="abrirDrawer(${n.id})">
    ${sit ? `<div class="sit-tag" style="color:${corSituacao(sit)};border-color:${corSituacao(sit)}">${esc(rotuloSituacao(sit))}</div>` : ''}
    <!-- A ETIQUETA DE FASE SOLTA VIROU PROGRESSO. Ela dizia "Qualificação" e pronto; o card
         agora diz em que ponto do caminho isso é. No kanban a coluna já diz a fase, então lá o
         indicador seria a mesma informação duas vezes — e card com informação repetida é card
         que se lê pela metade. -->
    ${noKanban ? '' : progressoCard(n)}
    ${n.empresa_id ? `<div class="emp">${esc((EMPRESAS.find(e=>e.id===n.empresa_id)||{}).razao_social || 'empresa').split(' ').slice(0,2).join(' ')}</div>` : ''}
    <div><span class="tit" title="${esc(n.objeto||'')}">${esc([n.portal,n.modalidade,n.numero].filter(Boolean).join(' · '))}${n.orgao?' — '+esc(n.orgao):''}</span></div>
    <div class="org">${esc(n.municipio||'')}${n.uf?' · '+esc(n.uf):''}</div>
    ${n.abertura && fmtDtH(n.abertura) ? `<div class="ab${quando}">Abertura em <b>${fmtDtH(n.abertura)}</b>${quando===' hoje'?' · é hoje':''}</div>` : ''}
    <div class="etq">
      ${n.portal ? `<span class="fonte">Fonte: ${esc(n.portal)}</span>` : ''}
      ${n.modalidade ? `<span class="mod">${esc(n.modalidade)}</span>` : ''}
      ${n.numero ? `<span class="num">nº ${esc(n.numero)}</span>` : ''}
      ${n.valor_ganho>0 && ehGestor() ? `<span class="mod"><svg class="ic" aria-hidden="true"><use href="#ic-trofeu"/></svg> ${brl(n.valor_ganho)}</span>` : ''}
      ${n.anotacoes && String(n.anotacoes).trim() ? `<span class="obs"><svg class="ic" aria-hidden="true"><use href="#ic-lapis"/></svg> anotado</span>` : ''}
      ${seloConferencia(n.id)}
    </div>
    <div class="acoes">
      ${noKanban ? '' : `<button onclick="event.stopPropagation();irProFunil(${n.id})" title="abre os Quadros na coluna da fase deste negócio, com ele em destaque">ir pro funil</button>`}
      ${n.arquivado ? `<button onclick="event.stopPropagation();desarquivar(${n.id})" title="devolve pro funil">desarquivar</button>`
                    : `<button onclick="event.stopPropagation();arquivar(${n.id})" title="tira do funil, mantém no histórico">arquivar</button>`}
    </div>
  </div>`;
}

function kanban(l){
  return '<div class="kb">' + FASES.map(f => {
    const da = l.filter(n => n.estagio === f.k);
    return `<div class="col" data-fase="${f.k}">
      <h3><span class="bola" style="background:${f.c}"></span>${f.n}<span class="n">${da.length}</span></h3>
      ${da.length ? da.map(n => card(n,true)).join('')
                  : '<div class="vazia">Arraste negócios para cá</div>'}
    </div>`;
  }).join('') + '</div>';
}

// ── AGENDA — o substituto direto do Calendário 2025 ────────────────────────────────────────
// Eles acompanham por DATA e HORA de abertura: é assim que a planilha é lida todo dia. Então a
// agenda é cronológica de verdade — dia a dia, e dentro do dia por horário, com a hora numa
// coluna própria à esquerda (o olho procura "que horas é a sessão", não o nome do órgão).
// O que já passou não some: vai pra uma seção separada, do mais recente pro mais antigo.
// Eventos DERIVADOS da abertura dos negócios — sem tabela de evento manual (spec 6.2).
function agenda(l){
  const comData = l.filter(n => n.abertura);
  if(!comData.length) return '<div class="vazio">Nenhum negócio com data de abertura nos filtros atuais.</div>';
  const hoje = hojeYMD();
  const futuro = comData.filter(n => diaDe(n.abertura) >= hoje);
  const passado = comData.filter(n => diaDe(n.abertura) < hoje);

  const bloco = (lista, cresc) => {
    const porDia = {};
    lista.forEach(n => { const d = diaDe(n.abertura); (porDia[d] = porDia[d]||[]).push(n); });
    const dias = Object.keys(porDia).sort();
    if(!cresc) dias.reverse();
    return dias.map(d => {
      const r = rotuloDia(d);
      // dentro do dia, SEMPRE por hora crescente: é a ordem em que as sessões acontecem
      const doDia = porDia[d].slice().sort((a,b) => String(a.abertura).localeCompare(String(b.abertura)));
      return `<div class="ag-dia${d===hoje?' hoje':''}">
          <span class="d">${r.data}</span><span class="sem">${M1(r.semana)}</span>
          <span class="q">${nSessoes(doDia.length)}</span></div>`
        + doDia.map(n => `<div class="ag-lin"><div class="ag-hora">${horaDe(n.abertura)||'--:--'}</div>${card(n)}</div>`).join('');
    }).join('');
  };

  let html = '';
  html += futuro.length ? bloco(futuro.slice(0,300), true)
        : '<div class="vazio">Nada marcado de hoje em diante. Marque "ver arquivados" para rever o histórico.</div>';
  if(passado.length) html += `<div class="ag-secao">Já passaram · ${passado.length.toLocaleString('pt-BR')} sessão(ões)</div>`
        + bloco(passado.slice(0,200), false);
  return html;
}

// ══ [ANCORA] daqui pra baixo e o CALENDARIO MENSAL — suite propria: tests/testa_calendario.js
// Esta linha e lida por DUAS suites pra saber onde um bloco acaba e o outro comeca. Ela e uma
// LINHA INTEIRA e sem acento de proposito: ancora que e pedaco de frase quebra quando alguem
// reescreve a frase, e ancora com acento quebra quando o arquivo troca de codificacao.
/* ══════════════════════════════════════════════════════════════════════════════════════════════
   CALENDÁRIO MENSAL — item 6 da fila da reforma
   As decisões de desenho, com as referências que as mandaram, estão no bloco de CSS `.cal-*`.
   Aqui fica só o que é dado e comportamento.

   ── OS DADOS ANTES DO CÓDIGO (L2 / Estação 2) ────────────────────────────────────────────────
   NENHUMA TABELA NOVA, e isso é decisão e não preguiça: o evento do calendário é a ABERTURA do
   negócio, que já está gravada em `negocios.abertura`. Uma tabela de eventos precisaria de um
   processo pra criar, outro pra atualizar quando a ficha muda a data, e no dia em que um deles
   falhasse o calendário mostraria sessão em dia que já mudou — que é pior do que não mostrar.
   É a mesma decisão já tomada na Agenda e no sino, pela mesma razão.
   >>> A EDIÇÃO DA FICHA JÁ CHEGA AQUI DE GRAÇA: mudou a abertura, mudou o calendário, porque
       os dois leem o mesmo campo. É o que "derivado do fato" compra.

   O estado é de TELA, não de negócio, e por isso não é gravado em lugar nenhum: o mês olhado e
   o dia aberto. Recarregar volta pro mês de hoje, que é onde a pergunta começa.
   ══════════════════════════════════════════════════════════════════════════════════════════════ */
let CAL_A = new Date().getFullYear(), CAL_M = new Date().getMonth(), CAL_DIA = null;
const MAX_PIL = 3;              // acima disso, o dia mostra "+N mais" (Google Calendar)
const CAL_ESTREITO = 700;       // abaixo daqui a grade vira lista — a estratégia decidida ANTES

const _p2 = n => String(n).padStart(2,'0');
const calYMD = (a,m,d) => a + '-' + _p2(m+1) + '-' + _p2(d);
// Construtor LOCAL (a,m,d), nunca `new Date('YYYY-MM-DD')`: a string vira meia-noite UTC = 21h
// do dia anterior em GO. É o mesmo defeito que arquivou uma licitação na semeadura de 06/08.
/* "agosto de 2026" -> "Agosto de 2026". A primeira versão fazia isso com `text-transform:
   capitalize` no CSS, e o laço visual mostrou o resultado: **"Agosto De 2026"** — o CSS
   capitaliza TODA palavra, inclusive a preposição. Só a primeira letra, e no JavaScript, que é
   onde dá pra dizer "a primeira" em vez de "todas". */
const calNomeMes = (a,m) => { const s = new Date(a,m,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  return s.charAt(0).toUpperCase() + s.slice(1); };
const calEstreito = () => { try { return window.innerWidth > 0 && window.innerWidth <= CAL_ESTREITO; }
                            catch(_) { return false; } };

/* SEIS LINHAS FIXAS, sempre — decisão do Google Calendar e a mais valiosa das três referências.
   Um mês ocupa 4, 5 ou 6 semanas; com linhas variáveis a grade muda de altura ao trocar de mês
   e tudo que está embaixo pula. Altura constante custa uma linha vazia em alguns meses e paga
   com uma tela que não se mexe sozinha (D14). */
function gradeDoMes(a, m){
  const primeiro = new Date(a, m, 1);
  const inicio = new Date(a, m, 1 - primeiro.getDay());   // recua até o domingo da 1ª semana
  const hoje = hojeYMD(), cels = [];
  for(let i = 0; i < 42; i++){
    const d = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + i);
    const ymd = calYMD(d.getFullYear(), d.getMonth(), d.getDate());
    cels.push({ ymd, dia: d.getDate(), doMes: d.getMonth() === m && d.getFullYear() === a,
                fds: d.getDay() === 0 || d.getDay() === 6, hoje: ymd === hoje });
  }
  return cels;
}

// negócios agrupados por dia, cada dia já em ordem de horário — a ordem em que as sessões
// acontecem, que é a única ordem que faz sentido dentro de um dia.
function porDiaDeAbertura(l){
  const mapa = {};
  (l||[]).forEach(n => { if(!n.abertura) return; const d = diaDe(n.abertura); if(!d) return;
    (mapa[d] = mapa[d]||[]).push(n); });
  for(const d in mapa) mapa[d].sort((x,y) => String(x.abertura).localeCompare(String(y.abertura)));
  return mapa;
}

/* O MÊS VAZIO NÃO É UM BECO. "Nenhuma sessão em setembro" deixa a pessoa clicando ‹ › às cegas
   pra descobrir onde tem alguma coisa. Aqui a tela PROCURA e oferece o mês mais próximo que tem
   sessão, dizendo qual é — a busca é sobre as chaves que já estão em memória, não no banco. */
function mesVizinhoComSessao(mapa, a, m){
  const chaves = Object.keys(mapa).filter(d => mapa[d].length);
  if(!chaves.length) return null;
  const alvo = a * 12 + m;
  let melhor = null;
  chaves.forEach(d => {
    const [ka, km] = d.split('-').map(Number);
    const idx = ka * 12 + (km - 1);
    if(idx === alvo) return;
    const dist = Math.abs(idx - alvo);
    if(!melhor || dist < melhor.dist) melhor = { dist, a: ka, m: km - 1 };
  });
  return melhor;
}

function calendario(l){
  const mapa = porDiaDeAbertura(l);
  const cels = gradeDoMes(CAL_A, CAL_M);
  const noMes = cels.filter(c => c.doMes).reduce((s,c) => s + (mapa[c.ymd]||[]).length, 0);

  /* ── OS SEM DATA ─────────────────────────────────────────────────────────────────────────
     Eles não cabem num calendário — não têm dia. Mas sumir calado é como um número errado vira
     fato consumado: quem olha a grade conclui "é isto que existe". Então eles são contados e
     ditos, com o caminho pra vê-los. "Não sei" nunca vira zero. */
  const semData = (l||[]).filter(n => !n.abertura).length;
  const nota = semData
    ? `<div class="cal-nota">${semData.toLocaleString('pt-BR')} negócio${semData>1?'s':''} sem data de abertura
         ${semData>1?'não aparecem':'não aparece'} no calendário — um calendário só mostra o que tem dia.
         <a onclick="setVis('lista')">Ver na lista</a></div>`
    : '';

  const topo = `<div class="cal-topo">
      <!-- As setas saem do MESMO sprite do resto da tela (#ic-seta), e não dos glifos ‹ ›. O
           glifo é FONTE: ele muda de espessura e de altura em cada sistema, e ao lado de ícones
           de traço 1.8 aparece como o único desenho que não é do conjunto. A da esquerda é a
           mesma, virada — desenhar uma segunda seta seria duas fontes de verdade pra uma flecha. -->
      <div class="cal-nav">
        <button type="button" onclick="calNav(-1)" title="mês anterior" aria-label="Mês anterior"><svg class="ic ic-volta" aria-hidden="true"><use href="#ic-seta"/></svg></button>
        <button type="button" onclick="calNav(1)" title="próximo mês" aria-label="Próximo mês"><svg class="ic" aria-hidden="true"><use href="#ic-seta"/></svg></button>
      </div>
      <div class="cal-mes">${esc(calNomeMes(CAL_A, CAL_M))}</div>
      <button type="button" class="cal-hoje" onclick="calHoje()">Hoje</button>
      <div class="cal-conta"><b>${noMes.toLocaleString('pt-BR')}</b> ${noMes===1?'sessão':'sessões'} neste mês<br>
        <span>cores por etapa — as mesmas das etiquetas acima</span></div>
    </div>${nota}`;

  if(!noMes){
    const viz = mesVizinhoComSessao(mapa, CAL_A, CAL_M);
    return topo + `<div class="fp-vazio">
      <div class="fp-vazio__titulo">Nenhuma sessão em ${esc(calNomeMes(CAL_A, CAL_M))}</div>
      <div class="fp-vazio__texto">${viz
        ? 'O mês com sessões mais próximo daqui é ' + esc(calNomeMes(viz.a, viz.m)) + '.'
        : 'Nenhum negócio dos filtros atuais tem data de abertura.'}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        ${viz ? `<button class="btn-ed" onclick="calIrPara(${viz.a},${viz.m})">Ir para ${esc(calNomeMes(viz.a, viz.m))}</button>` : ''}
        <button class="btn-ed sec" onclick="abrirFormManual()">+ Incluir licitação</button>
      </div></div>` + painelDoDia(mapa);
  }

  return topo + (calEstreito() ? calComoLista(mapa, cels) : calComoGrade(mapa, cels)) + painelDoDia(mapa);
}

const CAL_SEMANA = ['dom','seg','ter','qua','qui','sex','sáb'];
function calComoGrade(mapa, cels){
  let h = '<div class="cal-grade" role="grid" aria-label="Calendário do mês">'
        + '<div role="row" style="display:contents">'
        + CAL_SEMANA.map(d => `<div class="cal-cabdia" role="columnheader">${d}</div>`).join('')
        + '</div>';
  for(let s = 0; s < 6; s++){
    h += '<div role="row" style="display:contents">';
    for(let i = 0; i < 7; i++){
      const c = cels[s*7 + i], doDia = mapa[c.ymd] || [];
      const r = rotuloDia(c.ymd);
      const cls = ['cal-cel', c.fds?'fds':'', c.doMes?'':'fora', c.hoje?'hoje':'', CAL_DIA===c.ymd?'sel':''].filter(Boolean).join(' ');
      h += `<div class="${cls}" role="gridcell">
        <button type="button" class="cal-dia" onclick="calAbrirDia('${c.ymd}')"
          aria-label="${r.data}, ${r.semana}${doDia.length?', '+nSessoes(doDia.length):', sem sessão'}"
          title="${c.hoje?'hoje · ':''}${doDia.length?'abrir o dia':'sem sessão neste dia'}">${c.dia}</button>`
          + doDia.slice(0, MAX_PIL).map(n => pilula(n)).join('')
          + (doDia.length > MAX_PIL
              ? `<button type="button" class="cal-mais" onclick="calAbrirDia('${c.ymd}')">+${doDia.length - MAX_PIL} mais</button>` : '')
        + '</div>';
    }
    h += '</div>';
  }
  return h + '</div>';
}

/* A PÍLULA. A cor diz a etapa e o NOME DA ETAPA VIAJA JUNTO no rótulo acessível e no título —
   nunca só a cor (regra escrita do projeto, e a única saída medida: a cor cheia da etapa não
   alcança 3:1 sobre o cartão, ver os asserts do testa_tema). */
function pilula(n){
  const i = FASES.findIndex(f => f.k === n.estagio) + 1;
  const fundo = i ? `var(--etapa-${i}-tenue)` : 'var(--cinza-100)';
  const barra = i ? `var(--etapa-${i})` : 'var(--cinza-400)';
  /* ── O QUE VAI ESCRITO NA PÍLULA, DEPOIS DA HORA ─────────────────────────────────────────
     Era o ÓRGÃO, e o laço visual mostrou por que não pode ser: na largura da célula ele sai
     "SECRETARI…" — e "SECRETARI…" não distingue coisa nenhuma, porque metade dos certames do
     estado começa assim. Truncar o começo comum de nomes longos entrega zero informação
     ocupando a linha inteira.
     >>> O MUNICÍPIO CABE INTEIRO e responde a segunda pergunta de quem olha o dia: "onde?".
         O órgão continua no `title`, no rótulo acessível e no cartão do dia aberto — ele não
         sumiu, mudou de lugar pra um onde há largura pra lê-lo. */
  const quem = n.municipio || n.orgao || n.portal || 'sem município';
  const sit = n.situacao && n.situacao !== 'normal' ? n.situacao : null;
  // A LEGENDA CARREGA O QUE NÃO COUBE. É ela que o leitor de tela lê e que o mouse revela — e é
  // por isso que o órgão pode sair da pílula sem sair da tela.
  const legenda = [horaDe(n.abertura)||'--:--', nomeFase(n.estagio), n.municipio, n.orgao,
                   sit ? rotuloSituacao(sit) : null].filter(Boolean).join(' · ');
  return `<button type="button" class="cal-pil${sit&&paradoDeVez(sit)?' parado':''}"
      style="background:${fundo};border-left-color:${barra}"
      onclick="event.stopPropagation();abrirDrawer(${n.id})"
      title="${esc(legenda)}" aria-label="${esc(legenda)}">
      <span class="h">${esc(horaDe(n.abertura)||'--:--')}</span><span class="q">${esc(quem)}</span></button>`;
}

/* CELULAR — a estratégia decidida antes de construir, e não um encolhimento da grade.
   Só os dias COM sessão: 42 células numa coluna seriam 30 linhas de nada pra rolar. */
function calComoLista(mapa, cels){
  const comSessao = cels.filter(c => c.doMes && (mapa[c.ymd]||[]).length);
  return '<div class="cal-lista">' + comSessao.map(c => {
    const r = rotuloDia(c.ymd), doDia = mapa[c.ymd];
    return `<div class="ag-dia${c.hoje?' hoje':''}">
        <span class="d">${r.data}</span><span class="sem">${M1(r.semana)}</span>
        <span class="q">${nSessoes(doDia.length)}</span></div>`
      + doDia.map(n => `<div class="ag-lin"><div class="ag-hora">${horaDe(n.abertura)||'--:--'}</div>${card(n)}</div>`).join('');
  }).join('') + '</div>';
}

// O dia aberto mostra o CARTÃO DE VERDADE, o mesmo da lista — mesmas etiquetas, mesmas ações.
// Um formato próprio aqui seria a segunda definição de "como um negócio se apresenta".
function painelDoDia(mapa){
  if(!CAL_DIA) return '';
  const doDia = mapa[CAL_DIA] || [], r = rotuloDia(CAL_DIA);
  return `<div class="cal-dia-painel">
    <div class="cab"><span class="d">${r.data}</span><span class="sem">${M1(r.semana)}</span>
      <button type="button" class="x" onclick="calFecharDia()" title="fechar o dia">✕ fechar</button></div>
    ${doDia.length ? doDia.map(n => card(n)).join('')
      : '<div class="fp-apoio">Nenhuma sessão neste dia. Os dias vizinhos continuam na grade acima.</div>'}
  </div>`;
}

function calNav(d){
  const t = new Date(CAL_A, CAL_M + d, 1);
  CAL_A = t.getFullYear(); CAL_M = t.getMonth();
  CAL_DIA = null;            // o dia aberto era do mês anterior: mantê-lo aberto seria mentira
  pinta();
}
function calIrPara(a, m){ CAL_A = a; CAL_M = m; CAL_DIA = null; pinta(); }
function calHoje(){ const d = new Date(); CAL_A = d.getFullYear(); CAL_M = d.getMonth(); CAL_DIA = hojeYMD(); pinta(); }
// Clicar no dia já aberto FECHA. O mesmo gesto que abre é o que fecha — sem isso a pessoa
// procura o botão de fechar para desfazer um clique que ela mesma acabou de dar.
function calAbrirDia(ymd){ CAL_DIA = (CAL_DIA === ymd) ? null : ymd; pinta(); }
function calFecharDia(){ CAL_DIA = null; pinta(); }

/* ── A TRAVESSIA DOS 700px ───────────────────────────────────────────────────────────────────
   Grade e lista são conteúdos DIFERENTES, não o mesmo HTML em outra largura — então quem muda
   é o JavaScript, e ele precisa saber que a janela mudou de faixa. Repintar a cada pixel de
   arrasto seria desperdício; repintar só na TRAVESSIA é uma vez por mudança de faixa.
   >>> E só quando o calendário está na tela: repintar o kanban por causa de um resize é trabalho
       que ninguém pediu, e pior, mataria um arraste em andamento. */
let _calFaixa = calEstreito();
window.addEventListener('resize', () => {
  const agora = calEstreito();
  if(agora === _calFaixa) return;
  _calFaixa = agora;
  if(VIS === 'calendario') pinta();
});

// ── drag-and-drop entre fases ──────────────────────────────────────────────────────────────
// O arraste GRAVA. Por isso o card volta pro lugar se a gravação falhar: kanban que move na
// tela e não persiste é pior que kanban que não move — o operador acha que registrou.
let _arrastando = null;
function ligarArrasto(){
  document.querySelectorAll('.kb .card[draggable]').forEach(el => {
    el.addEventListener('dragstart', e => { _arrastando = el.dataset.id; el.classList.add('arrastando'); e.dataTransfer.effectAllowed='move'; });
    el.addEventListener('dragend', () => { el.classList.remove('arrastando'); _arrastando = null;
      document.querySelectorAll('.col').forEach(c=>c.classList.remove('alvo')); });
  });
  document.querySelectorAll('.kb .col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('alvo'); });
    col.addEventListener('dragleave', () => col.classList.remove('alvo'));
    col.addEventListener('drop', async e => {
      e.preventDefault(); col.classList.remove('alvo');
      if(!_arrastando) return;
      const id = Number(_arrastando), fase = col.dataset.fase;
      const n = NEG.find(x => x.id === id);
      if(!n || n.estagio === fase) return;
      const antes = n.estagio;
      n.estagio = fase; pinta();                       // otimista: a tela responde na hora
      try{ await gravar(id, { estagio: fase }); }
      catch(err){
        n.estagio = antes; pinta();                    // desfaz: a tela não pode mentir
        alert('Não consegui mover este negócio: ' + err.message + '\nEle voltou para ' + nomeFase(antes) + '.');
      }
    });
  });
}

// ── gravação ───────────────────────────────────────────────────────────────────────────────
async function gravar(id, campos){
  const r = await fetch(`${SB_URL}/rest/v1/negocios?id=eq.${id}`, {
    method:'PATCH', headers:SB_H,
    body: JSON.stringify(Object.assign({ atualizado_em: new Date().toISOString() }, campos)) });
  if(!r.ok) throw new Error('HTTP ' + r.status + (r.status===401||r.status===403 ? ' — só gestor grava no funil' : ''));
  return true;
}

async function arquivar(id){
  if(!confirm('Arquivar este negócio? Ele sai do funil e continua no histórico.')) return;
  const n = NEG.find(x => x.id === id); if(!n) return;
  try{ await gravar(id, { arquivado:true }); n.arquivado = true; if(ABERTO===id) fecharDrawer(); pinta(); }
  catch(e){ alert('Não consegui arquivar: ' + e.message); }
}
// Devolver pro funil é ação de UMA linha, feita por quem decide — não migração em massa.
// É por aqui que a licitação arquivada por engano (ou que voltou a andar) volta pro kanban.
async function desarquivar(id){
  const n = NEG.find(x => x.id === id); if(!n) return;
  try{
    // Até 11/08, desarquivar criava as 15 tarefas do checklist. Com o checklist fora da tela,
    // isso passaria a gravar dado que ninguém vê — e dado invisível é o que um dia alguém acha e
    // não sabe se vale. O que já está gravado continua; novo não se cria.
    const campos = { arquivado:false };
    await gravar(id, campos);
    Object.assign(n, campos);
    pinta(); if(ABERTO===id) abrirDrawer(id);
  }catch(e){ alert('Não consegui desarquivar: ' + e.message); }
}

// ── DRAWER de detalhe ──────────────────────────────────────────────────────────────────────
// A OBSERVAÇÃO da planilha entra aqui, só leitura, ao lado das Anotações editáveis. São coisas
// diferentes e misturar as duas apagaria a memória: a observação é o que a FPMED escreveu à
// mão no Calendário 2025 (954 das 2.555 linhas têm uma), e a anotação é o que ela escreve de
// agora em diante. Ela é buscada sob demanda — carregar 2.555 observações no load da tela
// seria pagar por 2.544 que ninguém vai ler.
async function abrirDrawer(id){
  const n = NEG.find(x => x.id === id); if(!n) return;
  ABERTO = id;
  document.getElementById('velcro').classList.add('on');
  const dw = document.getElementById('drawer'); dw.classList.add('on'); dw.setAttribute('aria-hidden','false');
  document.getElementById('dw-titulo').textContent =
    [n.portal, n.modalidade, n.numero].filter(Boolean).join(' · ') + (n.orgao ? ' — ' + n.orgao : '');
  document.getElementById('dw-body').innerHTML = corpoDrawer(n, null, true);
  if(n.acompanhada_id){
    let obs = null;
    try{
      const r = await fetch(`${SB_URL}/rest/v1/licitacoes_acompanhadas?id=eq.${n.acompanhada_id}&select=observacao,status`, {headers:SB_H});
      if(r.ok){ const d = await r.json(); obs = d[0] || null; }
    }catch(e){ /* observação é enfeite útil, não requisito: a ficha vale sem ela */ }
    if(ABERTO === id) document.getElementById('dw-body').innerHTML = corpoDrawer(n, obs, false);
  } else {
    document.getElementById('dw-body').innerHTML = corpoDrawer(n, null, false);
  }
  if(ABERTO === id){ carregarRastro(id); carregarLembretes(id); carregarCredenciamentos(id);
                     carregarProposta(id); carregarAta(id); carregarItensGanhos(id);
                     carregarEdital(id); }
}
function fecharDrawer(){
  ABERTO = null;
  document.getElementById('velcro').classList.remove('on');
  const dw = document.getElementById('drawer'); dw.classList.remove('on'); dw.setAttribute('aria-hidden','true');
}
document.addEventListener('keydown', e => { if(e.key === 'Escape' && ABERTO) fecharDrawer(); });

function corpoDrawer(n, obs, carregando){
  const gestor = ehGestor();
  const dia = diaDe(n.abertura), hoje = hojeYMD();

  const linha = (r, v, cls) => v ? `<dt>${r}</dt><dd class="${cls||''}">${v}</dd>` : '';

  // ══ FICHA EDITÁVEL (08/08, urgência) ══════════════════════════════════════════════════════
  // O mundo real muda: pregão é ADIADO, SUSPENSO, CANCELADO e REMARCADO. Enquanto estes campos
  // eram somente leitura, um pregão adiado ficava com a data velha — e o sino avisava pelo DIA
  // ERRADO. Aviso que aponta o dia errado é pior que aviso nenhum: quem confia nele perde a
  // sessão.
  // >>> QUEM NÃO GRAVA CONTINUA VENDO A FICHA DE LEITURA. Campo editável para quem levaria 403
  //     do banco ao salvar é um convite a digitar e perder o trabalho.
  const editavel = gestor && !n.arquivado;
  // ══ EDIÇÃO CAMPO A CAMPO (08/08) ═══════════════════════════════════════════════════════
  // Antes a ficha abria TODOS os campos ao mesmo tempo e salvava tudo num botão só. Quem ia
  // corrigir o número do pregão podia arrastar a data sem perceber e salvar as duas — e o
  // rastro registraria a mudança acidental fielmente, o que não conserta nada.
  // >>> MENOS SUPERFÍCIE ABERTA POR VEZ = MENOS CHANCE DE SALVAR O QUE NÃO SE QUIS. Cada campo
  //     tem seu "Alterar"; só ele abre, só ele salva. O padrão veio da captura da ficha do
  //     concorrente (seção 8.4-B do SPEC) e resolve exatamente esse risco.
  // >>> `valor_ganho` FICOU EDITÁVEL AQUI, e é o campo mais sensível da ficha: é ele que
  //     alimenta a taxa de vitória. Por isso entrou no gatilho de rastro no MESMO dia — número
  //     que qualquer um muda e ninguém sabe quem mudou não serve pra decidir nada.
  const campo = (k, rot, valor, mostrado, extra) => `
    <div class="fc" id="fc-${k}">
      <div class="fc-r"><span class="fc-rot">${rot}</span>
        <span class="fc-val" id="fcv-${k}">${mostrado || '<i>—</i>'}</span>
        ${editavel ? `<button class="fc-bt" onclick="editarCampo(${n.id},'${k}')"><svg class="ic" aria-hidden="true"><use href="#ic-lapis"/></svg> Alterar</button>` : ''}</div>
      ${extra || ''}
    </div>`;
  const ficha = `<div class="ficha-fc">
      ${campo('abertura', 'Abertura', null, n.abertura && fmtDtH(n.abertura)
          ? esc(fmtDtH(n.abertura)) + (dia===hoje?' <b style="color:var(--ambar)">· é hoje</b>':(dia&&dia<hoje?' <span class="salvo">· já passou</span>':''))
          : '')}
      ${campo('situacao', 'Situação', null, (n.situacao && n.situacao!=='normal')
          ? `<b style="color:${corSituacao(n.situacao)}">${esc(rotuloSituacao(n.situacao))}</b>` : 'normal')}
      ${campo('portal', 'Portal', null, esc(n.portal||''))}
      ${campo('numero', 'Número', null, esc(n.numero||''))}
      ${campo('orgao', 'Órgão', null, esc(n.orgao||''))}
      ${campo('objeto', 'Objeto', null, esc(n.objeto||''))}
      ${campo('valor_estimado', 'Valor estimado', null, n.valor_estimado!=null ? brl(n.valor_estimado) : '')}
      ${gestor ? campo('valor_ganho', 'Valor do contrato ganho', null,
          n.valor_ganho>0 ? `<b style="color:var(--verde)"><svg class="ic" aria-hidden="true"><use href="#ic-trofeu"/></svg> ${brl(n.valor_ganho)}</b>` : 'ainda não ganho') : ''}
      <div class="fc"><div class="fc-r"><span class="fc-rot">Município</span>
        <span class="fc-val">${esc([n.municipio, n.uf].filter(Boolean).join(' · ')) || '<i>—</i>'}</span></div></div>
      <div class="fc"><div class="fc-r"><span class="fc-rot">Origem</span>
        <span class="fc-val salvo">${n.origem === 'calendario_2025' ? 'Calendário 2025 (histórico da FPMED)' : esc(n.origem||'')}
        ${n.numero ? ' · nº de controle ' + esc(n.numero) : ''}</span></div></div>
    </div>`;
  // >>> A FICHA DE LEITURA (<dl>) FOI REMOVIDA em 08/08, e a remoção é o ponto: a de campo a
  //     campo já serve os dois casos — quem não pode gravar simplesmente não recebe o botão
  //     "Alterar". Manter as duas seria manter duas versões da mesma tela, e a que ninguém abre
  //     é a que envelhece errado (a antiga já tinha "Modalidade" que a nova não mostrava, e
  //     não mostrava "Valor estimado" que a nova mostra).

  /* ── O CHECKLIST FIXO DAS 15 TAREFAS SAIU DA TELA (11/08) ──────────────────────────────────
     Decisão do Lemuel: a equipe não usa. Saíram as 15 caixinhas, o "4/15" da aba e o medidor
     com a barrinha no card da lista e do funil. A aba Tarefas passa a ser só o que a pessoa
     escreve — e isso ela usa.
     >>> O DADO NÃO FOI APAGADO. O `negocios.tarefas` (JSONB) continua lá, com o que já foi
         marcado em 2.555 negócios. Some da tela, não do banco: se um dia quiserem de volta, o
         histórico do que cada um marcou está inteiro. Apagar seria reescrever o trabalho de
         alguém pra economizar um campo que não custa nada parado. */

  // ══ ABAS DA FICHA (08/08) ══════════════════════════════════════════════════════════════
  // A ficha juntava tudo numa coluna só: estágio, ficha, rastro, observação da planilha,
  // anotações e 15 tarefas — dava rolagem longa e o que importava ficava embaixo do que não
  // importava naquele momento. Agora são 4 abas, o mesmo desenho que a captura do concorrente
  // mostrou (Informações · Lembretes · Tarefas · Observações), porque ele resolve o mesmo
  // problema: cada aba é uma PERGUNTA diferente que se faz sobre o mesmo negócio.
  // >>> O ESTÁGIO FICA FORA DAS ABAS, no topo: ele é o estado do negócio, não um assunto.
  //     Precisa estar visível seja qual for a aba aberta.
  const obsPlanilha = carregando
    ? '<div class="salvo">carregando a observação da planilha…</div>'
    : (obs && obs.observacao && String(obs.observacao).trim()
       ? `<h4>Observação do Calendário 2025${obs.status?' · '+esc(obs.status):''}</h4>
          <div class="dw-obs">${esc(obs.observacao)}</div>
          <div class="salvo">escrita à mão na planilha — histórico, não editável aqui</div>`
       : (obs && obs.status ? `<h4>Status na planilha</h4><div style="font-size:12.5px;color:var(--muted)">${esc(obs.status)} — sem observação escrita</div>` : ''));

  return `
    ${stepper(n)}

    <!-- ══ AS ABAS ABREM NA QUE A ETAPA PEDE ═════════════════════════════════════════════════
         São sete, e todas continuam aqui — o que muda é qual delas já vem aberta. Quem abre um
         negócio na Disputa cai nos Lembretes (a sessão é o que manda); na Ata, cai no
         Gerenciamento de Ata. A aba da etapa ganha um ponto verde: é o "você está aqui" do
         segundo nível, e ele existe porque a pessoa PODE ter navegado pra outra e voltado. -->
    <div class="dw-abas">
      ${[['info','Informações',''],['lembretes','Lembretes','dw-lem-n'],['tarefas','Tarefas','dw-tar-n'],
         ['prop','Proposta','dw-prop-n'],['ata','Gerenciamento de Ata','dw-ata-n'],
         ['cred','Credenciamentos','dw-cred-n'],['obs','Observações','']].map(([k,rot,cnt]) => {
        const doFoco = k === focoDa(n.estagio).aba;
        return `<button class="${doFoco?'on':''}${doFoco?' foco':''}" data-aba="${k}" onclick="abaFicha(this,'${k}')"
          ${doFoco?'title="é a aba desta etapa do processo"':''}>${rot}${cnt?` <span id="${cnt}"></span>`:''}</button>`;
      }).join('')}
    </div>

    <div class="${pnl(n,"info")}" id="aba-info">
      <div class="dw-sec"><h4>Ficha${editavel?' <span class="salvo" style="font-weight:400">· editável</span>':''}</h4>${ficha}</div>
      <!-- ══ EDITAL E ANEXOS — em QUALQUER negócio ═══════════════════════════════════════════
           Não só nos incluídos à mão: o que veio do PNCP e o do Calendário também recebem o
           edital. O índice do PNCP guarda o LINK do arquivo no site deles; ter o PDF aqui é
           outra coisa — é o documento na mão de quem vai disputar, que não depende do portal
           estar no ar no dia da sessão. -->
      <div class="dw-sec" id="aba-edital">
        <h4>Edital e anexos</h4>
        <div class="sec-dica">O documento do certame e o que vem com ele. Fica guardado aqui — não depende do portal estar no ar.</div>
        <div id="ed-lista"><div class="salvo">carregando…</div></div>
        ${editavel ? `<div class="prop-novo">
          <select id="ed-cat">
            <option value="edital">Edital</option>
            <option value="anexo_edital">Anexo do edital (TR, itens, planilha)</option>
          </select>
          <input type="file" id="ed-arq" multiple>
          <button class="btn-ed" id="ed-bt" onclick="anexarEdital(${n.id})"><svg class="ic" aria-hidden="true"><use href="#ic-clipe"/></svg> Anexar</button>
        </div>` : '<div class="salvo">só quem grava pode anexar.</div>'}
        <div class="salvo" id="ed-msg"></div>
      </div>
      <!-- DE ONDE ESTE NEGÓCIO VEIO. Três procedências, e elas não valem a mesma coisa: o do
           PNCP tem número oficial conferível, o do calendário foi importado de uma planilha, e o
           manual foi alguém que digitou. Quem lê a ficha meses depois precisa saber qual é —
           não pra desconfiar, mas pra saber onde conferir. -->
      <div class="dw-sec">${selaOrigem(n)}</div>
      <div class="dw-sec" id="dw-rastro"></div>
    </div>

    <div class="${pnl(n,"lembretes")}" id="aba-lembretes">
      <div class="dw-sec">
        <h4>Lembretes agendados</h4>
        <div class="salvo">O sino avisa por eles. Diferente do resto do sino, lembrete não é
          fato lido do banco — é uma intenção que alguém teve, e sem escrever ela some.</div>
        ${editavel ? `<div class="lem-novo">
          <input type="text" id="lem-titulo" placeholder="ex.: ligar pro fornecedor antes da sessão">

// ══ LEMBRETES ════════════════════════════════════════════════════════════════════════════
let LEMBRETES = [];
const PRIO_COR = { alta:'var(--vermelho-700)', media:'var(--ambar-700)', baixa:'var(--cinza-500)' };
async function carregarLembretes(id){
  const box = document.getElementById('lem-lista'); if(!box) return;
  try{
    // UMA leitura pros dois: lembrete e tarefa moram na mesma tabela (mesmos campos, mesmo
    // caminho até o sino) e se separam pelo `tipo`. Duas chamadas seriam dois erros possíveis
    // pra uma informação só.
    const r = await fetch(`${SB_URL}/rest/v1/lembretes?negocio_id=eq.${id}&select=*&order=quando.asc`, {headers:SB_H});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const todos = await r.json();
    LEMBRETES = todos.filter(x => (x.tipo || 'lembrete') === 'lembrete');
    TAREFAS_LIVRES = todos.filter(x => x.tipo === 'tarefa');
    pintaTarefasLivres(id);
  }catch(e){
    // erro NÃO vira "nenhum lembrete": alguém concluiria que não há nada agendado
    box.innerHTML = '<div class="salvo" style="color:var(--vermelho-700)"><svg class="ic" aria-hidden="true"><use href="#ic-alerta"/></svg> não consegui ler os lembretes deste negócio.</div>';
    return;
  }
  pintaLembretes(id);
}
/* ── O LEMBRETE DA SESSÃO É DERIVADO, E NÃO UMA LINHA NO BANCO ───────────────────────────────
   O pedido é "todo negócio com abertura ganha o lembrete SOZINHO, e se a data for editada o
   lembrete acompanha". Gravar uma linha faria exatamente o contrário: no dia do adiamento
   haveria a data nova na ficha e a velha no lembrete, e alguém apareceria na sessão errada.
   >>> É a regra que este projeto já tinha escrito e que se aplica inteira aqui: o sino avisa
       FATO (a sessão abre) e fato se lê de onde já está; LEMBRETE é INTENÇÃO, e intenção precisa
       de tabela porque sem escrever mora na cabeça de quem pensou. A abertura da sessão é fato —
       ela já está em `negocios.abertura`. Derivar é de graça e nunca diverge.
   >>> Por isso ele também não tem caixinha de "feito": ninguém "conclui" que a sessão vai abrir.
       Ele some quando o fato passa, igual ao resto do sino. */
function lembreteDaSessao(n){
  if(!n || !n.abertura || n.arquivado) return null;
  const dia = diaDe(n.abertura), hoje = hojeYMD();
  if(!dia || dia < hoje) return null;                 // sessão que já passou não é lembrete
  const q = new Date(n.abertura);
  const amanha = emDias(1);
  return {
    auto: true,
    titulo: 'Abertura da sessão' + (n.numero ? ' — ' + n.numero : ''),
    quando: n.abertura,
    hora: horaDe(n.abertura) || null,
    quandoTxt: q.toLocaleString('pt-BR'),
    urgencia: dia === hoje ? 'hoje' : dia === amanha ? 'amanha' : null,
    negocio: n,
  };
}

function pintaLembretes(id){
  const box = document.getElementById('lem-lista'); if(!box) return;
  const cnt = document.getElementById('dw-lem-n');
  const n = NEG.find(x => x.id === id);
  const auto = lembreteDaSessao(n);
  const abertos = LEMBRETES.filter(l => !l.feito).length + (auto ? 1 : 0);
  if(cnt) cnt.textContent = abertos ? '(' + abertos + ')' : '';

  // O automático vem PRIMEIRO e marcado como automático: quem lê precisa saber que ninguém
  // digitou aquilo — e que apagar não é uma opção, porque não há o que apagar.
  const cabeca = auto ? `<div class="lem" style="border-color:${auto.urgencia?'var(--ambar)':'var(--linha)'}">
      <div style="width:16px;text-align:center"><svg class="ic" aria-hidden="true"><use href="#ic-calendario"/></svg></div>
      <div><div class="t">${esc(auto.titulo)}
          ${auto.urgencia==='hoje' ? '<b style="color:var(--ambar)"> · É HOJE</b>'
            : auto.urgencia==='amanha' ? '<b style="color:var(--ambar)"> · é amanhã</b>' : ''}</div>
        <div class="q">${esc(auto.quandoTxt)} · <i>automático — abertura da sessão</i></div>
        <div style="margin-top:6px"><button class="btn sec mini" onclick="event.stopPropagation();avisarNoZap(${id})"
          title="abre o WhatsApp com a mensagem pronta — você só escolhe o contato"><svg class="ic" aria-hidden="true"><use href="#ic-telefone"/></svg> avisar no zap</button></div>
      </div>
      <span class="prio" style="color:var(--azul-claro);border-color:var(--azul-claro)">sessão</span>
    </div>` : '';

  if(!LEMBRETES.length && !auto){ box.innerHTML = '<div class="salvo">Nenhum lembrete agendado neste negócio.</div>'; return; }
  if(!LEMBRETES.length){ box.innerHTML = cabeca; return; }
  const agora = new Date();
  box.innerHTML = cabeca + LEMBRETES.map(l => {
    const q = new Date(l.quando);
    const atrasado = !l.feito && q < agora;
    return `<div class="lem${l.feito?' feito':''}">
      <input type="checkbox" ${l.feito?'checked':''} onchange="marcarLembrete(${id},${l.id},this.checked)">
      <div><div class="t">${esc(l.titulo)}</div>
        <div class="q">${q.toLocaleString('pt-BR')}${atrasado?' · <b style="color:var(--vermelho-700)">atrasado</b>':''}</div></div>
      <span class="prio" style="color:${PRIO_COR[l.prioridade]||'var(--cinza-500)'};border-color:${PRIO_COR[l.prioridade]||'var(--cinza-500)'}">${esc(l.prioridade)}</span>
    </div>`;
  }).join('');
}
/* ── ATALHO PRAS PEÇAS JURÍDICAS, COM O CERTAME JUNTO ────────────────────────────────────────
   Recurso, esclarecimento e contrarrazão já existem na tela de Peças, com a conta de dias úteis
   do art. 164/165. Aqui não se refaz nada: leva-se o contexto.
   >>> O QUE VAI JUNTO é só o que a ficha SABE (órgão, portal, nº, abertura, objeto). O que a
       peça precisa e a ficha não tem — os fatos, o fundamento, o pedido — continua sendo escrito
       lá, no formulário guiado. Preencher meio formulário e deixar o resto parecendo pronto é
       como sai peça com lacuna.
   >>> Vai por sessionStorage e não pela URL: objeto de edital tem centenas de caracteres e
       endereço enorme é o tipo de coisa que alguém copia, cola cortado e não entende por quê. */
function irParaPecas(id){
  const n = NEG.find(x => x.id === id); if(!n) return;
  try{
    sessionStorage.setItem('fpmed_peca_certame', JSON.stringify({
      de: 'negocios', negocio_id: n.id, quando: Date.now(),
      orgao: n.orgao || null, portal: n.portal || null, modalidade: n.modalidade || null,
      numero: n.numero || null, abertura: n.abertura || null,
      objeto: n.objeto || null, municipio: n.municipio || null, uf: n.uf || null,
    }));
  }catch(e){ /* sem sessionStorage a tela de Peças abre em branco, que é o comportamento de antes */ }
  location.href = 'fpmed_pecas.html';
}

/* ── LER O EDITAL COM IA, A PARTIR DA FICHA ──────────────────────────────────────────────────
   O leitor está em PILOTO: liberado só pro gestor de licitação, porque cada leitura custa
   dinheiro e é cobrada. Aqui o botão nem aparece pra quem não pode.

   >>> E ESCONDER O BOTÃO NÃO É A PERMISSÃO. Quem impede de verdade é a edge function `ler-edital`,
       que confere o JWT no servidor e responde 403 pra quem não está na lista — testado com login
       real. Esta lista aqui é só pra tela não oferecer o que vai ser negado: botão que promete e
       dá erro é pior que botão nenhum. As duas listas dizerem a mesma coisa é escolha de conforto;
       se um dia divergirem, quem vale é a do servidor, e o pior que acontece é um botão inútil —
       nunca uma leitura paga por quem não devia.
   >>> O QUE VAI JUNTO é só o nome do certame, pra proposta montada lá nascer identificada. O PDF
       do edital NÃO vai daqui: a ficha não guarda o arquivo, e fingir que guarda faria a pessoa
       clicar esperando que o edital já estivesse lá. */
const LEITORES_EDITAL = ['licitacao@fpmed.com.br'];
function podeLerEdital(){
  try{ return LEITORES_EDITAL.includes(String((window.gmAuth && gmAuth.user && gmAuth.user.email) || '').toLowerCase()); }
  catch(e){ return false; }
}
/* A MESMA regra revela a entrada do Leitor — agora NO MENU LATERAL, e não mais numa barra
   própria desta tela. A lista do piloto vivia copiada em três lugares; hoje mora uma vez só, no
   `limedtec-menu.js`, ao lado do módulo que ela governa.
   >>> O MENU CONTINUA BURRO DE PROPÓSITO: ele não lê sessão nem chama banco. Ele guarda a lista
       e expõe `revelarPara(email)`; quem tem a sessão é a tela, e é ela que pergunta.
   >>> E ISTO NÃO É A PERMISSÃO. Quem barra é a edge function, com 403. Isto só evita OFERECER o
       que vai ser negado. */
function abreLeitorNaBarra(){
  try {
    const email = (window.gmAuth && gmAuth.user && gmAuth.user.email) || '';
    if (window.LimedtecMenu && LimedtecMenu.revelarPara) LimedtecMenu.revelarPara(email);
  } catch(_) { /* sem menu montado a tela segue inteira; a entrada só não aparece */ }
}
async function lerEditalIA(id){
  const n = NEG.find(x => x.id === id); if(!n) return;
  /* ── SE O EDITAL JÁ ESTÁ ANEXADO, LEVA ELE ─────────────────────────────────────────────────
     Antes, o botão sempre abria o leitor pedindo o PDF do computador — mesmo quando o edital
     estava ali, a dois centímetros, na seção de anexos. Pedir de novo o que já se tem é o tipo
     de atrito que faz a pessoa desistir da ferramenta.
     >>> VAI O CAMINHO NO BUCKET, e não o arquivo: o leitor baixa por link assinado, do mesmo
         jeito que a conferência de proposta faz. Passar megabytes por sessionStorage estouraria
         a cota do navegador no primeiro edital de verdade.
     >>> E O UPLOAD MANUAL CONTINUA. Quem quiser ler OUTRO arquivo (um anexo, uma versão nova que
         ainda não subiu) escolhe do computador como sempre — o anexo é atalho, não trava. */
  let anexo = null;
  try{
    const r = await fetch(`${SB_URL}/rest/v1/negocio_anexos?negocio_id=eq.${id}`
      + '&categoria=eq.edital&select=id,arquivo_path,arquivo_nome,versao&order=versao.desc&limit=1', {headers:SB_H});
    if(r.ok) anexo = (await r.json())[0] || null;
  }catch(e){ /* sem o anexo o leitor abre pedindo o arquivo, que é o comportamento de antes */ }
  try{
    sessionStorage.setItem('fpmed_edital_negocio', JSON.stringify({
      de: 'negocios', negocio_id: n.id, quando: Date.now(),
      titulo: n.titulo || n.objeto || null, orgao: n.orgao || null,
      numero: n.numero || null, portal: n.portal || null, abertura: n.abertura || null,
      anexo: anexo ? { path: anexo.arquivo_path, nome: anexo.arquivo_nome, versao: anexo.versao } : null,
    }));
  }catch(e){ /* sem sessionStorage o leitor abre sem contexto, que é o comportamento normal dele */ }
  location.href = 'fpmed_edital_ia.html';
}

/* ── TAREFAS PERSONALIZADAS ──────────────────────────────────────────────────────────────────
   Mesma tabela dos lembretes (mesmos campos, mesmo caminho até o sino), separadas pelo `tipo`.
   >>> A DATA É OPCIONAL, e a tela DIZ o que muda: com data, entra no sino e no aviso da manhã;
       sem data, é só uma lista. Um campo de data obrigatório faria a pessoa inventar uma — e
       data inventada vira alerta que ninguém quer, que é como se aprende a ignorar o sino. */
let TAREFAS_LIVRES = [];
function pintaTarefasLivres(id){
  const box = document.getElementById('tar-lista'); if(!box) return;
  // O contador da aba conta as ABERTAS, não o total: "Tarefas 2" quer dizer "tem 2 pra fazer".
  // Contar as concluídas junto faria o número nunca baixar, e número que não baixa não informa.
  const cnt = document.getElementById('dw-tar-n');
  const abertas = TAREFAS_LIVRES.filter(x => !x.feito).length;
  if(cnt) cnt.textContent = abertas ? abertas : '';
  if(!TAREFAS_LIVRES.length){ box.innerHTML = '<div class="salvo">Nenhuma tarefa neste negócio ainda. Use o campo abaixo — com data e hora, ela avisa no sino.</div>'; return; }
  const agora = new Date();
  box.innerHTML = TAREFAS_LIVRES.map(l => {
    const q = l.quando ? new Date(l.quando) : null;
    const atrasada = !l.feito && q && q < agora;
    return `<div class="lem${l.feito?' feito':''}">
      <input type="checkbox" ${l.feito?'checked':''} onchange="marcarLembrete(${id},${l.id},this.checked)">
      <div><div class="t">${esc(l.titulo)}</div>
        <div class="q">${q ? esc(q.toLocaleString('pt-BR')) + (atrasada?' · <b style="color:var(--vermelho-700)">atrasada</b>':' · no sino') : 'sem data — não avisa'}</div></div>
      <span class="prio" style="color:${PRIO_COR[l.prioridade]||'var(--cinza-500)'};border-color:${PRIO_COR[l.prioridade]||'var(--cinza-500)'}">${esc(l.prioridade)}</span>
    </div>`;
  }).join('');
}
async function criarTarefa(id){
  const msg = document.getElementById('tar-msg'), bt = document.getElementById('tar-bt');
  const titulo = (document.getElementById('tar-titulo').value||'').trim();
  const quando = document.getElementById('tar-quando').value;
  if(!titulo){ msg.textContent = 'escreva o que precisa ser feito.'; return; }
  bt.disabled = true; msg.textContent = 'salvando…';
  try{
    const n = NEG.find(x => x.id === id);
    const r = await fetch(`${SB_URL}/rest/v1/lembretes`, {method:'POST',
      headers: Object.assign({'Prefer':'return=representation'}, SB_H, {'Content-Type':'application/json'}),
      body: JSON.stringify({ negocio_id: id, empresa_id: (n && n.empresa_id) || null, titulo,
        quando: quando ? new Date(quando).toISOString() : null,
        prioridade: document.getElementById('tar-prio').value, tipo: 'tarefa' })});
    if(!r.ok) throw new Error('HTTP ' + r.status + (r.status===401||r.status===403 ? ' — sem permissão de gravar' : ''));
    TAREFAS_LIVRES = TAREFAS_LIVRES.concat(await r.json());
    document.getElementById('tar-titulo').value = ''; document.getElementById('tar-quando').value = '';
    msg.textContent = quando ? 'tarefa salva — ela vai aparecer no sino.' : 'tarefa salva (sem data, não avisa).';
    pintaTarefasLivres(id);
    carregar().then(pinta);      // o sino conta o funil inteiro; recarrega pra ele já contar esta
  }catch(e){ msg.textContent = 'não consegui salvar: ' + e.message; }
  bt.disabled = false;
}

/* ══ PROPOSTA ANEXADA E A CONFERÊNCIA CONTRA O TETO ══════════════════════════════════════════
   O que esta seção entrega não é "guardar um PDF": é responder, antes de o pregão começar, se a
   proposta que a empresa vai mandar cabe no teto legal. Item acima do PMVG numa venda ao governo
   desclassifica — e é o tipo de erro que ninguém vê olhando a planilha, porque o número parece
   um preço normal.

   >>> NADA AQUI DECIDE PREÇO. Quem decide é o `LimedtecTetoCMED`, o mesmo motor do Conferidor,
       com a MESMA leitura de PDF (que subiu pro motor justamente por causa desta tela). Esta
       função monta a pergunta e mostra a resposta; ela não tem opinião sobre teto.
   >>> E A RÉGUA É DITA. A CMED publica todo mês; um resultado guardado sem a data da edição que
       o produziu é um número sem prazo de validade. `v_cmed_vigencia` entra junto e a data fica
       gravada em `negocio_conferencias`. */
const CAT_PROPOSTA = 'proposta';
let ANEXOS = [], CONFERENCIAS = [], IDX_CMED = null, CMED_VIG = null;

async function carregarProposta(id){
  const box = document.getElementById('prop-lista'); if(!box) return;
  try{
    const [ra, rc] = await Promise.all([
      fetch(`${SB_URL}/rest/v1/negocio_anexos?negocio_id=eq.${id}&categoria=eq.${CAT_PROPOSTA}`
        + '&select=*&order=versao.desc', {headers:SB_H}),
      fetch(`${SB_URL}/rest/v1/negocio_conferencias?negocio_id=eq.${id}&select=*&order=quando.desc&limit=10`, {headers:SB_H}),
    ]);
    if(!ra.ok) throw new Error('HTTP ' + ra.status);
    ANEXOS = await ra.json();
    CONFERENCIAS = rc.ok ? await rc.json() : [];
    pintaProposta(id);
  }catch(e){
    // "Não sei" e "nenhuma" são coisas diferentes: uma lista vazia faria alguém anexar de novo
    // por cima do que já está lá — e aí há duas versões da mesma proposta por engano.
    ANEXOS = [];
    box.innerHTML = '<div class="salvo">não consegui ler os anexos ('+esc(e.message)+') — '
      + 'isto <b>não</b> quer dizer que não existam.</div>';
  }
}

function pintaProposta(id){
  const box = document.getElementById('prop-lista'); if(!box) return;
  const cnt = document.getElementById('dw-prop-n');
  if(cnt) cnt.textContent = ANEXOS.length ? ANEXOS.length : '';

  box.innerHTML = ANEXOS.length
    ? ANEXOS.map(a => `<div class="anx">
        <span class="v">v${a.versao}</span>
        <span class="n" onclick="abrirAnexo('${esc(a.arquivo_path)}')" title="abrir">${esc(a.arquivo_nome)}</span>
        <span class="q">${esc(new Date(a.enviado_em).toLocaleDateString('pt-BR'))}${a.enviado_por?' · '+esc(String(a.enviado_por).split('@')[0]):''}${a.bytes?' · '+(a.bytes/1024).toFixed(0)+' KB':''}</span>
      </div>`).join('')
      + `<div style="margin-top:10px"><button class="btn-ed" onclick="conferirProposta(${id})" id="conf-bt"><svg class="ic" aria-hidden="true"><use href="#ic-balanca"/></svg> Conferir a v${ANEXOS[0].versao} contra o teto CMED</button></div>`
    : '<div class="salvo">Nenhuma proposta anexada ainda.</div>';

  pintaConferencias(id);
}

// URL ASSINADA e não pública — o bucket é privado. Mesma regra da tela de Documentos: o link vale
// 60 segundos, que é o tempo de abrir. Link de proposta que vale para sempre é link que vaza.
async function abrirAnexo(path){
  try{
    const r = await fetch(`${SB_URL}/storage/v1/object/sign/documentos/${encodeURIComponent(path)}`, {
      method:'POST', headers: Object.assign({'Content-Type':'application/json'}, SB_H),
      body: JSON.stringify({ expiresIn: 60 }) });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    window.open(SB_URL + '/storage/v1' + j.signedURL, '_blank', 'noopener');
  }catch(e){ alert('Não consegui abrir o arquivo: ' + e.message); }
}

async function anexarProposta(id){
  const msg = document.getElementById('prop-msg'), bt = document.getElementById('prop-bt');
  const arq = (document.getElementById('prop-arq').files || [])[0];
  if(!arq){ msg.textContent = 'escolha o PDF da proposta.'; return; }
  bt.disabled = true; msg.textContent = 'enviando…';
  try{
    // Caminho sem acento e sem espaço: nome de arquivo com caractere estranho quebra a URL
    // assinada na hora de baixar, e o erro só aparece meses depois, na hora de precisar.
    const limpo = arq.name.normalize('NFD').replace(/\p{M}/gu,'').toLowerCase().replace(/[^a-z0-9._-]+/g,'-');
    const path = 'negocio-' + id + '/proposta/' + Date.now() + '-' + limpo;
    const up = await fetch(`${SB_URL}/storage/v1/object/documentos/${encodeURIComponent(path)}`, {
      method:'POST', headers: Object.assign({}, SB_H), body: arq });
    if(!up.ok) throw new Error(up.status===403 ? 'só gestor pode enviar arquivo' : ('não consegui enviar (HTTP '+up.status+')'));
    // >>> A VERSÃO NÃO VAI DAQUI. Quem calcula é uma trigger no banco: duas abas abertas
    //     mandariam "2" ao mesmo tempo e uma sobrescreveria a outra sem erro nenhum.
    const r = await fetch(`${SB_URL}/rest/v1/negocio_anexos`, {method:'POST',
      headers: Object.assign({'Prefer':'return=representation'}, SB_H, {'Content-Type':'application/json'}),
      body: JSON.stringify({ negocio_id: id, categoria: CAT_PROPOSTA, arquivo_path: path,
        arquivo_nome: arq.name, bytes: arq.size,
        enviado_por: (window.gmAuth && gmAuth.user && gmAuth.user.email) || null })});
    if(!r.ok) throw new Error('o arquivo subiu, mas não consegui registrar (HTTP ' + r.status + ')');
    const nova = (await r.json())[0];
    document.getElementById('prop-arq').value = '';
    msg.textContent = 'anexada como v' + (nova ? nova.versao : '?') + '. A anterior continua lá.';
    await carregarProposta(id);
  }catch(e){ msg.textContent = 'não consegui anexar: ' + e.message; }
  bt.disabled = false;
}

/* ── A CONFERÊNCIA ───────────────────────────────────────────────────────────────────────────
   Baixa a última versão anexada, lê os itens com a MESMA função do Conferidor (que vive no
   motor), avalia cada um contra o teto e registra o resultado. */
async function carregarIdxCMED(){
  if(IDX_CMED) return IDX_CMED;
  const T = window.LimedtecTetoCMED;
  const pega = async rota => {
    let out = [], off = 0;
    while(true){
      const r = await fetch(`${SB_URL}/rest/v1/${rota}&limit=1000&offset=${off}`, {headers:SB_H});
      if(!r.ok) throw new Error('não consegui ler a tabela CMED (HTTP ' + r.status + ')');
      const d = await r.json(); out = out.concat(d);
      if(d.length < 1000 || off > 30000) break;      // o PostgREST daqui pagina em 1000
      off += 1000;
    }
    return out;
  };
  const [teto, dicionario, vig] = await Promise.all([
    pega('cmed_teto?select=subst_norm,dose_key,apresentacoes,teto_min,teto_max,tem_cap'),
    pega('cmed_dicionario?select=marca_norm,substancia'),
    fetch(`${SB_URL}/rest/v1/v_cmed_vigencia?select=*`, {headers:SB_H})
      .then(r => r.ok ? r.json() : null).then(j => (j && j[0]) || null).catch(() => null),
  ]);
  CMED_VIG = vig;
  IDX_CMED = T.indexar({ regua: [], teto, dicionario });
  IDX_CMED._chaves = teto.length;
  return IDX_CMED;
}

let CONF_ULTIMA = null;
async function conferirProposta(id){
  const msg = document.getElementById('conf-msg'), bt = document.getElementById('conf-bt');
  const anexo = ANEXOS[0];
  if(!anexo){ msg.textContent = 'anexe a proposta primeiro.'; return; }
  const T = window.LimedtecTetoCMED;
  if(!T || typeof T.avaliar !== 'function'){ msg.textContent = 'o motor de teto não carregou — recarregue a tela.'; return; }
  if(bt) bt.disabled = true;
  msg.textContent = 'baixando o anexo…';
  try{
    const rs = await fetch(`${SB_URL}/storage/v1/object/sign/documentos/${encodeURIComponent(anexo.arquivo_path)}`, {
      method:'POST', headers: Object.assign({'Content-Type':'application/json'}, SB_H),
      body: JSON.stringify({ expiresIn: 120 }) });
    if(!rs.ok) throw new Error('não consegui abrir o anexo (HTTP ' + rs.status + ')');
    const url = SB_URL + '/storage/v1' + (await rs.json()).signedURL;
    const buf = await (await fetch(url)).arrayBuffer();

    msg.textContent = 'lendo o PDF…';
    const texto = await pdfParaTextoNeg(buf);
    const itens = T.itensDoTexto(texto);
    if(!itens.length) throw new Error('não consegui ler nenhuma linha com preço neste PDF. '
      + 'Se ele for escaneado (só imagem), a extração de texto não enxerga — nesse caso confira pelo Conferidor colando o texto.');

    msg.textContent = 'carregando a tabela CMED…';
    const idx = await carregarIdxCMED();

    // paraGoverno = true SEMPRE aqui, e isto é uma decisão: esta tela vive dentro de um negócio
    // de LICITAÇÃO. O teto que vale numa venda ao governo é o PMVG (com o desconto CAP onde ele
    // se aplica), não o PF. Conferir contra o PF numa proposta pro governo aprovaria preço que
    // desclassifica.
    const resultado = itens.map(it => Object.assign({}, it,
      T.avaliar({ descricao: it.descricao, precoUnit: it.precoUnit, unitario: it.precoUnit != null, paraGoverno: true }, idx)));
    const res = T.resumir(resultado);
    const acima = resultado.filter(x => x.situacao === 'acima');
    const pior = acima.length ? Math.max(...acima.map(x => Number(x.pctAcima)||0)) : null;

    CONF_ULTIMA = { negocio: id, anexo, resultado, res, pior, quando: new Date() };

    // REGISTRA. O que fica gravado é o RESUMO e a régua da época — não as linhas, que são
    // deriváveis do anexo a qualquer momento e ocupariam o banco à toa.
    try{
      await fetch(`${SB_URL}/rest/v1/negocio_conferencias`, {method:'POST',
        headers: Object.assign({}, SB_H, {'Content-Type':'application/json'}),
        body: JSON.stringify({ negocio_id: id, anexo_id: anexo.id,
          itens: res.total, dentro: res.ok, acima: res.acima,
          nao_encontrados: res.naoEncontrados, sem_preco: res.semPreco,
          pior_pct: pior, cmed_vigente_desde: CMED_VIG ? String(CMED_VIG.vigente_desde).slice(0,10) : null,
          detalhe: { anexo: anexo.arquivo_nome, versao: anexo.versao, chaves: idx._chaves },
          quem: (window.gmAuth && gmAuth.user && gmAuth.user.email) || null })});
    }catch(e){ /* o registro falhar não pode engolir o resultado que a pessoa já viu */ }

    msg.textContent = '';
    pintaConferencia(id);
    await carregarProposta(id);
    carregar().then(pinta);   // o selo do card lê a conferência mais nova
  }catch(e){ msg.textContent = '<svg class="ic" aria-hidden="true"><use href="#ic-alerta"/></svg> ' + e.message; }
  if(bt) bt.disabled = false;
}

// A MESMA extração de PDF do Conferidor e do leitor de edital: agrupa por Y pra preservar a
// LINHA. Sem isso a descrição perde o preço de vista e todo item vira "sem preço".
let _pdfjsNeg = null;
function carregarPdfjsNeg(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(_pdfjsNeg) return _pdfjsNeg;
  _pdfjsNeg = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(window.pdfjsLib); };
    s.onerror = () => rej(new Error('não consegui carregar o leitor de PDF (precisa de internet)'));
    document.head.appendChild(s);
  });
  return _pdfjsNeg;
}
async function pdfParaTextoNeg(buf){
  const pdfjs = await carregarPdfjsNeg();
  /* CVE-2024-4367: o PDF vem de FORA (PNCP, portal, e-mail) e a aba esta logada. Sem
     `isEvalSupported:false` um PDF preparado executa script aqui dentro. Mitigacao oficial da
     Mozilla; nao custa nada porque estas telas extraem TEXTO, nao renderizam pagina. */
    const doc = await pdfjs.getDocument({ data: buf, isEvalSupported: false }).promise;
  let out = '';
  for(let p = 1; p <= doc.numPages; p++){
    const tc = await (await doc.getPage(p)).getTextContent();
    const linhas = [];
    for(const it of tc.items){
      if(!it.str || !it.str.trim()) continue;
      const x = it.transform[4], y = it.transform[5];
      let alvo = linhas.find(l => Math.abs(l.y - y) <= 2.5);
      if(!alvo){ alvo = { y, itens: [] }; linhas.push(alvo); }
      alvo.itens.push({ x, str: it.str });
    }
    linhas.sort((a,b) => b.y - a.y);
    out += linhas.map(l => l.itens.sort((a,b)=>a.x-b.x).map(i=>i.str).join(' ')).join('\n') + '\n';
  }
  return out;
}

function fraseReguaNeg(){
  const v = CMED_VIG;
  if(!v || !v.vigente_desde) return '<b style="color:var(--ambar-700)">não consegui identificar a edição da CMED usada</b>';
  const d = new Date(String(v.vigente_desde).slice(0,10) + 'T12:00:00');
  return 'régua: <b>CMED publicada em ' + d.toLocaleDateString('pt-BR') + '</b>'
    + (isFinite(Number(v.dias_desde)) ? ' (há ' + v.dias_desde + ' dias)' : '')
    + (Number(v.dias_desde) > 45 ? ' · <b style="color:var(--ambar-700)">a CMED publica todo mês — pode haver edição mais nova</b>' : '');
}

function pintaConferencia(id){
  const box = document.getElementById('conf-resultado'); if(!box || !CONF_ULTIMA) return;
  const { resultado, res, anexo } = CONF_ULTIMA;
  const rot = { abaixo:'dentro do teto', acima:'ACIMA DO TETO', nao_encontrado:'não encontrado na CMED', sem_preco:'sem preço legível' };
  const linhas = resultado.slice().sort((a,b) =>
    (a.situacao==='acima'?0:a.situacao==='nao_encontrado'?1:2) - (b.situacao==='acima'?0:b.situacao==='nao_encontrado'?1:2));
  box.innerHTML =
      `<div class="pl-conf">
        <div class="ok"><b>${res.ok}</b><span>dentro do teto</span></div>
        <div class="acima"><b>${res.acima}</b><span>ACIMA do teto</span></div>
        <div><b>${res.naoEncontrados}</b><span>não achados na CMED</span></div>
        ${res.semPreco?`<div><b>${res.semPreco}</b><span>sem preço legível</span></div>`:''}
        <div><b>${res.total}</b><span>linhas lidas</span></div>
      </div>`
    + `<div class="salvo" style="margin-bottom:8px">${esc(anexo.arquivo_nome)} (v${anexo.versao}) · ${fraseReguaNeg()}</div>`
    // >>> "NÃO ENCONTRADO" NÃO É "DENTRO DO TETO". O placar conta separado de propósito: somar
    //     os dois daria um verde que não existe. Item que a CMED não conhece pode ser material
    //     (que não tem teto) ou pode ser um medicamento que a leitura não casou — e a diferença
    //     entre os dois é quem confere, não a tela.
    + `<div class="dica" style="font-size:11.5px;color:var(--muted);margin-bottom:8px">
        <b>Não encontrado na CMED não quer dizer dentro do teto.</b> Pode ser material (que não tem
        teto legal) ou um medicamento que a leitura não casou — confira os que interessam.
       </div>`
    + `<div style="max-height:340px;overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr>
          <th style="text-align:left;padding:6px;border-bottom:1px solid var(--linha);color:var(--muted);font-size:10.5px">ITEM</th>
          <th style="text-align:right;padding:6px;border-bottom:1px solid var(--linha);color:var(--muted);font-size:10.5px">MEU PREÇO</th>
          <th style="text-align:right;padding:6px;border-bottom:1px solid var(--linha);color:var(--muted);font-size:10.5px">TETO</th>
          <th style="text-align:left;padding:6px;border-bottom:1px solid var(--linha);color:var(--muted);font-size:10.5px">SITUAÇÃO</th>
        </tr></thead><tbody>`
    + linhas.map(r => `<tr>
        <td style="padding:6px;border-bottom:1px solid rgba(34,55,79,.4)">${esc(String(r.descricao).slice(0,90))}</td>
        <td style="padding:6px;text-align:right;border-bottom:1px solid rgba(34,55,79,.4)">${brl(r.precoUnit)}</td>
        <td style="padding:6px;text-align:right;border-bottom:1px solid rgba(34,55,79,.4)">${brl(r.teto)}</td>
        <td style="padding:6px;border-bottom:1px solid rgba(34,55,79,.4);color:${r.situacao==='acima'?'var(--vermelho-700)':r.situacao==='abaixo'?'var(--verde)':'var(--muted)'}">
          ${esc(rot[r.situacao]||r.situacao)}${r.situacao==='acima'?` <b>+${r.pctAcima}%</b>`:''}</td>
      </tr>`).join('')
    + `</tbody></table></div>
       <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
         <button class="btn-ed sec" onclick="imprimirConferencia(${id})"><svg class="ic" aria-hidden="true"><use href="#ic-impressora"/></svg> Relatório (imprimir/PDF)</button>
         <button class="btn-ed sec" onclick="excelConferencia()"><svg class="ic" aria-hidden="true"><use href="#ic-baixar"/></svg> Baixar Excel</button>
       </div>`;
}

function pintaConferencias(id){
  // O HISTÓRICO fica embaixo da lista de anexos: ele responde "a gente já tinha conferido antes
  // de mandar?", que é a pergunta que aparece depois que dá errado.
  const box = document.getElementById('prop-lista'); if(!box || !CONFERENCIAS.length) return;
  box.innerHTML += '<div class="salvo" style="margin-top:10px"><b>Conferências anteriores</b></div>'
    + CONFERENCIAS.map(c => `<div class="anx">
        <span class="q">${esc(new Date(c.quando).toLocaleDateString('pt-BR'))}</span>
        <span class="n" style="cursor:default;text-decoration:none">${c.itens} itens · <b style="color:${c.acima?'var(--vermelho-700)':'var(--verde)'}">${c.acima} acima</b> · ${c.nao_encontrados} não achados</span>
        <span class="q">${c.cmed_vigente_desde ? 'CMED ' + esc(new Date(c.cmed_vigente_desde + 'T12:00:00').toLocaleDateString('pt-BR')) : 'régua não registrada'}</span>
      </div>`).join('');
}

/* O RELATÓRIO IMPRIMÍVEL. Mesmo padrão dos outros documentos do sistema: abre numa janela
   própria, com botão de imprimir que some na impressão.
   >>> A VIGÊNCIA DA CMED VAI NO RODAPÉ, e não é enfeite: este papel sai da tela e vive semanas
       numa pasta. Uma conferência sem a data da régua é uma afirmação sem prazo de validade —
       daqui a dois meses continua parecendo verdadeira, e o teto já mudou. */
function imprimirConferencia(id){
  if(!CONF_ULTIMA) return;
  const n = NEG.find(x => x.id === id) || {};
  const { resultado, res, anexo, quando } = CONF_ULTIMA;
  const emp = (window.LIMEDTEC_CLIENTE && LIMEDTEC_CLIENTE.empresa) || {};
  const v = CMED_VIG;
  const rot = { abaixo:'dentro do teto', acima:'ACIMA DO TETO', nao_encontrado:'não encontrado', sem_preco:'sem preço' };
  const j = window.open('', '_blank');
  if(!j){ alert('o navegador bloqueou a janela — libere o pop-up pra gerar o relatório'); return; }
  const money = x => x==null ? '—' : 'R$ ' + Number(x).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:4});
  j.document.write('<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">'
    + '<title>Conferência CMED — ' + esc(n.numero || n.orgao || 'negócio') + '</title>'
    + '<style>body{font:12px/1.55 system-ui,sans-serif;max-width:900px;margin:26px auto;padding:0 20px;color:#111}'
    + 'h1{font-size:17px;margin:0 0 4px} h2{font-size:13px;margin:20px 0 6px}'
    + 'table{width:100%;border-collapse:collapse;margin-top:8px} th,td{padding:5px 6px;border-bottom:1px solid #ddd;text-align:left}'
    + 'th{font-size:10px;text-transform:uppercase;color:#666} td.n{text-align:right;white-space:nowrap}'
    + '.acima{color:#b02a20;font-weight:700} .ok{color:#2f7d32}'
    + '.placar{display:flex;gap:18px;margin:12px 0;flex-wrap:wrap} .placar div{border:1px solid #ddd;border-radius:8px;padding:8px 14px}'
    + '.placar b{display:block;font-size:18px}'

function excelConferencia(){
  if(!CONF_ULTIMA) return;

  carregarXlsxNeg().then(X => {

      'Item da proposta': r.descricao,

      'Teto CMED': r.teto,

    })));
    ws['!cols'] = [{wch:60},{wch:16},{wch:14},{wch:24},{wch:10},{wch:12},{wch:40}];
    // A RÉGUA VAI DENTRO DA PLANILHA, pelo mesmo motivo do relatório impresso: o .xlsx sai daqui
    // e vive no e-mail de alguém, longe de qualquer aviso da tela.
    X.utils.sheet_add_aoa(ws, [[],
      [(v && v.vigente_desde)
        ? 'Conferido contra a tabela CMED publicada em ' + new Date(String(v.vigente_desde).slice(0,10)+'T12:00:00').toLocaleDateString('pt-BR')
        : 'ATENÇÃO: não foi possível identificar a edição da CMED usada nesta conferência.'],
      ['Proposta: ' + anexo.arquivo_nome + ' (versão ' + anexo.versao + ') · gerado em ' + new Date().toLocaleString('pt-BR')],
      ['Teto aplicado: PMVG (venda ao governo). "Não encontrado" não quer dizer dentro do teto.'],
    ], { origin: -1 });

    X.writeFile(wb, 'conferencia-cmed-' + (anexo.arquivo_nome||'proposta').replace(/\.pdf$/i,'').slice(0,40) + '.xlsx');
  }).catch(e => alert(e.message));
}
// Baixado só no clique — a maioria de quem abre a ficha nunca exporta planilha.
let _xlsxNeg = null;
function carregarXlsxNeg(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(_xlsxNeg) return _xlsxNeg;
  _xlsxNeg = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => res(window.XLSX);
    s.onerror = () => rej(new Error('não consegui carregar o gerador de planilha (precisa de internet)'));
    document.head.appendChild(s);
  });
  return _xlsxNeg;
}

/* ══ INCLUIR LICITAÇÃO À MÃO ═════════════════════════════════════════════════════════════════
   O que nasce aqui é um NEGÓCIO NORMAL: mesma tabela, mesma ficha, mesmas abas, mesmo lembrete
   de abertura. Não há "negócio manual" como espécie separada — há um negócio cuja ORIGEM foi a
   mão de alguém, e isso fica dito.

   >>> OS CAMPOS SÃO OS DA FICHA QUE JÁ EXISTE, e nenhum a mais. A tentação era pedir "só o
       essencial" e deixar o resto pra depois; o resultado seria um negócio pela metade que não
       aparece direito no funil, na agenda nem no sino — e ninguém entenderia por quê.
   >>> A DUPLICATA É AVISADA ANTES, e não impedida. Órgão que republica o mesmo pregão existe, e
       recusar a criação obrigaria a inventar um número diferente pra contornar a trava — que é
       como se estraga um índice. Avisar e deixar decidir é o certo. */
const PORTAIS_SUGERIDOS = ['BLL', 'BNC', 'Licitanet', 'Compras.gov.br', 'Portal de Compras Públicas', 'ComprasNet', 'Outro'];

/* A PROCEDÊNCIA, DITA NA FICHA. Não é rótulo decorativo: é onde se confere o dado. O do PNCP tem
   número de controle oficial; o do calendário veio de uma planilha que alguém manteve à mão; o
   manual foi digitado aqui, por alguém, num dia. As três são legítimas e nenhuma é igual. */
function selaOrigem(n){
  const o = String(n.origem || '');
  if(o === 'manual'){
    return '<h4>Procedência</h4><div class="salvo">'
      + '<svg class="ic" aria-hidden="true"><use href="#ic-nota"/></svg> <b>Incluída à mão</b>' + (n.criado_por ? ' por ' + esc(String(n.criado_por).split('@')[0]) : '')
      + (n.criado_em ? ' em ' + esc(new Date(n.criado_em).toLocaleDateString('pt-BR')) : '')
      + '<br>Não veio do PNCP — os dados são os que foram digitados aqui. Para conferir, o caminho '
      + 'é o portal de origem' + (n.portal ? ' (' + esc(n.portal) + ')' : '') + '.</div>';
  }
  if(o === 'calendario_2025'){
    return '<h4>Procedência</h4><div class="salvo">'
      + '<svg class="ic" aria-hidden="true"><use href="#ic-calendario"/></svg> <b>Importada do Calendário 2025</b><br>Veio da planilha que a equipe mantinha antes do '
      + 'sistema. O valor total está lá; o detalhe por item, em geral, não.</div>';
  }
  if(o === 'licitacoes'){
    return '<h4>Procedência</h4><div class="salvo">'
      + '<svg class="ic" aria-hidden="true"><use href="#ic-orgao"/></svg> <b>Do PNCP</b>, pela tela de Licitações' + (n.numero ? ' · nº ' + esc(n.numero) : '')
      + '<br>Os dados vieram do índice oficial e podem ser conferidos lá.</div>';
  }
  return o ? '<h4>Procedência</h4><div class="salvo">origem: ' + esc(o) + '</div>' : '';
}
