/* ── A DUPLICATA ─────────────────────────────────────────────────────────────────────────────
   Procura por portal + número + órgão, que é o trio que identifica um certame na prática. A
   comparação ignora acento, maiúscula e pontuação: "PE 050/2026" e "pe050/2026" são o mesmo
   pregão pra quem trabalha, e seriam dois pro banco. */
const _chaveCert = s => String(s||'').normalize('NFD').replace(/\p{M}/gu,'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function achaDuplicata(portal, numero, orgao){
  const n = _chaveCert(numero), o = _chaveCert(orgao), p = _chaveCert(portal);
  if(!n) return null;
  return NEG.find(x => _chaveCert(x.numero) === n
    && (!o || !x.orgao || _chaveCert(x.orgao) === o)
    && (!p || !x.portal || _chaveCert(x.portal) === p)) || null;
}

async function salvarManual(){
  const msg = document.getElementById('m-msg'), bt = document.getElementById('m-bt');
  const v = id => (document.getElementById(id).value || '').trim();
  const orgao = v('m-orgao'), numero = v('m-numero'), portal = v('m-portal');
  // O MÍNIMO PRA UM NEGÓCIO SER RECONHECÍVEL. Sem órgão nem número, o card do funil fica sem
  // título e ninguém acha aquilo de novo — o negócio existiria só pra atrapalhar a contagem.
  if(!orgao && !numero){ msg.textContent = 'escreva ao menos o órgão ou o número do certame.'; return; }

  const dup = achaDuplicata(portal, numero, orgao);
  if(dup){
    if(!confirm('Já existe um negócio com esse número' + (dup.orgao ? ' no ' + dup.orgao : '') + '.\n\n'
      + 'OK = abrir o que já existe\nCancelar = voltar pro formulário (pra corrigir o número)')) return;
    fecharFormManual(); abrirDrawer(dup.id); return;
  }

  bt.disabled = true; msg.textContent = 'incluindo…';
  try{
    const ab = v('m-abertura');
    const valor = parseFloat(v('m-valor').replace(',', '.'));
    const corpo = {
      empresa_id: Number(v('m-empresa')) || null,
      estagio: v('m-estagio') || 'oportunidade',
      situacao: v('m-situacao') || 'normal',
      portal: portal || null, numero: numero || null, orgao: orgao || null,
      municipio: v('m-municipio') || null,
      uf: v('m-uf') ? v('m-uf').toUpperCase().slice(0,2) : null,
      modalidade: v('m-modalidade') || null,
      objeto: v('m-objeto') || null,
      // A OBSERVAÇÃO VAI PRAS ANOTAÇÕES, e não pra um campo novo. É o mesmo texto livre que a
      // aba Observações já mostra e edita — um campo separado criaria dois lugares pra mesma
      // coisa, e o segundo seria o que ninguém lembra de ler.
      anotacoes: v('m-obs') || null,
      abertura: ab ? new Date(ab).toISOString() : null,
      valor_estimado: isFinite(valor) && valor > 0 ? valor : null,
      // >>> A ORIGEM É O QUE DIZ A VERDADE SOBRE ESTE REGISTRO. `manual` fica ao lado de
      //     `calendario_2025` e `licitacoes` — três procedências, e a ficha mostra qual foi.
      origem: 'manual',
      criado_por: (window.gmAuth && gmAuth.user && gmAuth.user.email) || null,
      arquivado: false,
    };
    const r = await fetch(`${SB_URL}/rest/v1/negocios`, {method:'POST',
      headers: Object.assign({'Prefer':'return=representation'}, SB_H, {'Content-Type':'application/json'}),
      body: JSON.stringify(corpo)});
    if(!r.ok) throw new Error('HTTP ' + r.status + (r.status===401||r.status===403 ? ' — sem permissão de gravar' : ''));
    const novo = (await r.json())[0];

    /* ── OS ARQUIVOS VÊM DEPOIS, E DE PROPÓSITO ────────────────────────────────────────────
       O negócio JÁ ESTÁ CRIADO neste ponto. Se um upload falhar agora, o cadastro não se perde:
       ele fica lá, e a tela diz qual arquivo faltou. O contrário — subir tudo primeiro e criar
       o negócio no fim — perderia o cadastro inteiro por causa de um PDF grande demais, e a
       pessoa teria que digitar os doze campos de novo. */
    const arqs = Array.from((document.getElementById('m-arqs') || {}).files || []);
    const falhou = [];
    for(let i = 0; i < arqs.length; i++){
      msg.textContent = 'negócio criado · subindo ' + (i+1) + ' de ' + arqs.length + '…';
      // O PRIMEIRO É O EDITAL, os outros são anexos dele. É a convenção que o formulário anuncia,
      // e ela existe pro botão de ler saber qual mandar sem ninguém precisar classificar arquivo.
      const r2 = await subirAnexo(novo.id, arqs[i], i === 0 ? 'edital' : 'anexo_edital');
      if(!r2.ok) falhou.push({ nome: arqs[i].name, motivo: r2.erro });
    }
    fecharFormManual();
    await carregar(); pinta();
    if(novo && novo.id){
      abrirDrawer(novo.id);
      if(falhou.length){
        // >>> O AVISO VAI PRA FICHA, e não some num toast. Quem acabou de incluir precisa saber
        //     EXATAMENTE qual arquivo não subiu — e continuar de onde parou, na tela onde o
        //     botão de anexar está.
        window._anexosQueFalharam = falhou;
        setTimeout(() => {
          const cx = document.getElementById('ed-msg');
          if(cx) cx.innerHTML = '<b style="color:var(--vermelho-700)"><svg class="ic" aria-hidden="true"><use href="#ic-alerta"/></svg> O negócio foi criado, mas '
            + falhou.length + ' arquivo(s) NÃO subiram:</b><br>'
            + falhou.map(x => '· ' + esc(x.nome) + ' — ' + esc(x.motivo)).join('<br>')
            + '<br>Anexe de novo aqui embaixo.';
        }, 400);
      }
    }
  }catch(e){ msg.textContent = 'não consegui incluir: ' + e.message; bt.disabled = false; }
}

/* ── SUBIR UM ANEXO — o caminho único ────────────────────────────────────────────────────────
   Já havia dois lugares subindo arquivo (proposta e ata) com o mesmo código copiado; este é o
   terceiro, e três cópias é onde uma delas começa a divergir. Agora as três chamam daqui.
   Devolve `{ok, erro}` em vez de estourar: quem chama precisa CONTINUAR com os outros arquivos
   quando um falha, e não abortar a fila inteira no primeiro tropeço. */
async function subirAnexo(negocioId, arq, categoria){
  try{
    // Caminho sem acento e sem espaço: nome com caractere estranho quebra a URL assinada na hora
    // de baixar, e o erro só aparece meses depois, na hora de precisar.
    const limpo = arq.name.normalize('NFD').replace(/\p{M}/gu,'').toLowerCase().replace(/[^a-z0-9._-]+/g,'-');
    const path = 'negocio-' + negocioId + '/' + categoria + '/' + Date.now() + '-' + limpo;
    const up = await fetch(`${SB_URL}/storage/v1/object/documentos/${encodeURIComponent(path)}`, {
      method:'POST', headers: Object.assign({}, SB_H), body: arq });
    if(!up.ok) return { ok:false, erro: up.status===403 ? 'só gestor pode enviar arquivo' : ('o envio respondeu ' + up.status) };
    const r = await fetch(`${SB_URL}/rest/v1/negocio_anexos`, {method:'POST',
      headers: Object.assign({'Prefer':'return=representation'}, SB_H, {'Content-Type':'application/json'}),
      body: JSON.stringify({ negocio_id: negocioId, categoria, arquivo_path: path,
        arquivo_nome: arq.name, bytes: arq.size,
        enviado_por: (window.gmAuth && gmAuth.user && gmAuth.user.email) || null })});
    // >>> ARQUIVO NO BUCKET SEM LINHA NO BANCO É ARQUIVO QUE NINGUÉM ACHA. Se o registro falhar,
    //     isto é uma falha — mesmo com o upload tendo dado certo.
    if(!r.ok) return { ok:false, erro: 'o arquivo subiu, mas não consegui registrar (HTTP ' + r.status + ')' };
    return { ok:true, linha: (await r.json())[0] };
  }catch(e){ return { ok:false, erro: e.message }; }
}

/* ══ OS NÚMEROS DO TOPO — UM LUGAR SÓ ════════════════════════════════════════════════════════
   As caixinhas viraram botões, e os painéis que elas abrem mostram A MESMA lista que gerou o
   número. Se cada um contasse por conta própria, o dia em que a definição mudasse teria dois
   resultados na mesma tela — e o operador não teria como saber qual acreditar.

   ══ A TAXA DE VITÓRIA: O QUE ELA É DE VERDADE ══════════════════════════════════════════════
   Foi pedido pra conferir de onde o número vem e ESCREVER. Conferido no banco em 11/08:
     · GANHAS ......... negócio com `valor_ganho > 0`. São 105, e todas estão na fase Ata.
     · O DENOMINADOR .. era `estagio='classificacao' OR valor_ganho>0` = 696.
   Ou seja: quem chegou à Habilitação e não ganhou conta como PERDIDA, e quem parou antes
   (Oportunidade, Qualificação) não conta em lugar nenhum. Isso está certo — perder na
   habilitação é perder; desistir na triagem não é disputa.

   >>> MAS HAVIA UMA DISTORÇÃO, e ela foi corrigida: o denominador contava também os negócios que
       ainda ESTÃO na Habilitação, ou seja, em disputa. Um pregão que acontece semana que vem
       entrava na conta como já perdido. Hoje isso é 1 de 696 e quase não muda o número — mas
       numa semana com 20 disputas abertas a taxa despencaria sozinha, sem nada ter dado errado.
       A regra passou a ser: só entra no denominador o que JÁ ACABOU (arquivado) ou já ganhou.
   >>> E A TELA DIZ A CONTA. "10,6%" sem denominador é um número que ninguém pode conferir. */
function numerosDoTopo(){
  const ganhos = NEG.filter(n => Number(n.valor_ganho) > 0);
  // DECIDIDAS = ganhou, ou chegou à Habilitação e o processo já terminou.
  const perdidas = NEG.filter(n => n.estagio === 'classificacao' && n.arquivado && !(Number(n.valor_ganho) > 0));
  const decididas = ganhos.length + perdidas.length;
  const emDisputa = NEG.filter(n => n.estagio === 'classificacao' && !n.arquivado).length;
  return {
    ganhos, perdidas, decididas, emDisputa,
    noFunil: NEG.filter(n => !n.arquivado).length,
    historico: NEG.length,
    total: ganhos.reduce((s,n) => s + Number(n.valor_ganho||0), 0),
    taxa: decididas ? (ganhos.length / decididas * 100) : null,
    taxaTxt: decididas ? (ganhos.length / decididas * 100).toFixed(1) + '%' : '—',
  };
}

let ITENS_GANHOS_MAPA = {};   // negocio_id -> {itens, soma, diferenca}, pro painel das ganhas

/* ── O PAINEL ────────────────────────────────────────────────────────────────────────────────
   Painel dentro do próprio Negócios, e não uma tela nova: o pedido foi explícito ("sem criar
   tela nova pesada"), e uma tela a mais teria o seu próprio boot, a sua própria sessão e o seu
   próprio jeito de discordar desta sobre o que é uma "ganha". */
function fecharPainel(){
  const p = document.getElementById('painel-kpi');
  if(p){ p.style.display = 'none'; p.innerHTML = ''; }
}
async function abrirPainel(qual){
  const p = document.getElementById('painel-kpi'); if(!p) return;
  p.style.display = 'block';
  p.scrollIntoView({behavior:'smooth', block:'nearest'});

  // "no funil" e "histórico" não abrem lista própria: eles MEXEM NOS FILTROS da tela, que já é
  // a lista. Duplicar a lista aqui seria manter dois lugares que mostram a mesma coisa.
  if(qual === 'funil' || qual === 'historico'){
    document.getElementById('f-arquivados').checked = (qual === 'historico');
    FASE_SEL = null;
    /* A BUSCA POR ÓRGÃO/Nº NASCE ESCONDIDA nesta tela (só aparece pela lupa). No histórico ela
       é obrigatória: mil e tantos negócios sem campo de busca é uma lista pra rolar, não pra
       usar — e a busca foi parte do pedido. Então abrir o histórico REVELA o campo, e limpa o
       que estivesse escrito nele, porque um filtro sobrando explicaria mal o número de cima. */
    const b = document.getElementById('f-busca');
    if(b){ b.value = ''; b.style.display = (qual === 'historico') ? '' : 'none'; if(qual === 'historico') setTimeout(()=>b.focus(), 60); }
    pinta();
    const k = numerosDoTopo();
    p.innerHTML = '<div class="pk-topo"><b>' + (qual === 'funil'
        ? k.noFunil + ' no funil agora' : k.historico.toLocaleString('pt-BR') + ' no histórico')
      + '</b><button class="btn-ed sec" onclick="fecharPainel()">fechar</button></div>'
      + '<div class="salvo">' + (qual === 'funil'
          ? 'A lista abaixo está mostrando <b>só os ativos</b> — os filtros foram limpos.'
          : 'A lista abaixo está mostrando <b>tudo</b>, inclusive os arquivados: os negócios do '
            + 'Calendário 2025 e os que saíram do funil. Use a busca por órgão ou nº.')
      + '</div>';
    return;
  }

  p.innerHTML = '<div class="pk-topo"><b>carregando…</b><button class="btn-ed sec" onclick="fecharPainel()">fechar</button></div>';
  // A SOMA DOS ITENS vem do banco, e não da tela: é ela que precisa BATER com o valor da ficha,
  // e uma conta feita aqui seria uma terceira versão do mesmo número.
  try{
    const r = await fetch(`${SB_URL}/rest/v1/v_negocios_ganhos`
      + '?select=id,itens_confirmados,soma_itens,diferenca&limit=2000', {headers:SB_H});
    ITENS_GANHOS_MAPA = {};
    if(r.ok) for(const x of await r.json()) ITENS_GANHOS_MAPA[x.id] = x;
  }catch(e){ ITENS_GANHOS_MAPA = {}; }
  pintaPainelGanhas(qual);
}

function pintaPainelGanhas(qual){
  const p = document.getElementById('painel-kpi');
  const k = numerosDoTopo();
  // ORDENADA POR VALOR, como pedido: o relatório de ganhos começa pelo que pesa.
  const linhas = k.ganhos.slice().sort((a,b) => Number(b.valor_ganho||0) - Number(a.valor_ganho||0));
  window._painelGanhas = linhas;

  const titulo = qual === 'taxa' ? 'Taxa de vitória' : qual === 'total' ? 'Total ganho' : 'Negócios ganhos';
  // >>> A CONTA APARECE POR EXTENSO. "10,6%" é um número que ninguém confere; "105 ganhas de 695
  //     decididas" é uma frase que qualquer um refaz na calculadora.
  const contexto = qual === 'taxa'
    ? `<div class="pk-conta"><b>${k.ganhos.length} ganhas</b> de <b>${k.decididas} decididas</b> = <b>${k.taxaTxt}</b>
        <div class="salvo" style="margin-top:6px">
          <b>Decididas</b> = as que a empresa ganhou (${k.ganhos.length}) + as que chegaram à Habilitação e o
          processo já terminou (${k.perdidas.length}). Quem parou antes da Habilitação (triagem, qualificação)
          <b>não entra</b>: desistir na triagem não é perder uma disputa.
          ${k.emDisputa ? `<br><b>${k.emDisputa}</b> negócio(s) ainda em disputa <b>não contam</b> — nem como ganho, nem como perda.` : ''}
        </div></div>`
    : qual === 'total'
    ? `<div class="pk-conta"><b>${brl(k.total)}</b> é a soma do valor ganho das ${k.ganhos.length} abaixo.</div>`
    : '';

  const comItens = linhas.filter(n => (ITENS_GANHOS_MAPA[n.id]||{}).itens_confirmados > 0).length;
  const somaTotal = linhas.reduce((s,n) => s + Number(n.valor_ganho||0), 0);

  p.innerHTML = '<div class="pk-topo"><b>' + titulo + ' · ' + linhas.length + ' negócio(s)</b>'
      + '<span style="margin-left:auto;display:flex;gap:8px">'
      + '<button class="btn-ed sec" onclick="excelGanhas()"><svg class="ic" aria-hidden="true"><use href="#ic-baixar"/></svg> Excel</button>'
      + '<button class="btn-ed sec" onclick="imprimirGanhas()"><svg class="ic" aria-hidden="true"><use href="#ic-impressora"/></svg> Imprimir</button>'
      + '<button class="btn-ed sec" onclick="fecharPainel()">fechar</button></span></div>'
    + contexto
    + '<div class="salvo" style="margin:8px 0">'
    +   comItens + ' de ' + linhas.length + ' têm os itens detalhados gravados. '
    +   'Os demais vieram do histórico do calendário, que guarda o valor total sem item a item — '
    +   '<b>isso é normal, não é erro</b>.</div>'
    + '<div style="max-height:430px;overflow:auto"><table class="pk-tab">'
    + '<thead><tr>' + ['ÓRGÃO','Nº','MUNICÍPIO','ABERTURA','ITENS','VALOR GANHO'].map(h =>
        '<th>'+h+'</th>').join('') + '</tr></thead><tbody>'
    + linhas.map(n => {
        const g = ITENS_GANHOS_MAPA[n.id] || {};
        // A DIFERENÇA APARECE, e não é escondida — mas só quando HÁ itens pra comparar.
        const dif = (g.diferenca != null && Math.abs(Number(g.diferenca)) >= 0.01)
          ? `<div class="pk-dif">ficha ${brl(n.valor_ganho)} · itens ${brl(g.soma_itens)} — conferir</div>` : '';
        return `<tr onclick="irPara(${n.id})" title="abrir a ficha deste negócio">
          <td>${esc(String(n.orgao||'—').slice(0,42))}${dif}</td>
          <td>${esc(n.numero||'—')}</td>
          <td>${esc(n.municipio||'—')}${n.uf?' · '+esc(n.uf):''}</td>
          <td>${n.abertura ? esc(new Date(n.abertura).toLocaleDateString('pt-BR')) : '—'}</td>
          <td style="text-align:right">${g.itens_confirmados ? g.itens_confirmados : '<span class="salvo">—</span>'}</td>
          <td style="text-align:right"><b>${brl(n.valor_ganho)}</b></td>
        </tr>`;
      }).join('')
    + '</tbody><tfoot><tr>'
    // >>> O RODAPÉ TEM QUE BATER COM O CARTÃO. É a mesma soma, da mesma lista — se um dia
    //     divergirem, é porque alguém criou uma segunda contagem, e é isso que o assert trava.
    + '<td colspan="5" style="text-align:right"><b>total</b></td>'
    + '<td style="text-align:right"><b>' + brl(somaTotal) + '</b></td>'
    + '</tr></tfoot></table></div>';
}

  const emp = (window.LIMEDTEC_CLIENTE && LIMEDTEC_CLIENTE.empresa) || {};
  const j = window.open('', '_blank');
  if(!j){ alert('o navegador bloqueou a janela — libere o pop-up'); return; }
  j.document.write('<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Negócios ganhos</title>'
    + '<style>body{font:12px/1.5 system-ui,sans-serif;max-width:940px;margin:26px auto;padding:0 20px;color:#111}'
    + 'h1{font-size:17px;margin:0 0 4px} table{width:100%;border-collapse:collapse;margin-top:12px}'
    + 'th,td{padding:5px 6px;border-bottom:1px solid #ddd;text-align:left} th{font-size:10px;text-transform:uppercase;color:#666}'

    + '<h1>Negócios ganhos</h1>'
    + '<div>' + esc(emp.razaoSocial || emp.nome || '') + (emp.cnpj ? ' · CNPJ ' + esc(emp.cnpj) : '') + '</div>'
    + '<div style="color:#555;margin-top:6px">' + linhas.length + ' negócio(s) · taxa de vitória '
    +   esc(k.taxaTxt) + ' (' + k.ganhos.length + ' ganhas de ' + k.decididas + ' decididas)'
    +   '<br>gerado em ' + new Date().toLocaleString('pt-BR') + '</div>'
    + '<div class="acao"><button onclick="window.print()">Imprimir / PDF</button></div>'
    + '<table><thead><tr><th>Órgão</th><th>Nº</th><th>Município</th><th>Abertura</th><th class="n">Itens</th><th class="n">Valor ganho</th></tr></thead><tbody>'
    + linhas.map(n => { const g = ITENS_GANHOS_MAPA[n.id] || {};

        + '<td class="n">' + (g.itens_confirmados || '—') + '</td>'
        + '<td class="n">' + brl(n.valor_ganho).replace('R$ ','R$ ') + '</td></tr>'; }).join('')
    + '</tbody><tfoot><tr><td colspan="5" class="n">total</td><td class="n">'
    +   brl(linhas.reduce((s,n)=>s+Number(n.valor_ganho||0),0)) + '</td></tr></tfoot></table>'
    + '<div style="margin-top:20px;font-size:11px;color:#555">A coluna <b>Itens</b> vazia quer dizer que o '
    + 'resultado veio do histórico do calendário, que guarda o valor total sem detalhe por item — não é erro.</div>'
    + '</body></html>');
  j.document.close();
}

function excelGanhas(){
  const linhas = window._painelGanhas || []; if(!linhas.length) return;
  const k = numerosDoTopo();
  carregarXlsxNeg().then(X => {
    const ws = X.utils.json_to_sheet(linhas.map(n => { const g = ITENS_GANHOS_MAPA[n.id] || {};
      return {
        'Órgão': n.orgao || '', 'Nº': n.numero || '',
        'Município': n.municipio || '', 'UF': n.uf || '',
        'Modalidade': n.modalidade || '', 'Portal': n.portal || '',
        'Abertura': n.abertura ? new Date(n.abertura).toLocaleDateString('pt-BR') : '',
        'Itens confirmados': g.itens_confirmados || null,
        'Soma dos itens': g.soma_itens ?? null,
        'Valor ganho': Number(n.valor_ganho) || null,
      }; }));
    ws['!cols'] = [{wch:46},{wch:16},{wch:22},{wch:6},{wch:18},{wch:16},{wch:12},{wch:16},{wch:16},{wch:16}];
    X.utils.sheet_add_aoa(ws, [[],
      ['TOTAL GANHO', '', '', '', '', '', '', '', '', linhas.reduce((s,n)=>s+Number(n.valor_ganho||0),0)],
      ['Taxa de vitória: ' + k.taxaTxt + ' (' + k.ganhos.length + ' ganhas de ' + k.decididas + ' decididas)'],
      ['"Itens confirmados" vazio = resultado veio do histórico do calendário, sem detalhe por item. Não é erro.'],
      ['Gerado em ' + new Date().toLocaleString('pt-BR')],
    ], { origin: -1 });
    const wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, 'Negócios ganhos');
    X.writeFile(wb, 'negocios-ganhos.xlsx');
  }).catch(e => alert(e.message));
}

/* ══ A FAXINA DE INFORMAÇÃO ══════════════════════════════════════════════════════════════════
   O cliente achou o sistema "muito cheio de coisa". Ele tem razão, e vale ser exato sobre o quê:
   a ficha tem 7 abas e 6 botões no rodapé, e TODOS aparecem sempre — inclusive os que não têm
   nada a ver com o momento do processo. Quem abre um negócio na Oportunidade vê "Gerenciamento
   de Ata" com o mesmo peso de "Informações", e um botão de conferir preço de proposta que ainda
   não existe.

   >>> NADA É REMOVIDO. Isso é regra, não estilo: cada aba e cada botão respondem a uma pergunta
       real, e alguém sempre precisa de um deles fora de hora (o pregão adiou, o negócio voltou de
       fase). Tirar seria trocar "cheio demais" por "cadê aquilo".
   >>> O QUE MUDA É A ORDEM DE CHEGADA. A ficha ABRE na aba que a etapa pede, o rodapé mostra as
       2-3 ações daquele momento, e o resto vai pra "⋯ mais ações" — a um clique, no mesmo lugar,
       sempre.

   O MAPA ABAIXO É A ÚNICA COISA A MEXER quando o processo mudar. Ele responde, por etapa:
   qual aba abre, o que se faz agora (uma frase), e quais botões ficam à vista. */
const ETAPA_FOCO = {
  oportunidade: {
    aba: 'info',
    faz: 'Decidir se vale disputar: leia o objeto, confira a data de abertura e anexe o edital.',
    acoes: ['edital', 'documentos'],
  },
  qualificacao: {
    aba: 'prop',
    faz: 'Montar e conferir a proposta: preço contra o teto da CMED, e credenciamento na indústria se faltar.',
    acoes: ['cmed', 'edital'],
  },
  disputa: {
    aba: 'lembretes',
    faz: 'A sessão é o que manda agora: confirme data e hora, e deixe o lembrete de abertura no sino.',
    acoes: ['zap', 'cmed'],
  },
  classificacao: {
    aba: 'info',
    faz: 'Habilitação: as certidões precisam estar válidas na data da sessão. Recurso e contrarrazão têm prazo em dias úteis.',
    acoes: ['pecas', 'documentos'],
  },
  contrato: {
    aba: 'ata',
    faz: 'Fim do processo: anexe a ata assinada e registre o que foi ganho — é isso que alimenta a taxa de vitória.',
    acoes: ['ata', 'cmed'],
  },
};
const focoDa = k => ETAPA_FOCO[k] || ETAPA_FOCO.oportunidade;
// Qual painel já vem aberto. Fica aqui, ao lado do mapa, porque é a mesma decisão dita de outro
// jeito — separar os dois é como um deles fica pra trás quando o processo muda.
const pnl = (n, k) => 'dw-painel' + (k === focoDa(n.estagio).aba ? ' on' : '');

/* AS AÇÕES DO RODAPÉ, num lugar só. Cada uma sabe se pode aparecer (o leitor de IA é do piloto)
   e o que faz. Antes elas eram HTML solto dentro do template — e por isso não dava pra escolher
   quais mostrar sem duplicar a lista. */
function acoesDaFicha(n){
  return {
    // >>> O leitor de edital é do PILOTO: quem não tem permissão nem vê o botão. Esconder botão
    //     NÃO é a permissão — quem impede é a edge function, que confere o JWT no servidor e
    //     responde 403. Isto aqui só evita oferecer o que vai ser negado.
    edital:     { rot: '<svg class="ic" aria-hidden="true"><use href="#ic-documento"/></svg> Ler edital (IA)', fn: `lerEditalIA(${n.id})`, pode: podeLerEdital(),
                  dica: 'lê o PDF do edital com IA — cada leitura tem custo e fica registrada' },
    // O teto CMED é decidido na hora do preço, e a hora do preço é aqui: quem está com a ficha do
    // pregão aberto é quem vai cotar. O Conferidor já existe; isto é atalho, não segunda tela.
    cmed:       { rot: '<svg class="ic" aria-hidden="true"><use href="#ic-balanca"/></svg> Conferir preços (CMED)', fn: `location.href='fpmed_conferidor.html'`, pode: true,
                  dica: 'confere a proposta contra o teto legal da CMED' },
    // AÇÃO DA FASE HABILITAÇÃO: recurso, esclarecimento e contrarrazão são AS PEÇAS, que já
    // existem com a conta de dias úteis. Este botão é ATALHO COM CONTEXTO, não uma segunda tela:
    // ele leva os dados do certame e a tela de Peças faz o resto. Duplicar as Peças aqui criaria
    // o par que diverge — e o que diverge, nelas, é prazo legal.
    pecas:      { rot: '<svg class="ic" aria-hidden="true"><use href="#ic-balanca"/></svg> Recurso / esclarecimento', fn: `irParaPecas(${n.id})`, pode: true,
                  dica: 'abre as Peças jurídicas com os dados deste certame preenchidos' },
    documentos: { rot: '<svg class="ic" aria-hidden="true"><use href="#ic-documento"/></svg> Documentos', fn: `location.href='fpmed_documentos.html'`, pode: true,
                  dica: 'certidões e documentos de habilitação' },
    zap:        { rot: '<svg class="ic" aria-hidden="true"><use href="#ic-telefone"/></svg> Avisar no zap', fn: `avisarNoZap(${n.id})`, pode: !!n.abertura,
                  dica: 'abre o WhatsApp com a mensagem da sessão pronta' },
    ata:        { rot: '<svg class="ic" aria-hidden="true"><use href="#ic-trofeu"/></svg> Gerenciamento de Ata', fn: `abaFicha(document.querySelector('[data-aba=ata]'),'ata')`, pode: true,
                  dica: 'documentos da ata, itens ganhos e mapa de preços' },
    arquivar:   { rot: n.arquivado ? '↩ Devolver ao funil' : '<svg class="ic" aria-hidden="true"><use href="#ic-entrada"/></svg> Arquivar',
                  fn: n.arquivado ? `desarquivar(${n.id})` : `arquivar(${n.id})`, pode: true,
                  dica: n.arquivado ? 'devolve pro funil' : 'tira do funil, mantém no histórico' },
  };
}

function rodapeFicha(n){
  const A = acoesDaFicha(n);
  const foco = focoDa(n.estagio);
  // AS DA ETAPA vêm primeiro e visíveis; o resto vai pro menu. `arquivar` e `fechar` nunca entram
  // no menu: uma é destrutiva-ish e a outra é a saída — as duas têm que estar sempre à vista.
  const visiveis = foco.acoes.filter(k => A[k] && A[k].pode);
  const noMenu = Object.keys(A).filter(k => k !== 'arquivar' && !visiveis.includes(k) && A[k].pode);
  const bt = k => `<button onclick="${A[k].fn}" title="${esc(A[k].dica)}">${A[k].rot}</button>`;
  return `<div class="dw-acoes">
    ${visiveis.map(bt).join('')}
    ${noMenu.length ? `<div class="mais-cx">
      <button onclick="event.stopPropagation();this.parentNode.classList.toggle('on')" title="as outras ações continuam aqui">⋯ mais ações</button>
      <div class="mais-menu">${noMenu.map(k =>
        `<a onclick="${A[k].fn}" title="${esc(A[k].dica)}">${A[k].rot}</a>`).join('')}</div>
    </div>` : ''}
    ${bt('arquivar')}
    <button onclick="fecharDrawer()">Fechar</button>
  </div>`;
}

/* ══ O STEPPER DE ETAPAS ═════════════════════════════════════════════════════════════════════
   Pedido do cliente da FPMED, com as palavras dele: "a questão das etapas: minha etapa, segunda
   etapa, terceira etapa, finalizar o processo".

   O que havia era uma fileira de cinco botões IGUAIS, e o único sinal de onde o negócio estava
   era um deles ficar verde. Isso responde "qual é a fase?" mas não responde a pergunta que a
   pessoa faz de verdade ao abrir a ficha: **onde eu estou no processo, e quanto falta?**

   >>> AS TRÊS DIFERENÇAS QUE FAZEM O STEPPER FUNCIONAR, e nenhuma é enfeite:
       1. PASSADO x PRESENTE x FUTURO têm pesos visuais diferentes. Etapa vencida é ✓ e some do
          caminho; a atual é grande e colorida; as próximas são apagadas. Com cinco botões iguais,
          o olho tem que LER os cinco pra achar o verde.
       2. A LINHA CONECTA. É ela que transforma cinco caixinhas em um caminho — e caminho tem
          direção, que é o que "quanto falta" quer dizer.
       3. O NÚMERO ESTÁ ESCRITO: "etapa 3 de 5". Bolinha colorida é bonita e ambígua; "3 de 5" é
          uma frase que não precisa ser interpretada.

   >>> E CLICAR CONTINUA MOVENDO O NEGÓCIO, com a mesma `mudaFase` e o mesmo rastro. O stepper é
       uma roupa nova numa função que já funcionava — trocar as duas coisas ao mesmo tempo seria
       não saber qual delas quebrou. */
function stepper(n){
  const i = FASES.findIndex(f => f.k === n.estagio);
  const atual = i < 0 ? 0 : i;
  const passos = FASES.map((f, k) => {
    const st = k < atual ? 'feito' : k === atual ? 'agora' : 'futuro';
    const marca = k < atual ? '✓' : (k + 1);
    return `<button class="pas ${st}" onclick="mudaFase(${n.id},'${f.k}')"
        title="${k === atual ? 'está aqui' : 'mover para ' + esc(f.n)}">
      <span class="bola" style="${k <= atual ? 'background:' + f.c + ';border-color:' + f.c + ';color:var(--cinza-900)' : ''}">${marca}</span>
      <span class="nm">${esc(f.n)}</span>
    </button>`;
  }).join('');
  return `<div class="dw-sec dw-etapas">
    <h4>Etapa do processo</h4>
    <div class="passos-linha">${passos}</div>
    <div class="passos-legenda">
      <b style="color:${corFase(n.estagio)}">Etapa ${atual + 1} de ${FASES.length} · ${esc(nomeFase(n.estagio))}</b>
      ${atual + 1 < FASES.length
        ? ' · falta(m) ' + (FASES.length - atual - 1) + ' até ' + esc(FASES[FASES.length-1].n)
        : ' · última etapa'}
      <!-- O QUE FAZER AGORA — uma frase, e não uma lista de tarefas. Lista vira checklist, e o
           checklist fixo já saiu desta tela em 11/08 porque ninguém usava. Uma frase se lê. -->
      <div class="agora-faz"><svg class="ic" aria-hidden="true"><use href="#ic-seta"/></svg> ${esc(focoDa(n.estagio).faz)}</div>
      <span class="salvo" style="display:block;margin-top:6px">clique numa etapa para mover o negócio — fica no histórico</span>
    </div>
  </div>`;
}

/* O MINI-PROGRESSO DO CARD. Mesma informação, no tamanho que cabe: as bolinhas dão o relance e o
   texto dá a certeza. Sem o texto, ●●○○○ obriga a contar; sem as bolinhas, o card vira uma linha
   de texto a mais no meio de outras. */
function progressoCard(n){
  const i = FASES.findIndex(f => f.k === n.estagio);
  const atual = i < 0 ? 0 : i;
  const bolas = FASES.map((f, k) =>
    `<i style="background:${k <= atual ? f.c : 'transparent'};border-color:${k <= atual ? f.c : 'var(--linha)'}"></i>`).join('');
  return `<div class="cd-prog" title="etapa ${atual+1} de ${FASES.length}: ${esc(nomeFase(n.estagio))}">
    <span class="bolas">${bolas}</span>
    <span class="txt">etapa ${atual+1} de ${FASES.length} · <b style="color:${corFase(n.estagio)}">${esc(nomeFase(n.estagio))}</b></span>
  </div>`;
}

/* ══ EDITAL E ANEXOS ═════════════════════════════════════════════════════════════════════════
   Em qualquer negócio, e não só nos manuais. O índice do PNCP guarda o LINK do arquivo no site
   deles; ter o PDF aqui é outra coisa — é o documento na mão de quem vai disputar, que não
   depende do portal estar no ar no dia da sessão.

   >>> O CLIQUE ABRE. Foi o pedido, com o exemplo dele: edital 50 da BLL, Prefeitura de Palmas —
       clicou, abriu. Por link ASSINADO de 60 segundos, como todo anexo deste sistema: o bucket é
       privado, e link de edital que vale para sempre é link que vaza. */
let ANEXOS_EDITAL = [];
async function carregarEdital(id){
  const box = document.getElementById('ed-lista'); if(!box) return;
  try{
    const r = await fetch(`${SB_URL}/rest/v1/negocio_anexos?negocio_id=eq.${id}`
      + '&categoria=in.(edital,anexo_edital)&select=*&order=categoria.asc,versao.desc', {headers:SB_H});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    ANEXOS_EDITAL = await r.json();
    pintaEdital(id);
  }catch(e){
    ANEXOS_EDITAL = [];
    box.innerHTML = '<div class="salvo">não consegui ler os anexos ('+esc(e.message)+') — '
      + 'isto <b>não</b> quer dizer que não existam.</div>';
  }
}
const editalDoNegocio = () => ANEXOS_EDITAL.find(a => a.categoria === 'edital') || null;

function pintaEdital(id){
  const box = document.getElementById('ed-lista'); if(!box) return;
  if(!ANEXOS_EDITAL.length){
    box.innerHTML = '<div class="salvo">Nenhum edital anexado. Anexe aqui e ele fica junto do '
      + 'negócio — sem depender do portal estar no ar no dia da sessão.</div>';
    return;
  }
  const grupo = k => ANEXOS_EDITAL.filter(a => a.categoria === k);
  const bloco = (k, rot) => {
    const l = grupo(k); if(!l.length) return '';
    return `<div style="margin-bottom:10px">
      <div class="salvo" style="color:var(--azul-claro);font-weight:600">${rot} (${l.length})</div>
      ${l.map(a => `<div class="anx">
        <span class="v">v${a.versao}</span>
        <span class="n" onclick="abrirAnexo('${esc(a.arquivo_path)}')" title="abrir o arquivo">${esc(a.arquivo_nome)}</span>
        <span class="q">${esc(new Date(a.enviado_em).toLocaleDateString('pt-BR'))}${a.enviado_por?' · '+esc(String(a.enviado_por).split('@')[0]):''}${a.bytes?' · '+(a.bytes/1024).toFixed(0)+' KB':''}</span>
      </div>`).join('')}</div>`;
  };
  box.innerHTML = bloco('edital', 'Edital') + bloco('anexo_edital', 'Anexos do edital');
}

async function anexarEdital(id){
  const msg = document.getElementById('ed-msg'), bt = document.getElementById('ed-bt');
  const arqs = Array.from((document.getElementById('ed-arq') || {}).files || []);
  const cat = document.getElementById('ed-cat').value;
  if(!arqs.length){ msg.textContent = 'escolha o arquivo.'; return; }
  bt.disabled = true;
  const falhou = [];
  for(let i = 0; i < arqs.length; i++){
    msg.textContent = 'subindo ' + (i+1) + ' de ' + arqs.length + '…';
    const r = await subirAnexo(id, arqs[i], cat);
    if(!r.ok) falhou.push({ nome: arqs[i].name, motivo: r.erro });
  }
  document.getElementById('ed-arq').value = '';
  // O QUE SUBIU, SUBIU. Mesmo com uma falha no meio, os anteriores ficaram — dizer só "não deu
  // certo" faria a pessoa mandar tudo de novo e criar versões duplicadas do que já estava lá.
  msg.innerHTML = falhou.length
    ? '<b style="color:var(--vermelho-700)">' + falhou.length + ' de ' + arqs.length + ' não subiram:</b><br>'
      + falhou.map(x => '· ' + esc(x.nome) + ' — ' + esc(x.motivo)).join('<br>')
      + (falhou.length < arqs.length ? '<br>Os outros ' + (arqs.length - falhou.length) + ' estão na lista acima.' : '')
    : arqs.length + ' arquivo(s) anexado(s).';
  await carregarEdital(id);
  bt.disabled = false;
}

/* ══ GERENCIAMENTO DE ATA ═════════════════════════════════════════════════════════════════════
   A fase final: os documentos assinados, o que se ganhou, e por quanto se perdeu.

   >>> AS DUAS LEITURAS DE IA ENTRAM NA `ler-edital`, e não numa função nova. Ela já tem a
       permissão do piloto conferida no servidor, o contador de custo, o teto por tarefa e o
       bloqueio de leitura cortada. Função nova seria uma segunda permissão e um segundo contador
       para a mesma cobrança — e o dia em que uma das duas ficasse pra trás seria um dia em que
       alguém lê de graça, ou lê sem poder.
   >>> E A IA NUNCA ESCREVE SOZINHA NO `valor_ganho`. Ele alimenta a taxa de vitória, que é o
       número que a empresa usa pra decidir onde disputar. O relatório SUGERE; confirmar é um
       clique de gente, e o rastro guarda que veio de leitura. */
const ATA_CATS = [
  { k:'ata',            n:'Ata de registro de preços' },
  { k:'contrato',       n:'Contrato' },
  { k:'proposta_final', n:'Proposta final' },
  { k:'ata_sessao',     n:'Ata da sessão' },
  { k:'itens_ganhos',   n:'Itens ganhos' },
  { k:'retorno_precos', n:'Retorno de preços' },
];
const nomeCat = k => (ATA_CATS.find(c => c.k === k) || {}).n || k;
let ANEXOS_ATA = [], RELATORIO_ATA = null;

async function carregarAta(id){
  const box = document.getElementById('ata-lista'); if(!box) return;
  try{
    const cats = ATA_CATS.map(c => c.k).join(',');
    const r = await fetch(`${SB_URL}/rest/v1/negocio_anexos?negocio_id=eq.${id}`
      + `&categoria=in.(${cats})&select=*&order=categoria.asc,versao.desc`, {headers:SB_H});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    ANEXOS_ATA = await r.json();
    pintaAta(id);
  }catch(e){
    ANEXOS_ATA = [];
    box.innerHTML = '<div class="salvo">não consegui ler os documentos ('+esc(e.message)+') — '
      + 'isto <b>não</b> quer dizer que não existam.</div>';
  }
}

function pintaAta(id){
  const box = document.getElementById('ata-lista'); if(!box) return;
  const cnt = document.getElementById('dw-ata-n');
  if(cnt) cnt.textContent = ANEXOS_ATA.length ? ANEXOS_ATA.length : '';

  // AGRUPADO POR TIPO, como pedido. Categoria vazia NÃO aparece: seis cabeçalhos com "nenhum"
  // embaixo empurram pra baixo os dois que existem, e a lista deixa de ser lida.
  const porCat = {};
  for(const a of ANEXOS_ATA) (porCat[a.categoria] ||= []).push(a);
  const cheias = ATA_CATS.filter(c => porCat[c.k]);
  box.innerHTML = cheias.length
    ? cheias.map(c => `<div style="margin-bottom:10px">
        <div class="salvo" style="color:var(--azul-claro);font-weight:600">${esc(c.n)} (${porCat[c.k].length})</div>
        ${porCat[c.k].map(a => `<div class="anx">
          <span class="v">v${a.versao}</span>
          <span class="n" onclick="abrirAnexo('${esc(a.arquivo_path)}')" title="abrir">${esc(a.arquivo_nome)}</span>
          <span class="q">${esc(new Date(a.enviado_em).toLocaleDateString('pt-BR'))}${a.enviado_por?' · '+esc(String(a.enviado_por).split('@')[0]):''}</span>
        </div>`).join('')}
      </div>`).join('')
    : '<div class="salvo">Nenhum documento anexado ainda.</div>';

  pintaBotoesAta(id, porCat);
}

/* OS BOTÕES DOS RELATÓRIOS SÓ APARECEM QUANDO HÁ O DOCUMENTO QUE ELES LEEM. Um botão "ler itens
   ganhos" sem nenhum documento de resultado anexado só pode fazer uma coisa: gastar uma leitura
   pra dizer "não achei". E ele é do piloto — quem não tem permissão não vê nada disso. */
function pintaBotoesAta(id, porCat){
  const box = document.getElementById('ata-relatorios'); if(!box) return;
  if(!podeLerEdital()){
    box.innerHTML = '<div class="salvo">Os relatórios com IA estão em piloto, liberados só para o '
      + 'gestor de licitação — cada leitura tem custo e é cobrada.</div>';
    return;
  }

    + '<div class="dica" style="font-size:11.5px;color:var(--muted);margin-bottom:8px">'

    +   'bloqueada — nunca entregue pela metade.</div>'

    + (temGanhos
        ? `<button class="btn-ed" onclick="lerAtaIA(${id},'itens-ganhos')"><svg class="ic" aria-hidden="true"><use href="#ic-trofeu"/></svg> O que eu ganhei</button>`
        : '<span class="salvo">Anexe <b>Itens ganhos</b> ou <b>Ata da sessão</b> para ler o que foi ganho.</span>')
    + (temMapa
        ? `<button class="btn-ed sec" onclick="lerAtaIA(${id},'mapa-precos')"><svg class="ic" aria-hidden="true"><use href="#ic-queda"/></svg> Mapa de preços da disputa</button>`
        : '<span class="salvo">Anexe <b>Ata da sessão</b> ou <b>Retorno de preços</b> para montar o mapa.</span>')
    + '</div>';
}

/* ══ O QUADRO DO RESULTADO — "clicou no processo ganho, já tá lá o que ganhou" ═══════════════
   Este é o quadro que o Lemuel descreveu. Ele lê do BANCO (a confirmação mais nova), e não de
   documento nenhum: quem confirmou uma vez não paga leitura de novo pra ver o que ganhou.

   >>> O NEGÓCIO ANTIGO DO CALENDÁRIO NÃO FICA COM TABELA VAZIA. Ele tem valor e não tem itens —
       isso é o normal de quem foi importado, não uma falta. Tabela vazia com cabeçalho pareceria
       um erro de carregamento e faria alguém procurar um defeito que não existe. Em vez disso, o
       quadro diz o que ele é: resultado importado do histórico, sem detalhe por item.
   >>> E QUANDO OS DOIS NÚMEROS DIVERGEM, A TELA MOSTRA A DIFERENÇA. Escondê-la seria escolher em
       qual dos dois acreditar — e essa escolha é de quem confere, não da tela. */
let ITENS_GANHOS = [];
async function carregarItensGanhos(id){
  const box = document.getElementById('ata-resultado'); if(!box) return;
  const n = NEG.find(x => x.id === id) || {};
  const ganhou = Number(n.valor_ganho) > 0;
  if(!ganhou){ box.innerHTML = ''; ITENS_GANHOS = []; return; }
  try{
    const r = await fetch(`${SB_URL}/rest/v1/v_negocio_itens_ganhos?negocio_id=eq.${id}`
      + '&select=*&order=item_n.asc', {headers:SB_H});
    ITENS_GANHOS = r.ok ? await r.json() : [];
    pintaItensGanhos(id);
  }catch(e){
    // "não sei" e "não tem" outra vez: um erro de leitura mostrando "sem detalhe por item"
    // faria alguém concluir que o resultado nunca foi confirmado — e confirmar de novo.
    box.innerHTML = '<h4>Resultado</h4><div class="salvo">não consegui ler os itens ('+esc(e.message)+') — '
      + 'isto <b>não</b> quer dizer que não existam.</div>';
  }
}

function pintaItensGanhos(id){
  const box = document.getElementById('ata-resultado'); if(!box) return;
  const n = NEG.find(x => x.id === id) || {};
  const cnt = document.getElementById('dw-ata-n');
  const num = v => { const x = Number(v); return isFinite(x) && v != null ? x : null; };

  if(!ITENS_GANHOS.length){
    box.innerHTML = '<h4>Resultado</h4>'
      + '<div class="pk-conta" style="border-color:rgba(124,197,118,.45)">'
      +   '<b style="color:var(--verde)">Ganho · ' + brl(n.valor_ganho) + '</b>'
      +   '<div class="salvo" style="margin-top:6px">Resultado <b>importado do histórico</b> — '
      +   'sem detalhe por item. Os negócios do Calendário guardam o valor total, e não a relação '
      +   'de itens; para ter o detalhe, anexe o documento de resultado e use o relatório abaixo.</div>'
      + '</div>';
    return;
  }
  const soma = ITENS_GANHOS.reduce((s,x) => s + (num(x.total) || 0), 0);
  const dif = Number(n.valor_ganho||0) - soma;
  const semMarca = ITENS_GANHOS.filter(x => !x.marca).length;
  const quando = ITENS_GANHOS[0] ? new Date(ITENS_GANHOS[0].confirmado_em) : null;
  if(cnt) cnt.textContent = ITENS_GANHOS.length;

  box.innerHTML = '<h4>Resultado</h4>'
    + '<div class="pk-conta" style="border-color:rgba(124,197,118,.45)">'
    +   '<b style="color:var(--verde)">Ganhou ' + ITENS_GANHOS.length + ' item(ns) · ' + brl(soma) + '</b>'
    +   '<div class="salvo" style="margin-top:6px">'
    +     'confirmado' + (quando ? ' em ' + esc(quando.toLocaleDateString('pt-BR')) : '')
    +     (ITENS_GANHOS[0] && ITENS_GANHOS[0].confirmado_por ? ' por ' + esc(String(ITENS_GANHOS[0].confirmado_por).split('@')[0]) : '')
    +     (ITENS_GANHOS[0] && ITENS_GANHOS[0].confirmacao > 1 ? ' · <b>' + ITENS_GANHOS[0].confirmacao + 'ª confirmação</b> (as anteriores ficam no rastro)' : '')
    +   '</div>'
    // A DIFERENÇA, quando existe, aparece aqui — no lugar onde os dois números estão juntos.
    +   (Math.abs(dif) >= 0.01
        ? '<div class="salvo" style="margin-top:6px;color:var(--ambar-700)"><b><svg class="ic" aria-hidden="true"><use href="#ic-alerta"/></svg> Conferir:</b> valor da ficha '
          + brl(n.valor_ganho) + ' · soma dos itens ' + brl(soma) + ' — diferença de ' + brl(Math.abs(dif)) + '.</div>'
        : '')
    + '</div>'
    + '<div style="max-height:300px;overflow:auto"><table class="pk-tab">'
    + '<thead><tr>' + ['Nº','ITEM','MARCA','QTD','UNIT.','TOTAL'].map(h => '<th>'+h+'</th>').join('') + '</tr></thead><tbody>'
    + ITENS_GANHOS.map(x => `<tr style="cursor:default">
        <td>${esc(x.item_n || '—')}</td>
        <td>${esc(String(x.descricao||'').slice(0,64))}</td>
        <td>${x.marca ? esc(x.marca) + (x.marca_origem === 'estoque' ? ' <span class="salvo">(do estoque)</span>' : '')
                      : '<span class="salvo">sem marca no documento</span>'}</td>
        <td style="text-align:right">${num(x.quantidade) != null ? Number(x.quantidade).toLocaleString('pt-BR') : '—'}</td>
        <td style="text-align:right">${brl(num(x.valor_unitario))}</td>
        <td style="text-align:right"><b>${brl(num(x.total))}</b></td>
      </tr>`).join('')
    + '</tbody><tfoot><tr><td colspan="5" style="text-align:right"><b>total</b></td>'
    +   '<td style="text-align:right"><b>' + brl(soma) + '</b></td></tr></tfoot></table></div>'
    + (semMarca ? '<div class="salvo" style="margin-top:6px">' + semMarca + ' item(ns) sem marca: o documento '
        + 'não trouxe. <b>Marca em branco é marca não sabida</b> — nunca preenchida por dedução.</div>' : '');
}

async function anexarAta(id){
  const msg = document.getElementById('ata-msg'), bt = document.getElementById('ata-bt');
  const arq = (document.getElementById('ata-arq').files || [])[0];
  const cat = document.getElementById('ata-cat').value;
  if(!arq){ msg.textContent = 'escolha o arquivo.'; return; }
  bt.disabled = true; msg.textContent = 'enviando…';
  try{
    const limpo = arq.name.normalize('NFD').replace(/\p{M}/gu,'').toLowerCase().replace(/[^a-z0-9._-]+/g,'-');
    const path = 'negocio-' + id + '/' + cat + '/' + Date.now() + '-' + limpo;
    const up = await fetch(`${SB_URL}/storage/v1/object/documentos/${encodeURIComponent(path)}`, {
      method:'POST', headers: Object.assign({}, SB_H), body: arq });
    if(!up.ok) throw new Error(up.status===403 ? 'só gestor pode enviar arquivo' : ('não consegui enviar (HTTP '+up.status+')'));
    const r = await fetch(`${SB_URL}/rest/v1/negocio_anexos`, {method:'POST',
      headers: Object.assign({'Prefer':'return=representation'}, SB_H, {'Content-Type':'application/json'}),
      body: JSON.stringify({ negocio_id: id, categoria: cat, arquivo_path: path,
        arquivo_nome: arq.name, bytes: arq.size,
        enviado_por: (window.gmAuth && gmAuth.user && gmAuth.user.email) || null })});
    if(!r.ok) throw new Error('o arquivo subiu, mas não consegui registrar (HTTP ' + r.status + ')');
    const nova = (await r.json())[0];
    document.getElementById('ata-arq').value = '';
    msg.textContent = nomeCat(cat) + ' anexado como v' + (nova ? nova.versao : '?') + '.';
    await carregarAta(id);
  }catch(e){ msg.textContent = 'não consegui anexar: ' + e.message; }
  bt.disabled = false;
}

/* ── AS DUAS LEITURAS ────────────────────────────────────────────────────────────────────────
   O documento que cada uma lê é escolhido por CATEGORIA, e não por "o mais recente": ler a
   proposta final quando se pediu o mapa de preços gastaria uma leitura pra devolver nada. */
async function lerAtaIA(id, tarefa){
  const saida = document.getElementById('ata-saida');
  const prefs = tarefa === 'itens-ganhos' ? ['itens_ganhos','ata_sessao'] : ['ata_sessao','retorno_precos'];
  let anexo = null;
  for(const c of prefs){ anexo = ANEXOS_ATA.find(a => a.categoria === c); if(anexo) break; }
  if(!anexo){ saida.innerHTML = '<div class="salvo">anexe o documento primeiro.</div>'; return; }

  saida.innerHTML = '<div class="salvo">baixando o documento…</div>';
  try{
    const rs = await fetch(`${SB_URL}/storage/v1/object/sign/documentos/${encodeURIComponent(anexo.arquivo_path)}`, {
      method:'POST', headers: Object.assign({'Content-Type':'application/json'}, SB_H),
      body: JSON.stringify({ expiresIn: 120 }) });
    if(!rs.ok) throw new Error('não consegui abrir o anexo (HTTP ' + rs.status + ')');
    const buf = await (await fetch(SB_URL + '/storage/v1' + (await rs.json()).signedURL)).arrayBuffer();

    saida.innerHTML = '<div class="salvo">lendo o PDF…</div>';
    const texto = await pdfParaTextoNeg(buf);
    if(texto.trim().length < 500) throw new Error('a extração de texto veio pobre — este PDF parece escaneado. '
      + 'O caminho de imagem existe no leitor de edital; aqui ele ainda não foi ligado.');

    saida.innerHTML = '<div class="salvo">lendo com IA (isto custa e fica registrado)…</div>';
    const tok = tokenSessaoNeg();
    if(!tok) throw new Error('sua sessão expirou — entre de novo');
    const r = await fetch(`${SB_URL}/functions/v1/ler-edital`, {method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer ' + tok},
      body: JSON.stringify({ tarefa, modo:'texto', texto, titulo: anexo.arquivo_nome,
        chars: texto.length, cambio: await cambioNeg() }),
      signal: AbortSignal.timeout(600000)});
    const txt = await r.text();
    if(r.status === 403) throw new Error('os relatórios com IA estão em piloto, liberados só para o gestor de licitação.');
    if(!r.ok) throw new Error('o serviço de leitura respondeu ' + r.status);
    const j = JSON.parse(txt);
    // ERRO COM CUSTO JUNTO, como em toda leitura paga deste sistema.
    if(j.ok === false) throw new Error((j.erro || 'a leitura não deu certo')
      + (j.usd ? ' · esta tentativa já custou ' + (j.brl != null ? 'R$ '+Number(j.brl).toFixed(2) : 'US$ '+Number(j.usd).toFixed(4)) + '.' : ''));
    if(!j.dados) throw new Error('a leitura voltou fora do formato esperado — não vou adivinhar o que ela quis dizer.');

    RELATORIO_ATA = { tarefa, anexo, dados: j.dados, custo: j, negocio: id };
    if(tarefa === 'itens-ganhos') pintaGanhos(id); else pintaMapa(id);
  }catch(e){ saida.innerHTML = '<div class="aviso-err salvo" style="color:var(--vermelho-700)"><svg class="ic" aria-hidden="true"><use href="#ic-alerta"/></svg> ' + esc(e.message) + '</div>'; }
}

function tokenSessaoNeg(){
  try{
    for(const k of Object.keys(localStorage)){
      if(!/gm.?auth|sess/i.test(k)) continue;
      const v = JSON.parse(localStorage.getItem(k) || '{}');
      if(v && v.access_token) return v.access_token;
    }
  }catch(e){}
  return null;
}
async function cambioNeg(){
  try{
    const r = await fetch('https://economia.awesomeapi.com.br/last/USD-BRL', {signal: AbortSignal.timeout(6000)});
    const v = parseFloat((await r.json()).USDBRL.bid);
    return isFinite(v) && v > 0 ? v : null;
  }catch(e){ return null; }
}
function custoDaLeitura(j){
  return '<div class="salvo" style="margin-top:10px">'
    + 'custo desta leitura: <b>' + (j.brl != null ? 'R$ ' + Number(j.brl).toFixed(2) : 'US$ ' + Number(j.usd||0).toFixed(4)) + '</b>'
    + (j.registrado === false
        ? ' · <b style="color:var(--vermelho-700)"><svg class="ic" aria-hidden="true"><use href="#ic-alerta"/></svg> NÃO entrou no contador</b>' + (j.regErro ? ' (' + esc(j.regErro) + ')' : '')
        : (j.leituraId ? ' · registrada com o nº ' + j.leituraId : ''))
    + '</div>';
}

/* ── O QUE EU GANHEI ─────────────────────────────────────────────────────────────────────────
   O total daqui vira SUGESTÃO para `valor_ganho`. Nunca escrita automática: esse campo alimenta
   a taxa de vitória, e um número que a IA pôs sozinha contaminaria a estatística que a empresa
   usa pra decidir onde disputar — sem ninguém lembrar de onde ele veio. */
function pintaGanhos(id){
  const saida = document.getElementById('ata-saida');
  const d = RELATORIO_ATA.dados, g = Array.isArray(d.ganhos) ? d.ganhos : [];
  if(d.encontrado === false || (!g.length && !(d.perdidos||[]).length)){
    saida.innerHTML = '<div class="aviso-err salvo" style="color:var(--ambar-700)">Não achei resultado neste documento. '
      + '<b>Isto não quer dizer que a empresa não ganhou nada</b> — quer dizer que não foi encontrado aqui.'
      + (d.observacao ? '<br>O que a leitura disse: <i>' + esc(d.observacao) + '</i>' : '') + '</div>'
      + custoDaLeitura(RELATORIO_ATA.custo);
    return;
  }
  const num = v => { const n = Number(v); return isFinite(n) && v != null && v !== '' ? n : null; };
  const comTotal = g.filter(x => num(x.total) != null || (num(x.quantidade) != null && num(x.valor_unitario) != null));
  const total = comTotal.reduce((s,x) => s + (num(x.total) != null ? num(x.total) : num(x.quantidade)*num(x.valor_unitario)), 0);
  const y = num(d.itens_no_documento);

  saida.innerHTML =
      '<div class="aviso-err salvo" style="color:var(--ambar-700);margin-bottom:8px"><svg class="ic" aria-hidden="true"><use href="#ic-alerta"/></svg> <b>Confira contra o documento antes de usar.</b> '
    +   'Isto foi lido por IA. O número que importa conferir é simples: o documento tem quantos itens?</div>'
    + '<h4>O que ganhamos</h4>'
    + '<div class="salvo" style="margin-bottom:8px">'
    +   '<b>' + g.length + (y ? ' de ' + y : '') + ' item(ns)</b>'
    +   (comTotal.length ? ' · total <b>' + brl(total) + '</b>'
          + (comTotal.length < g.length ? ' <span style="color:var(--ambar-700)">(' + (g.length-comTotal.length) + ' sem valor legível ficaram de fora da soma)</span>' : '')
        : ' · nenhum item trouxe valor — não há total a somar')
    +   (d.empresa ? '<br>lido como: ' + esc(d.empresa) : '')
    + '</div>'
    + (g.length ? '<div style="max-height:280px;overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">'
        + '<thead><tr><th style="text-align:left;padding:5px;color:var(--muted);font-size:10.5px;border-bottom:1px solid var(--linha)">Nº</th>'
        + '<th style="text-align:left;padding:5px;color:var(--muted);font-size:10.5px;border-bottom:1px solid var(--linha)">ITEM</th>'
        + '<th style="text-align:right;padding:5px;color:var(--muted);font-size:10.5px;border-bottom:1px solid var(--linha)">QTD</th>'
        + '<th style="text-align:right;padding:5px;color:var(--muted);font-size:10.5px;border-bottom:1px solid var(--linha)">UNIT.</th>'
        + '<th style="text-align:right;padding:5px;color:var(--muted);font-size:10.5px;border-bottom:1px solid var(--linha)">TOTAL</th></tr></thead><tbody>'
        + g.map(x => `<tr>
            <td style="padding:5px;border-bottom:1px solid rgba(34,55,79,.4)">${esc(x.n)}</td>
            <td style="padding:5px;border-bottom:1px solid rgba(34,55,79,.4)">${esc(String(x.descricao||'').slice(0,70))}</td>
            <td style="padding:5px;text-align:right;border-bottom:1px solid rgba(34,55,79,.4)">${num(x.quantidade)!=null?Number(x.quantidade).toLocaleString('pt-BR'):'—'}</td>
            <td style="padding:5px;text-align:right;border-bottom:1px solid rgba(34,55,79,.4)">${brl(num(x.valor_unitario))}</td>
            <td style="padding:5px;text-align:right;border-bottom:1px solid rgba(34,55,79,.4)">${brl(num(x.total)!=null?num(x.total):(num(x.quantidade)!=null&&num(x.valor_unitario)!=null?num(x.quantidade)*num(x.valor_unitario):null))}</td>
          </tr>`).join('') + '</tbody></table></div>' : '')
    + ((d.nao_consegui_ler||[]).length
        ? '<div class="salvo" style="margin-top:8px;color:var(--ambar-700)"><b>O que a leitura NÃO conseguiu ler ('+d.nao_consegui_ler.length+'):</b><br>'
          + d.nao_consegui_ler.map(esc).join('<br>') + '</div>' : '')
    // ── A SUGESTÃO, COM CONFIRMAÇÃO DE GENTE ──────────────────────────────────────────────
    + (comTotal.length && ehGestor()
        ? `<div class="aviso-err salvo" style="margin-top:12px;padding:10px 12px;border:1px solid rgba(124,197,118,.5);border-radius:9px">
            <b>Sugestão para o valor ganho: ${brl(total)}</b>
            <div style="margin:6px 0;color:var(--muted);font-size:11.5px">
              Este número <b>não foi gravado</b>. Ele alimenta a taxa de vitória, e a IA não escreve
              sozinha num campo que a empresa usa pra decidir onde disputar. Confira a tabela acima
              e confirme — a confirmação fica no histórico com a marca de que veio de leitura.
            </div>
            <button class="btn-ed" onclick="confirmarValorGanho(${id}, ${total.toFixed(2)})">✓ Confirmar ${brl(total)} e gravar os ${g.length} itens</button>
          </div>`
        : (comTotal.length ? '<div class="salvo" style="margin-top:10px">O valor ganho é campo de gestor.</div>' : ''))
    + custoDaLeitura(RELATORIO_ATA.custo);
}

async function confirmarValorGanho(id, valor){
  const n = NEG.find(x => x.id === id); if(!n) return;
  const saida = document.getElementById('ata-saida');
  const antes = n.valor_ganho;
  const itensIA = (RELATORIO_ATA && RELATORIO_ATA.dados && Array.isArray(RELATORIO_ATA.dados.ganhos))
    ? RELATORIO_ATA.dados.ganhos : [];
  if(!confirm('Gravar ' + brl(valor) + ' como valor ganho deste negócio'
    + (itensIA.length ? ' e os ' + itensIA.length + ' itens do resultado' : '') + '?'
    + (antes ? '\n\nO valor atual é ' + brl(antes) + ' e será substituído.' : '')
    + '\n\nEste número alimenta a taxa de vitória.')) return;
  try{
    // >>> O RASTRO DIZ DE ONDE VEIO. `gravar` já registra a alteração; o que se acrescenta aqui é
    //     a anotação de que o número nasceu de uma leitura por IA e foi CONFIRMADO por alguém.
    //     Daqui a seis meses, "por que este negócio vale R$ 84 mil?" tem resposta.
    await gravar(id, { valor_ganho: valor });
    n.valor_ganho = valor;
    await fetch(`${SB_URL}/rest/v1/negocio_alteracoes`, {method:'POST',
      headers: Object.assign({}, SB_H, {'Content-Type':'application/json'}),
      body: JSON.stringify({ negocio_id: id, campo: 'valor_ganho',
        de: antes == null ? null : String(antes), para: String(valor),
        quem: (window.gmAuth && gmAuth.user && gmAuth.user.email) || null,
        nota: 'confirmado a partir do relatório de itens ganhos lido por IA ('
              + (RELATORIO_ATA && RELATORIO_ATA.anexo ? RELATORIO_ATA.anexo.arquivo_nome : 'documento') + ')' })
    }).catch(()=>{});
    /* ── E OS ITENS VÃO JUNTO ────────────────────────────────────────────────────────────────
       O relatório deixou de ser papel: o que foi confirmado fica no banco, ligado ao negócio.
       Assim "o que a gente ganhou naquele pregão?" tem resposta sem reabrir documento nenhum —
       e sem pagar outra leitura de IA pela mesma informação.
       >>> A MARCA NUNCA É INVENTADA. Vem da ata quando o documento trouxer (`marca_origem:'ata'`)
           e fica VAZIA quando não trouxer. O casamento com o estoque é o terceiro caminho e ainda
           não foi ligado aqui — enquanto não estiver, vazio é vazio, e a tela põe etiqueta.
       >>> GRAVAR OS ITENS FALHAR NÃO DESFAZ O VALOR. São duas gravações e a primeira já valeu;
           dizer "não deu certo" faria a pessoa confirmar de novo e criar uma segunda confirmação
           de um valor que já estava lá. */
    let msgItens = '';
    if(itensIA.length){
      const num = v => { const x = Number(v); return isFinite(x) && v != null && v !== '' ? x : null; };
      const linhas = itensIA.map(x => ({
        negocio_id: id,
        item_n: x.n == null ? null : String(x.n).slice(0,40),
        descricao: String(x.descricao || '').slice(0, 600) || '(sem descrição no documento)',
        marca: x.marca ? String(x.marca).slice(0,120) : null,
        marca_origem: x.marca ? 'ata' : null,
        quantidade: num(x.quantidade),
        valor_unitario: num(x.valor_unitario),
        total: num(x.total) != null ? num(x.total)
             : (num(x.quantidade) != null && num(x.valor_unitario) != null ? num(x.quantidade) * num(x.valor_unitario) : null),
        origem: 'ia',
        confirmado_por: (window.gmAuth && gmAuth.user && gmAuth.user.email) || null,
      }));
      try{
        const ri = await fetch(`${SB_URL}/rest/v1/negocio_itens_ganhos`, {method:'POST',
          headers: Object.assign({}, SB_H, {'Content-Type':'application/json'}), body: JSON.stringify(linhas)});
        msgItens = ri.ok
          ? ' · ' + linhas.length + ' item(ns) gravados'
          : ' · <b style="color:var(--vermelho-700)">os itens NÃO foram gravados (HTTP ' + ri.status + ')</b> — o valor sim';
      }catch(e){ msgItens = ' · <b style="color:var(--vermelho-700)">os itens não foram gravados: ' + esc(e.message) + '</b>'; }
    }
    saida.innerHTML += '<div class="salvo ok" style="margin-top:8px">✓ valor ganho gravado como ' + brl(valor)
      + msgItens + ' — a confirmação está no histórico.</div>';
    carregarRastro(id); carregarItensGanhos(id); pinta();
  }catch(e){ saida.innerHTML += '<div class="salvo erro" style="margin-top:8px">não consegui gravar: ' + esc(e.message) + '</div>'; }
}

/* ── O MAPA DE PREÇOS DA DISPUTA ─────────────────────────────────────────────────────────────
   A inteligência comercial da derrota. A DIFERENÇA (R$ e %) é calculada AQUI, com aritmética —
   o prompt manda a IA copiar os valores e proíbe que ela calcule. Modelo de linguagem errando
   uma subtração é um jeito silencioso de a análise inteira ficar errada, e essa conta é barata
   demais pra terceirizar. */
function pintaMapa(id){
  const saida = document.getElementById('ata-saida');
  const d = RELATORIO_ATA.dados, itens = Array.isArray(d.itens) ? d.itens : [];
  if(d.encontrado === false || !itens.length){
    saida.innerHTML = '<div class="aviso-err salvo" style="color:var(--ambar-700)">Não achei um mapa de preços neste documento. '
      + '<b>Isto não quer dizer que não houve disputa</b> — quer dizer que não foi encontrado aqui.'
      + (d.observacao ? '<br>' + esc(d.observacao) : '') + '</div>' + custoDaLeitura(RELATORIO_ATA.custo);
    return;
  }
  const num = v => { const n = Number(v); return isFinite(n) && v != null && v !== '' ? n : null; };
  const linhas = itens.map(x => {
    const nosso = num(x.nosso_preco), venc = num(x.preco_vencedor);
    // A diferença só existe quando os DOIS números existem. Meio dado vira "—", e não zero.
    const difRS = (nosso != null && venc != null) ? +(nosso - venc).toFixed(4) : null;
    const difPct = (difRS != null && venc > 0) ? +((difRS / venc) * 100).toFixed(2) : null;
    return Object.assign({}, x, { _nosso: nosso, _venc: venc, difRS, difPct });
  });
  const perdidos = linhas.filter(l => l.nossa_situacao === 'perdedor' && l.difRS != null);
  const ganhos = linhas.filter(l => l.nossa_situacao === 'vencedor');
  // "Perdemos por pouco" é a informação que faz mudar a estratégia da próxima. A mediana diria
  // menos: o que interessa é ver a lista, e o pior e o melhor caso dela.
  const perto = perdidos.filter(l => l.difPct != null && l.difPct <= 5).length;

  saida.innerHTML =
      '<div class="aviso-err salvo" style="color:var(--ambar-700);margin-bottom:8px"><svg class="ic" aria-hidden="true"><use href="#ic-alerta"/></svg> <b>Confira contra a ata antes de usar.</b> '
    +   'Isto foi lido por IA. As diferenças em R$ e % foram calculadas aqui, com aritmética — a IA só copiou os valores.</div>'
    + '<h4>Mapa de preços da disputa</h4>'
    + '<div class="salvo" style="margin-bottom:8px">'
    +   itens.length + ' item(ns) no mapa · <b style="color:var(--verde)">' + ganhos.length + ' ganhos</b>'
    +   ' · <b style="color:var(--vermelho-700)">' + perdidos.length + ' perdidos</b>'
    +   (perto ? ' · <b style="color:var(--ambar-700)">' + perto + ' perdidos por 5% ou menos</b>' : '')
    +   (d.nossa_empresa ? '<br>lido como: ' + esc(d.nossa_empresa) : '')
    + '</div>'
    + '<div style="max-height:320px;overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">'
    + '<thead><tr>'
    +   ['Nº','ITEM','NOSSO','VENCEDOR','PREÇO DELE','DIFERENÇA'].map(h =>
          '<th style="text-align:left;padding:5px;color:var(--muted);font-size:10.5px;border-bottom:1px solid var(--linha)">'+h+'</th>').join('')
    + '</tr></thead><tbody>'
    + linhas.map(l => `<tr>
        <td style="padding:5px;border-bottom:1px solid rgba(34,55,79,.4)">${esc(l.n)}</td>
        <td style="padding:5px;border-bottom:1px solid rgba(34,55,79,.4)">${esc(String(l.descricao||'').slice(0,52))}</td>
        <td style="padding:5px;text-align:right;border-bottom:1px solid rgba(34,55,79,.4)">${brl(l._nosso)}</td>
        <td style="padding:5px;border-bottom:1px solid rgba(34,55,79,.4)">${esc(String(l.vencedor||'—').slice(0,26))}</td>
        <td style="padding:5px;text-align:right;border-bottom:1px solid rgba(34,55,79,.4)">${brl(l._venc)}</td>
        <td style="padding:5px;text-align:right;border-bottom:1px solid rgba(34,55,79,.4);color:${l.difRS>0?'var(--vermelho-700)':l.difRS<0?'var(--verde)':'var(--muted)'}">
          ${l.difRS==null?'—':(l.difRS>0?'+':'') + brl(l.difRS) + (l.difPct!=null?' ('+(l.difPct>0?'+':'')+l.difPct+'%)':'')}</td>
      </tr>`).join('')
    + '</tbody></table></div>'
    + ((d.nao_consegui_ler||[]).length
        ? '<div class="salvo" style="margin-top:8px;color:var(--ambar-700)"><b>Não consegui ler ('+d.nao_consegui_ler.length+'):</b> '
          + d.nao_consegui_ler.map(esc).join(' · ') + '</div>' : '')
    + `<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn-ed sec" onclick="imprimirMapa(${id})"><svg class="ic" aria-hidden="true"><use href="#ic-impressora"/></svg> Relatório (imprimir/PDF)</button>
        <button class="btn-ed sec" onclick="excelMapa()"><svg class="ic" aria-hidden="true"><use href="#ic-baixar"/></svg> Baixar Excel</button>
      </div>`
    + custoDaLeitura(RELATORIO_ATA.custo);
  RELATORIO_ATA.linhas = linhas;
}

  const j = window.open('', '_blank');
  if(!j){ alert('o navegador bloqueou a janela — libere o pop-up'); return; }
  j.document.write('<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">'
    + '<title>Mapa de preços — ' + esc(n.numero || n.orgao || 'negócio') + '</title>'
    + '<style>body{font:12px/1.55 system-ui,sans-serif;max-width:960px;margin:26px auto;padding:0 20px;color:#111}'

    + '.rodape{margin-top:24px;padding-top:12px;border-top:1px solid #ddd;font-size:11px;color:#555}'
    + '.acao{margin:16px 0} button{font:inherit;padding:7px 14px;border-radius:7px;border:1px solid #ccc;background:#f5f5f5;cursor:pointer}'
    + '@media print{.acao{display:none}}</style></head><body>'
    + '<h1>Mapa de preços da disputa</h1>'
    + '<div>' + esc(emp.razaoSocial || emp.nome || '') + '</div>'
    + '<div style="color:#555;margin-top:6px">' + (n.orgao ? esc(n.orgao) + ' · ' : '') + (n.numero ? 'nº ' + esc(n.numero) : '')
    +   '<br>documento: ' + esc(RELATORIO_ATA.anexo.arquivo_nome) + ' · gerado em ' + new Date().toLocaleString('pt-BR') + '</div>'
    + '<div class="acao"><button onclick="window.print()">Imprimir / PDF</button></div>'

    + L.map(l => '<tr><td>' + esc(l.n) + '</td><td>' + esc(String(l.descricao||'').slice(0,80)) + '</td>'
