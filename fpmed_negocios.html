/* ══════════════════════════════════════════════════════════════════════════════════════════════
   NEGÓCIOS · TEMA CLARO — item 5 da fila da reforma ("kanban protagonista").
   Alvo visual: docs/prototipo/fpmed_prototipo_prime.html · tokens: fpmed_tema.css

   ── O MESMO CAMINHO DA TELA ENCONTRAR, E DE PROPÓSITO ─────────────────────────────────────────
   As duas são O MESMO MÓDULO. Uma clara e a outra escura não é "duas telas", é o cliente
   achando que entrou em outro sistema no meio do trabalho. A Encontrar virou ontem (bd35ff1);
   esta era a última escura.

   ── OS NOMES ANTIGOS VIRARAM APELIDOS DOS TOKENS (o "sem apagão" no CSS) ──────────────────────
   O <script> desta tela escreve `var(--linha)`, `var(--muted)`, `var(--verde)` e `var(--azul)`
   DENTRO de HTML gerado — e nenhuma varredura de folha de estilo enxerga isso. Apagar os nomes
   antigos deixaria esses pedaços sem cor, e o defeito só apareceria no dia em que alguém
   abrisse aquele painel.
   >>> ENTÃO CADA NOME VELHO APONTA PRA UM TOKEN, e NENHUM tem valor próprio. Não é uma segunda
       paleta: é uma camada de tradução que some sozinha quando a última referência antiga sair
       do script. Regra nova escreve o token direto.

   ── E POR QUE ALGUNS APELIDOS TROCAM DE "TOM" ────────────────────────────────────────────────
   `--azul-claro` era um azul CLARO porque vivia sobre fundo escuro. Sobre fundo claro o mesmo
   OFÍCIO (título de card, link, ênfase) exige o tom ESCURO — inverter o fundo sem inverter a
   rampa é como se produz texto ilegível que passa despercebido porque "a cor está certa".
   ══════════════════════════════════════════════════════════════════════════════════════════════ */
:root{
  /* apelidos do legado -> tokens. NENHUM valor próprio mora aqui. */
  --azul:        var(--azul-500);
  --azul-claro:  var(--azul-700);   /* ofício de texto/link: sobre claro, o tom escuro */
  --verde:       var(--verde-700);  /* apelido = ofício de TEXTO. Fundo usa --verde-500 direto:
                                       o 700 é o único que passa em AA sobre branco. */
  --verde-esc:   var(--verde-900);
  --muted:       var(--cinza-600);
  --bg:          var(--cinza-50);
  --painel:      var(--branco);
  --painel2:     var(--cinza-50);
  --linha:       var(--cinza-200);
  --texto:       var(--cinza-800);
  --roxo:        #6C5CC4;           /* a única cor sem token: identifica EMPRESA no card
                                       multi-empresa. Entra no tema quando o item 12
                                       (etapas/empresas editáveis) definir a família. */
  --vermelho:    var(--vermelho-600);
  --ambar:       var(--ambar-600);  /* âmbar sobre branco: o 500 não passa em AA como texto */
  --sombra:      var(--sombra-1);
}
/* ══ OS ÍCONES ══════════════════════════════════════════════════════════════════════════════
   D11 proíbe EMOJI COMO ÍCONE, e esta tela tinha 59 deles. O motivo da regra não é gosto:
   emoji é FONTE, não desenho. Ele muda de forma em cada sistema (o <svg class="ic" aria-hidden="true"><use href="#ic-alerta"/></svg> é amarelo no Windows,
   laranja no Android, e no Outlook às vezes não é nada), não herda a cor do texto ao lado, não
   se alinha à grade dos outros e não tem traço em comum com desenho nenhum. Um punhado deles
   numa tela é o que faz a interface parecer montada, e não desenhada.

   >>> COMO ELES ENTRARAM: um SPRITE inline, no topo do <body> — cada ícone existe UMA vez como
       <symbol> e é usado por referência (<use href="#ic-...">). Repetir o SVG inteiro 19 vezes
       seria copiar desenho, e desenho copiado diverge igual a regra copiada.
   >>> MESMO GRID DO MENU: 24×24, traço 1.8, pontas arredondadas — o conjunto é UM só no
       sistema inteiro. `currentColor` faz o ícone herdar a cor de quem o contém, então ele
       acompanha o estado (aviso fica âmbar, erro fica vermelho) sem uma linha de CSS a mais.
   >>> E O TAMANHO É EM `em`, não em px: o ícone cresce com o texto ao lado dele. Ícone que não
       acompanha a fonte é o que fica pequeno demais no título e grande demais na etiqueta. */
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:0 0 auto}
.ic-g{width:1.25em;height:1.25em}
/* O sprite não ocupa espaço nem é lido em voz alta: ele é só o dicionário de desenhos. */
#ic-sprite{position:absolute;width:0;height:0;overflow:hidden}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--cinza-50);
  color:var(--cinza-800);
  font-family:var(--fonte);
  font-size:var(--txt-2);
  line-height:var(--altura-texto);
  /* o menu lateral é `position:fixed` e a largura dele mora no token --menu-largura; sem esta margem o conteúdo nasce por baixo
     dele. Em ≤900px o menu vira faixa no topo e a margem sai. Igual à tela Encontrar. */
  margin-left:var(--menu-largura);
}
@media(max-width:900px){ body{ margin-left:0 } }

header{background:var(--painel);border-bottom:1px solid var(--linha);padding:14px 0;

header .marca{display:flex;align-items:center;gap:9px}

header .nome{font-family:Montserrat;font-weight:800;font-size:17px;color:var(--cinza-800);letter-spacing:.6px}
header .nome small{display:block;font-size:8px;letter-spacing:2.6px;color:var(--muted);font-weight:600;margin-top:-2px}

/* submenu NEGOCIOS, como no SIGA */
/* a barra do PORTAL empurra tudo pra direita; o submenu vem colado nela, sem novo margin-left

header nav.portal{margin-left:auto;display:flex;gap:4px}

/* ── sininho de avisos ── ancorado no header, painel flutuante ── */
.sino-cx{position:relative;margin-left:10px}
.sino{background:var(--painel2);border:1px solid var(--linha);color:var(--texto);border-radius:10px;
  width:38px;height:34px;font-size:15px;cursor:pointer;position:relative;transition:border-color .16s,transform .16s}
.sino:hover{border-color:var(--azul);transform:translateY(-1px)}
.sino .cnt{position:absolute;top:-6px;right:-6px;background:var(--ambar-600);color:var(--branco);border-radius:11px;
  min-width:19px;height:19px;font-size:11px;font-weight:800;font-family:Montserrat;line-height:19px;padding:0 5px}
#notif{display:none;position:absolute;right:0;top:42px;width:380px;max-height:70vh;overflow:auto;z-index:40;
  background:var(--painel);border:1px solid var(--linha);border-radius:13px;box-shadow:var(--sombra-3);padding:8px}
#notif.open{display:block}
.nf-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:10px 10px 5px}
.nf{display:block;padding:9px 11px;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:background .14s,border-color .14s}
.nf:hover{background:var(--azul-50);border-color:var(--azul-200)}
.nf .q{font-size:12.5px;color:var(--cinza-800);font-weight:600}
.nf .s{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.nf.hoje .q{color:var(--ambar-700)}
.nf-vazio{padding:16px 12px;font-size:12.5px;color:var(--muted);line-height:1.5}

.wrap{max-width:1420px;margin:0 auto;padding:0 22px 70px}

/* ── barra de topo: empresa · ordenar · filtrar ── */
/* ══ ARRUMAÇÃO VISUAL (11/08) ═════════════════════════════════════════════════════════════════
   O cliente disse "está faltando alguma coisa, reorganizar melhor" olhando o Licitante Prime.
   O que o Prime faz e esta tela não fazia é AGRUPAR: lá os controles moram dentro de um painel
   com fundo próprio, e o conteúdo respira embaixo. Aqui a barra de filtros flutuava solta sobre
   o fundo, encostada nos chips de fase, encostada nos KPIs — três coisas de níveis diferentes
   com o mesmo peso visual, e nenhuma delas parecendo dona de nada.
   >>> NADA MUDA DE COMPORTAMENTO. Os mesmos controles, nos mesmos lugares, fazendo o mesmo. O
       que muda é o que o olho entende sem ler: onde uma coisa acaba e a outra começa. */
.barra{display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  background:var(--painel);border:1px solid var(--linha);border-radius:12px;
  padding:13px 16px;margin-top:18px}
.barra select,.barra input{background:var(--painel2);border:1px solid var(--linha);color:var(--texto);
  border-radius:9px;padding:8px 12px;font-family:inherit;font-size:12.5px;outline:none}
.barra select:focus,.barra input:focus{border-color:var(--azul)}
.barra .lnk{color:var(--azul-claro);font-size:12.5px;cursor:pointer;text-decoration:none}
.barra .lnk:hover{text-decoration:underline}
.barra .dir{margin-left:auto;display:flex;gap:8px;align-items:center}
.vis{display:flex;background:var(--painel2);border:1px solid var(--linha);border-radius:9px;overflow:hidden}
.vis button{background:none;border:0;color:var(--muted);font-family:inherit;font-size:12.5px;padding:8px 14px;cursor:pointer;transition:background .16s,color .16s}
.vis button:hover{background:rgba(44,169,224,.1);color:var(--texto)}
.vis button.on{background:var(--azul);color:#06202e;font-weight:700}

/* ── chips de fase ── */
/* OS CHIPS DE FASE são NAVEGAÇÃO, e não filtro-de-caixinha: eles ganharam ar em volta pra não
   parecerem a segunda fileira da barra. É a diferença entre "mais um controle" e "por onde eu
   entro na lista". */
.fases{display:flex;gap:9px;flex-wrap:wrap;padding:18px 0 4px}
.chip{background:var(--painel);border:1px solid var(--linha);color:var(--texto);border-radius:22px;
  padding:8px 16px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px;
  transition:border-color .16s,transform .16s,background .16s}
.chip:hover{border-color:var(--azul);transform:translateY(-1px)}
.chip .n{font-family:Montserrat;font-weight:700;font-size:12px;color:var(--muted)}
.chip.on{background:var(--verde-500);border-color:var(--verde-500);color:var(--verde-900);font-weight:700}
.chip.on .n{color:#2c4a08}
.chip .bola{width:9px;height:9px;border-radius:50%}
.sublinks{display:flex;gap:18px;padding:4px 0 10px;font-size:12.5px}
.sublinks a{color:var(--azul-claro);text-decoration:none;cursor:pointer}
.sublinks a:hover{text-decoration:underline}

/* ── card do negócio ── */
.card{background:var(--painel);border:1px solid var(--linha);border-radius:13px;padding:15px 17px;margin-bottom:12px;
  box-shadow:var(--sombra);position:relative;cursor:pointer;transition:border-color .18s,transform .18s,box-shadow .18s}
.card:hover{border-color:var(--azul-300);transform:translateY(-1px);box-shadow:var(--sombra-2)}
.card .fase-tag{position:absolute;top:11px;right:14px;font-size:9px;letter-spacing:1.3px;text-transform:uppercase;
  font-weight:800;color:var(--verde)}
/* ── SITUAÇÃO DO CERTAME (08/08) ── etiqueta + esmaecido, mas o cartão CONTINUA no funil ── */
.card .sit-tag{position:absolute;top:9px;right:14px;font-size:9px;letter-spacing:1.2px;font-weight:800;
  border:1px solid;border-radius:20px;padding:2px 8px}
.card .sit-tag ~ .fase-tag{top:32px}         /* a fase desce pra não colidir com a etiqueta */
/* >>> `.fase-tag` FICOU SEM USO em 11/08 — a etiqueta de fase do card virou o `.cd-prog`, e no
       kanban a coluna já diz a fase. A regra fica por enquanto porque CSS órfão não quebra nada
       e apagar seletor no mesmo commit que muda o HTML é como se descobre, dias depois, que ele
       era usado num terceiro lugar. Sai numa limpeza própria, com o grep na mão. */
/* PARADO ≠ SUMIDO: opacidade menor diz "isto não anda agora" sem esconder de ninguém.
   O :hover devolve a opacidade cheia — cartão que não dá pra ler direito vira cartão ignorado. */
.card.parado{opacity:.55;filter:saturate(.6)}
.card.parado:hover{opacity:1;filter:none}
.card .tit{font-family:Montserrat;font-weight:700;font-size:13.5px;color:var(--azul-claro);text-decoration:none;
  display:inline-block;line-height:1.45;padding-right:96px}
.card:hover .tit{color:var(--azul-800);text-decoration:underline}
.card .emp{display:inline-block;background:#efedfa;border:1px solid #d8d3f2;
  color:var(--roxo);border-radius:20px;padding:2px 9px;font-size:10px;font-weight:700;margin-bottom:7px}
.card .org{font-size:12.5px;color:var(--cinza-600);margin-top:2px}
.card .ab{font-size:12px;color:var(--muted);margin-top:6px}
.card .ab b{color:var(--cinza-800)}
.card .ab.hoje b{color:var(--ambar-700)}
.card .ab.passou b{color:var(--cinza-500)}
.card .etq{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.etq span{font-size:10px;font-weight:600;border-radius:20px;padding:2px 9px}
.etq .fonte{background:var(--cinza-100);border:1px solid var(--cinza-200);color:var(--cinza-600)}
.etq .mod{background:var(--verde-50);border:1px solid var(--verde-200);color:var(--verde-700)}
.etq .num{background:var(--azul-50);border:1px solid var(--azul-200);color:var(--azul-700)}
.etq .obs{background:var(--ambar-50);border:1px solid var(--ambar-100);color:var(--ambar-700)}
.card .prog{font-size:11.5px;color:var(--muted);margin-top:9px;display:flex;align-items:center;gap:8px}
/* AÇÕES só no hover, como no SIGA: elas não podem competir com o conteúdo do card */
.card .acoes{position:absolute;bottom:11px;right:14px;display:flex;gap:6px;opacity:0;transition:opacity .16s}
.card:hover .acoes{opacity:1}
.card .acoes button{background:var(--painel2);border:1px solid var(--linha);color:var(--muted);
  border-radius:7px;padding:3px 9px;font-size:11px;cursor:pointer;font-family:inherit}
.card .acoes button:hover{border-color:var(--azul);color:var(--azul-claro)}
/* O REALCE do "ir pro funil": serve pra ACHAR COM O OLHO depois da rolagem, e some sozinho.
   Pulsa duas vezes em vez de ficar aceso — movimento é o que o olho encontra numa tela cheia
   de cards parecidos; cor fixa vira só mais um card colorido. */
.card.achado{border-color:var(--azul);box-shadow:0 0 0 2px rgba(44,169,224,.55),0 0 22px rgba(44,169,224,.35);
  animation:achei 1.1s ease-in-out 2}
@keyframes achei{0%,100%{box-shadow:0 0 0 2px rgba(44,169,224,.55),0 0 22px rgba(44,169,224,.35)}
  50%{box-shadow:0 0 0 3px rgba(44,169,224,.95),0 0 30px rgba(44,169,224,.6)}}
@media (prefers-reduced-motion: reduce){ .card.achado{animation:none} }

/* ── kanban ── */
.kb{display:flex;gap:14px;overflow-x:auto;padding:8px 2px 20px;align-items:flex-start}
.col{flex:0 0 300px;background:var(--cinza-100);border:1px solid var(--cinza-200);border-radius:var(--raio-cartao);padding:12px}

/* ── agenda: o substituto direto do Calendário 2025 ── */
.ag-dia{display:flex;align-items:baseline;gap:10px;margin:20px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--linha)}

.ag-secao{margin:34px 0 4px;font-family:Montserrat;font-weight:700;font-size:12px;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--muted)}

/* ══ CALENDÁRIO MENSAL — item 6 da fila da reforma ════════════════════════════════════════════
   A Agenda responde "o que vem pela frente, em ordem". O calendário responde outra pergunta, e
   é por isso que ele existe em vez de ser um modo da Agenda: "COMO ESTÁ O MÊS?" — onde tem
   aperto, onde tem buraco, quantas sessões caem na mesma quarta-feira. Uma é fila; a outra é
   mapa. Quem monta proposta precisa da fila; quem decide de quais pregões participar precisa
   do mapa.

   ── AS TRÊS REFERÊNCIAS, E O QUE SAIU DE CADA UMA (Regra Zero / L11) ─────────────────────────
   · Google Calendar (mês) — SEIS LINHAS FIXAS, sempre, mesmo que o mês caiba em cinco. Foi a
     decisão menos óbvia e a mais valiosa: com linhas variáveis a grade muda de altura ao passar
     de mês, o conteúdo abaixo pula, e pulo de layout é defeito nomeado (D14). Dele veio também
     o "+N mais" quando o dia não cabe.
   · uxpatterns.dev (Calendar View) — o erro que ele nomeia é "shipping a desktop-only density
     model": a estratégia de celular se decide ANTES de construir, não depois. Decidida antes, e
     está no `calEstreito()` — abaixo de 700px a grade vira a lista dos dias com sessão.
     Dele também: as células são CONTROLES de verdade (<button>), não divs com onclick.
   · ServiceNow Horizon (now-calendar) — a página respondeu 403 e o que usei foi o resumo da
     busca, o que registro por honestidade: dela veio só a confirmação do "X more" no RODAPÉ da
     célula, com a contagem do que ficou escondido.

   ── E A DECISÃO QUE NÃO VEIO DE REFERÊNCIA NENHUMA ───────────────────────────────────────────
   O calendário mostra negócio COM data de abertura. Os SEM data existem e sumiriam calados —
   e sumir calado é o defeito que este projeto mais pagou pra aprender. Então eles são CONTADOS
   e ditos em cima da grade, com o caminho pra vê-los. Ausência de dado não é valor de dado. */
.cal-topo{display:flex;align-items:center;gap:var(--esp-3);flex-wrap:wrap;
  background:var(--painel);border:1px solid var(--linha);border-radius:var(--raio-cartao);
  padding:var(--esp-3) var(--esp-4);margin-top:var(--esp-2)}
/* SEM `text-transform:capitalize` aqui — ver o comentário do `calNomeMes`: ele produzia
   "Agosto De 2026". O CSS não sabe o que é preposição. */
.cal-mes{font-family:Montserrat;font-weight:700;font-size:var(--txt-4);color:var(--cinza-800);min-width:210px}
.cal-nav{display:flex;gap:var(--esp-1)}
.cal-nav button,.cal-hoje{background:var(--painel2);border:1px solid var(--linha);color:var(--cinza-700);
  border-radius:var(--raio-botao);font-family:inherit;font-size:var(--txt-1);cursor:pointer;
  padding:var(--esp-1) var(--esp-3);transition:border-color .16s,background .16s}
.cal-nav button{width:34px;height:30px;display:grid;place-items:center;padding:0;font-size:var(--txt-3)}
.cal-nav .ic-volta{transform:rotate(180deg)}
.cal-nav button:hover,.cal-hoje:hover{border-color:var(--azul-500);background:var(--azul-50)}
.cal-nav button:focus-visible,.cal-hoje:focus-visible{outline:none;box-shadow:var(--foco)}
.cal-conta{margin-left:auto;font-size:var(--txt-1);color:var(--muted);text-align:right;line-height:1.5}
.cal-conta b{color:var(--cinza-800);font-family:Montserrat}
/* O AVISO DOS SEM DATA não é erro nem sucesso: é um limite do que a tela consegue mostrar.
   Por isso ele é uma nota discreta, e não uma faixa âmbar — pintar de atenção o que é apenas
   uma informação verdadeira ensina a ignorar as faixas que importam. */
.cal-nota{font-size:var(--txt-1);color:var(--muted);padding:var(--esp-2) var(--esp-1) 0;line-height:1.5}
.cal-nota a{color:var(--azul-700);cursor:pointer;text-decoration:underline}

/* ══ AS SEIS LINHAS SÃO FIXAS EM ALTURA, E NÃO SÓ EM QUANTIDADE ═════════════════════════════
   O laço visual mediu e me corrigiu: com 6 linhas garantidas mas altura automática, a grade
   ainda PULAVA 19px ao trocar de mês — uma semana com um dia cheio (3 pílulas + "+N mais") é
   mais alta que uma semana vazia, e o mês seguinte tem os cheios em outro lugar.
   >>> ERA A PROMESSA PELA METADE. "Seis linhas sempre" existe pra tela não se mexer sozinha;
       seis linhas de altura variável entregam a contagem e não entregam o efeito. O olho não vê
       19px como "a grade mudou de altura", vê como "a página pulou" — e é o defeito D14.
   >>> A ALTURA É O PIOR CASO **MAIS FOLGA**, e a folga não é capricho. A célula nunca passa de 3
       pílulas mais o "+N mais" (a pílula não quebra linha — o órgão é cortado com reticências), e
       medido no navegador esse pior caso dá 144px cravados. Fixar em 144 deixaria folga ZERO: um
       pixel de diferença de fonte, de zoom ou de sistema e o "+N mais" começa a ser cortado —
       justamente no dia mais cheio, que é quando ele importa. 152px dá 8px de folga (uma unidade
       da grade) e continua sendo altura fixa. */
.cal-grade{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto repeat(6,152px);
  gap:1px;margin-top:var(--esp-3);
  background:var(--cinza-200);border:1px solid var(--cinza-200);border-radius:var(--raio-cartao);
  overflow:hidden}
.cal-cabdia{background:var(--cinza-100);padding:var(--esp-2) var(--esp-2);font-size:var(--txt-1);
  font-weight:600;color:var(--cinza-600);text-transform:uppercase;letter-spacing:.6px;text-align:center}
/* `overflow:hidden` é o cinto de segurança da altura fixa: se algum dia a pílula ganhar uma
   segunda linha, ela é cortada em vez de esticar a grade e voltar com o pulo pela porta dos
   fundos. Cortar é visível; esticar não é. */
.cal-cel{background:var(--branco);padding:var(--esp-2);display:flex;flex-direction:column;
  gap:var(--esp-1);overflow:hidden}
/* FIM DE SEMANA COM FUNDO MAIS FRIO: pregão em sábado é raro, e o olho que procura "que dia da
   semana isso cai" acha a coluna útil mais rápido quando as duas inúteis recuam. */
.cal-cel.fds{background:var(--cinza-50)}
/* DIA DE OUTRO MÊS NÃO SOME: sessão em 31/07 importa pra quem olha a 1ª semana de agosto. Ele
   fica esmaecido — presente, e claramente de fora. */
.cal-cel.fora{background:var(--cinza-50);opacity:.62}
.cal-cel.hoje{box-shadow:inset 0 0 0 2px var(--ambar-500)}
.cal-cel.sel{box-shadow:inset 0 0 0 2px var(--azul-600)}
.cal-cel.hoje.sel{box-shadow:inset 0 0 0 2px var(--azul-600),inset 0 0 0 4px var(--ambar-100)}
.cal-dia{background:none;border:0;font-family:Montserrat;font-weight:700;font-size:var(--txt-2);
  color:var(--cinza-700);cursor:pointer;padding:0 var(--esp-1);border-radius:var(--raio-botao);
  align-self:flex-start;line-height:1.6;min-width:26px;text-align:left}
.cal-dia:hover{background:var(--azul-50);color:var(--azul-700)}
.cal-dia:focus-visible{outline:none;box-shadow:var(--foco)}
.cal-cel.hoje .cal-dia{color:var(--ambar-700)}
.cal-cel.fora .cal-dia{color:var(--cinza-500);font-weight:400}

/* ── A PÍLULA ────────────────────────────────────────────────────────────────────────────────
   DUAS CAMADAS, e a medição é que mandou: fundo na TÊNUE da etapa (texto --cinza-800 por cima,
   ≥13:1) e barra lateral na cor CHEIA. Pílula pintada com a cor cheia dava 2,94:1 na etapa 2 —
   ver o bloco das tênues no fpmed_tema.css e os asserts do testa_tema.
   >>> A HORA VEM PRIMEIRO e em negrito. A pergunta de quem olha o dia é "que horas?", nunca
       "de quem?" — o órgão é o desempate, e por isso é o que se corta quando falta largura. */
.cal-pil{display:flex;align-items:baseline;gap:var(--esp-1);width:100%;text-align:left;
  border:0;border-left:3px solid var(--cinza-400);border-radius:var(--raio-botao);
  padding:3px var(--esp-2);font-family:inherit;font-size:var(--txt-1);color:var(--cinza-800);
  cursor:pointer;transition:filter .14s,box-shadow .14s}
.cal-pil:hover{filter:brightness(.96);box-shadow:var(--sombra-1)}
.cal-pil:focus-visible{outline:none;box-shadow:var(--foco)}
.cal-pil .h{font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto}
.cal-pil .q{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* PARADO (cancelado/suspenso) no calendário segue a mesma regra do card: esmaecido e presente. */
.cal-pil.parado{opacity:.55}
.cal-mais{background:none;border:0;font-family:inherit;font-size:var(--txt-1);color:var(--azul-700);
  cursor:pointer;padding:2px var(--esp-1);text-align:left;align-self:flex-start;border-radius:var(--raio-botao)}
.cal-mais:hover{background:var(--azul-50);text-decoration:underline}
.cal-mais:focus-visible{outline:none;box-shadow:var(--foco)}

/* ── O DIA ABERTO ────────────────────────────────────────────────────────────────────────────
   Ele abre ABAIXO da grade, e não num balão flutuante. Balão de calendário é o clássico que
   fica meio fora da tela na última coluna e na última linha — e aqui embaixo cabe o CARTÃO DE
   VERDADE, o mesmo da lista, com as mesmas ações. Uma peça a menos pra manter. */
.cal-dia-painel{background:var(--painel);border:1px solid var(--linha);border-radius:var(--raio-cartao);
  padding:var(--esp-4);margin-top:var(--esp-3)}
.cal-dia-painel .cab{display:flex;align-items:baseline;gap:var(--esp-2);margin-bottom:var(--esp-3)}
.cal-dia-painel .cab .d{font-family:Montserrat;font-weight:800;font-size:var(--txt-3);color:var(--cinza-800)}
.cal-dia-painel .cab .sem{font-size:var(--txt-1);color:var(--muted)}
.cal-dia-painel .cab .x{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;
  font-size:var(--txt-2);padding:var(--esp-1) var(--esp-2);border-radius:var(--raio-botao)}
.cal-dia-painel .cab .x:hover{background:var(--cinza-100);color:var(--cinza-800)}
.cal-dia-painel .cab .x:focus-visible{outline:none;box-shadow:var(--foco)}

/* ── CELULAR: a grade de 7 colunas não cabe, e espremer não é estratégia ─────────────────────
   Em 390px cada coluna teria ~50px — nem a hora caberia. A referência nomeia isso como erro
   ("desktop-only density model") e prescreve um resumo alternativo. O nosso resumo é a lista
   dos dias COM sessão daquele mês: mesma pergunta ("como está o mês?"), respondida em coluna.
   >>> A NAVEGAÇÃO DE MÊS CONTINUA IGUAL, porque é ela que define o recorte nos dois formatos. */
.cal-lista{margin-top:var(--esp-3)}
@media(max-width:700px){
  .cal-mes{font-size:var(--txt-3);min-width:0}
  .cal-conta{margin-left:0;width:100%;text-align:left}
}

.vazio{text-align:center;padding:46px 20px;color:var(--muted);font-size:13.5px;
  background:var(--branco);border:1px dashed var(--cinza-300);border-radius:var(--raio-cartao)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--painel);border-radius:14px;
  box-shadow:var(--sombra);overflow:hidden;margin:14px 0 4px;border:1px solid var(--linha)}
.kpi{padding:14px 17px;border-right:1px solid var(--linha)}
.kpi:last-child{border-right:0}
/* A HIERARQUIA DO NÚMERO — o padrão que o Prime usa em todo dado: rótulo pequeno e cinza EM
   CIMA, valor grande e branco EMBAIXO. O olho encontra o número primeiro e o nome dele depois,
   que é a ordem em que a pergunta é feita ("quanto?" antes de "quanto do quê?"). */
.kpi b{font-family:Montserrat;font-size:22px;font-weight:700;display:block;line-height:1.1;color:var(--cinza-800);margin-bottom:3px}
.kpi span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

/* ── drawer de detalhe ── */
#velcro{position:fixed;inset:0;background:rgba(18,23,33,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#velcro.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--painel);
  border-left:1px solid var(--linha);box-shadow:var(--sombra-3);z-index:41;
  transform:translateX(100%);transition:transform .22s ease;overflow-y:auto}
#drawer.on{transform:none}
.dw-top{position:sticky;top:0;background:var(--painel);border-bottom:1px solid var(--linha);padding:15px 20px;z-index:2}
.dw-top .x{position:absolute;top:13px;right:16px;background:var(--painel2);border:1px solid var(--linha);
  color:var(--muted);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:15px;line-height:1}
.dw-top .x:hover{border-color:var(--azul);color:var(--azul-claro)}
.dw-top h2{margin:0;font-family:Montserrat;font-size:15px;font-weight:700;color:var(--cinza-800);padding-right:40px;line-height:1.45}
.dw-body{padding:16px 20px 40px}
.dw-sec{margin-top:20px}
.dw-sec > h4{margin:0 0 4px;font-family:Montserrat;font-size:11px;font-weight:700;letter-spacing:1.3px;
  text-transform:uppercase;color:var(--muted)}
/* A LINHA QUE EXPLICA A SEÇÃO. O que enchia a tela não era a quantidade de seções — era ter que
   ADIVINHAR o que cada uma faz. Dez palavras transformam "mais um bloco" em "ah, é isso".
   >>> EU SOBREPUS, E SÓ VI NO PRINT PRO CLIENTE. Escrevi que "as seções que já tinham explicação
       ficam como estão" e acrescentei a linha em TODAS — o print mostrou duas linhas cinzas
       empilhadas dizendo a mesma coisa em Proposta, CMED, Ata, Credenciamentos, Lembretes e
       Tarefas. Exatamente o "muito cheio de coisa" que esta faxina existe pra resolver, criado
       por ela. Sobraram as 2 seções que não tinham explicação nenhuma; nas outras venceu a que já
       estava, porque ela carrega o PORQUÊ e a minha só dizia o QUÊ. */
.sec-dica{font-size:11.5px;color:var(--muted);margin:0 0 10px;line-height:1.5;opacity:.9}
/* ══ O STEPPER DE ETAPAS ══ a linha do tempo que substituiu a fileira de botões iguais ══════
   A LINHA que conecta é o ::before do container, atrás das bolas — é ela que transforma cinco
   caixinhas num caminho. Sem ela seriam cinco botões bonitos e a pergunta "quanto falta?"
   continuaria sem resposta visual. */
.dw-etapas{background:var(--painel2);border:1px solid var(--linha);border-radius:12px;padding:15px 17px 13px}
.passos-linha{display:flex;align-items:flex-start;gap:2px;position:relative;overflow-x:auto;padding-bottom:2px}
.passos-linha::before{content:'';position:absolute;left:9%;right:9%;top:15px;height:2px;background:var(--linha);z-index:0}
.passos-linha .pas{flex:1;min-width:74px;background:transparent;border:0;padding:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:1;font-family:inherit}
.passos-linha .bola{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:var(--painel);border:2px solid var(--linha);color:var(--muted);
  font-size:12.5px;font-weight:700;transition:transform .16s,box-shadow .16s}
.passos-linha .nm{font-size:11px;color:var(--muted);text-align:center;line-height:1.25;transition:color .16s}
/* PASSADO: cor cheia, mas discreto — ele já foi, não compete pela atenção. */
.passos-linha .pas.feito .nm{color:var(--texto)}
/* PRESENTE: é o único que cresce. O halo faz o olho parar aqui antes de ler qualquer coisa. */
.passos-linha .pas.agora .bola{width:38px;height:38px;font-size:15px;box-shadow:0 0 0 5px rgba(44,169,224,.16)}
.passos-linha .pas.agora .nm{color:var(--cinza-800);font-weight:700;font-size:11.5px}
/* FUTURO: apagado. Ele existe pra dizer QUANTO FALTA, e não pra ser lido agora. */
.passos-linha .pas.futuro .bola{opacity:.42}
.passos-linha .pas.futuro .nm{opacity:.5}
.passos-linha .pas:hover .bola{transform:scale(1.08)}
.passos-linha .pas:hover .nm{color:var(--azul-claro)}
.passos-legenda{margin-top:11px;padding-top:10px;border-top:1px solid var(--linha);font-size:12px;color:var(--muted)}
/* "O QUE FAZER AGORA" — a frase da etapa. Fundo próprio pra ela não virar mais uma linha de
   texto cinza no meio de outras: é a única coisa da ficha que diz o que a pessoa deve FAZER. */
.agora-faz{margin-top:9px;background:var(--azul-50);border-left:3px solid var(--azul-500);
  border-radius:0 8px 8px 0;padding:9px 12px;font-size:12.5px;color:var(--cinza-800);line-height:1.5}
/* A ABA DA ETAPA ganha um ponto — o "você está aqui" do segundo nível. Ele existe porque a
   pessoa pode ter navegado pra outra aba e voltado, e aí o `.on` já não é a da etapa. */
.dw-abas button.foco::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--verde-500);margin-left:6px;vertical-align:middle}
/* ── "⋯ MAIS AÇÕES" ── o resto continua a UM clique, no mesmo lugar, sempre ── */
.mais-cx{position:relative;display:inline-block}
.mais-menu{display:none;position:absolute;bottom:calc(100% + 6px);left:0;min-width:220px;z-index:5;
  background:var(--painel);border:1px solid var(--linha);border-radius:10px;padding:5px;
  box-shadow:var(--sombra-2)}
.mais-cx.on .mais-menu{display:block}
.mais-menu a{display:block;padding:8px 11px;border-radius:7px;font-size:12px;color:var(--texto);
  cursor:pointer;text-decoration:none;white-space:nowrap}
.mais-menu a:hover{background:var(--painel2);color:var(--azul-claro)}
/* ── o mini-progresso do card ── */
.cd-prog{display:flex;align-items:center;gap:8px;margin:2px 0 7px;flex-wrap:wrap}
.cd-prog .bolas{display:flex;gap:3px}
.cd-prog .bolas i{width:7px;height:7px;border-radius:50%;border:1px solid var(--linha);display:block}
.cd-prog .txt{font-size:10.5px;color:var(--muted);letter-spacing:.2px}
.ficha{display:grid;grid-template-columns:112px 1fr;gap:7px 12px;font-size:12.5px}
.ficha dt{color:var(--muted)}
.ficha dd{margin:0;color:var(--texto);word-break:break-word}
.ficha dd.ganho{color:var(--verde-700);font-weight:700}
.dw-obs{background:var(--ambar-50);border:1px solid var(--ambar-100);border-left:3px solid var(--ambar-600);
  border-radius:9px;padding:11px 13px;font-size:12.5px;color:var(--cinza-800);white-space:pre-wrap;line-height:1.55}
textarea.anot{width:100%;min-height:110px;background:var(--painel2);border:1px solid var(--linha);color:var(--texto);
  border-radius:10px;padding:11px 13px;font-family:inherit;font-size:12.5px;line-height:1.55;outline:none;resize:vertical}
textarea.anot:focus{border-color:var(--azul)}
.salvo{font-size:11px;color:var(--muted);margin-top:5px;min-height:14px}
/* ── FICHA CAMPO A CAMPO (08/08) ── só um campo aberto por vez; ver o comentário em
   `editarCampo`. O botão "Alterar" é discreto e só aparece no hover da linha: ficha cheia de
   botões azuis compete com o conteúdo, e o conteúdo é o que se veio ler. */
.ficha-fc .fc{border-bottom:1px solid var(--linha);padding:8px 0}
.ficha-fc .fc:last-child{border-bottom:0}
.fc-r{display:flex;align-items:baseline;gap:10px}
.fc-rot{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;
  min-width:120px;flex-shrink:0}
.fc-val{font-size:12.5px;color:var(--texto);line-height:1.5;flex:1;word-break:break-word}
.fc-val i{color:var(--muted);font-style:normal}
.fc-bt{opacity:0;background:transparent;border:1px solid var(--linha);color:var(--muted);
  border-radius:7px;padding:2px 9px;font-size:10.5px;cursor:pointer;font-family:inherit;
  transition:opacity .15s,color .15s,border-color .15s;flex-shrink:0}
.fc:hover .fc-bt{opacity:1}
.fc-bt:hover{color:var(--azul-claro);border-color:rgba(44,169,224,.5)}
.fc-edit label{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.6px}
.fc-in{display:flex;gap:8px}
.fc-in input,.fc-in select,.fc-in textarea{flex:1;background:var(--painel2);color:var(--texto);
  border:1px solid rgba(44,169,224,.5);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:inherit}
.fc-in textarea{resize:vertical;line-height:1.5}
.fc-acoes{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn-ed.sec{background:var(--painel2);color:var(--texto);border:1px solid var(--linha)}
.btn-ed{background:var(--azul);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:600;
  font-size:12.5px;cursor:pointer;font-family:inherit}
.btn-ed:disabled{opacity:.5;cursor:not-allowed}
/* ── ABAS DA FICHA (08/08) ── cada aba é uma PERGUNTA diferente sobre o mesmo negócio ── */
.dw-abas{display:flex;gap:4px;padding:0 0 10px;border-bottom:1px solid var(--linha);margin-bottom:12px;flex-wrap:wrap}
.dw-abas button{background:transparent;border:0;color:var(--muted);font-size:12.5px;font-family:inherit;
  padding:7px 12px;border-radius:8px;cursor:pointer;transition:background .15s,color .15s}
.dw-abas button:hover{background:var(--painel2);color:var(--texto)}
.dw-abas button.on{background:rgba(44,169,224,.16);color:var(--azul-claro);font-weight:600}
.dw-painel{display:none}
.dw-painel.on{display:block}
/* ── LEMBRETES ── */
.lem-novo{display:grid;grid-template-columns:1fr 190px 96px auto;gap:8px;margin:10px 0 6px}
@media(max-width:700px){.lem-novo{grid-template-columns:1fr}}
.lem-novo input,.lem-novo select{background:var(--painel2);color:var(--texto);border:1px solid var(--linha);
  border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:inherit}
.lem{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--linha)}
.lem .t{font-size:12.5px;color:var(--cinza-800);line-height:1.4}
.lem .q{font-size:11px;color:var(--muted);margin-top:2px}
.lem .prio{margin-left:auto;font-size:10px;font-weight:700;border:1px solid;border-radius:20px;padding:1px 8px;white-space:nowrap}
/* feito continua VISÍVEL, só apagado: some seria perder a prova de que a coisa foi feita */
.lem.feito .t{text-decoration:line-through;color:var(--muted)}
.lem.feito{opacity:.6}
.rastro{font-size:11.5px;color:var(--texto);padding:6px 0;border-bottom:1px solid var(--linha);line-height:1.5}
.rastro b{color:var(--azul-claro)}
.rastro span{display:block;color:var(--muted);font-size:10.5px}
.salvo.ok{color:var(--verde)}
.salvo.erro{color:var(--vermelho)}
.tf{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:12.5px;cursor:pointer;line-height:1.45}
.tf input{margin-top:2px;accent-color:var(--verde-600);cursor:pointer}
.tf.feita span{color:var(--muted);text-decoration:line-through}
/* ── O FORMULÁRIO DE INCLUSÃO ── mesmo desenho dos painéis: ele abre no lugar, não em outra tela */
#form-manual{background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:16px 18px;margin:14px 0}
.fm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px;margin-top:10px}
.fm-c label{display:block;font-size:10.5px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.fm-c input,.fm-c select,.fm-c textarea{width:100%;background:var(--painel2);color:var(--texto);
  border:1px solid var(--linha);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:inherit}
.fm-c textarea{resize:vertical}
.fm-c input:focus,.fm-c select:focus,.fm-c textarea:focus{outline:none;border-color:var(--azul)}
/* ── AS CAIXINHAS COMO BOTÃO ── cartão que é botão precisa PARECER botão, senão a função existe
   só pra quem leu o commit. Cursor de mão, borda que acende e um empurrãozinho pra cima. ── */
.kpi.bt{cursor:pointer;transition:border-color .16s,transform .12s,background .16s}
.kpi.bt:hover{border-color:var(--azul);background:var(--painel2);transform:translateY(-2px)}
.kpi.bt:active{transform:translateY(0)}
.kpi.bt::after{content:'›';position:absolute;top:8px;right:11px;color:var(--muted);font-size:15px;opacity:.55}
.kpi{position:relative}
/* ── O PAINEL DAS CAIXINHAS ── */
#painel-kpi{background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:16px 18px;margin:14px 0}
.pk-topo{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap;font-size:14px;color:var(--cinza-800)}
.pk-conta{background:var(--painel2);border:1px solid var(--linha);border-radius:9px;padding:11px 13px;font-size:13px;color:var(--cinza-800);margin-bottom:8px}
.pk-tab{width:100%;border-collapse:collapse;font-size:12.5px}
.pk-tab th{text-align:left;padding:7px;border-bottom:1px solid var(--linha);color:var(--muted);font-size:10.5px;text-transform:uppercase}
.pk-tab td{padding:7px;border-bottom:1px solid var(--cinza-100)}
.pk-tab tbody tr{cursor:pointer}
.pk-tab tbody tr:hover{background:var(--painel2)}
.pk-tab tfoot td{border-top:2px solid var(--cinza-300);border-bottom:0;padding-top:9px;color:var(--cinza-800)}
.pk-dif{font-size:10.5px;color:var(--ambar-700);margin-top:2px}
/* ── PROPOSTA ANEXADA ── */
.prop-novo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 6px}
.prop-novo input[type=file]{background:var(--painel2);color:var(--texto);border:1px solid var(--linha);
  border-radius:8px;padding:7px 9px;font-size:12px;font-family:inherit;flex:1;min-width:180px}
.anx{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--linha);font-size:12.5px}
.anx .v{font-size:10px;font-weight:700;color:var(--azul-claro);border:1px solid var(--azul-claro);
  border-radius:20px;padding:1px 8px;white-space:nowrap}
.anx .n{color:var(--cinza-800);flex:1;cursor:pointer;text-decoration:underline;text-decoration-color:var(--linha)}
.anx .q{color:var(--muted);font-size:11px;white-space:nowrap}
/* O placar da conferência: mesmo desenho do Conferidor, de propósito — é o mesmo resultado. */
.pl-conf{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:10px 0}
.pl-conf div{background:var(--painel2);border:1px solid var(--linha);border-radius:9px;padding:9px 10px;text-align:center}
.pl-conf b{display:block;font-family:Montserrat,sans-serif;font-size:19px;color:var(--cinza-800)}
.pl-conf span{font-size:10.5px;color:var(--muted)}
.pl-conf .acima b{color:var(--vermelho-700)} .pl-conf .acima{border-color:var(--vermelho-300)}
.pl-conf .ok b{color:var(--verde-700)}
/* ── CREDENCIAMENTOS ── */
.cred-novo{display:grid;grid-template-columns:1fr 170px auto;gap:8px;margin:12px 0 6px}
@media(max-width:700px){.cred-novo{grid-template-columns:1fr}}
.cred-novo input,.cred-novo select{background:var(--painel2);color:var(--texto);border:1px solid var(--linha);
  border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:inherit}
.cred{border:1px solid var(--linha);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--painel2)}
.cred .topo{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.cred .nome{font-size:13px;font-weight:600;color:var(--cinza-800)}
.cred .selo{font-size:10px;font-weight:700;border:1px solid;border-radius:20px;padding:1px 9px;white-space:nowrap}
.cred .meta{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.6}
/* PARADO É AVISO, e por isso ele muda a BORDA do cartão e não só um texto no meio da linha:
   pedido esquecido é o defeito que esta seção existe pra pegar, e ele tem que saltar da lista. */
.cred.parado{border-color:var(--ambar-300)}
.cred .passos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cred .passos button{background:transparent;border:1px solid var(--linha);color:var(--muted);border-radius:8px;
  padding:5px 10px;font-size:11.5px;font-family:inherit;cursor:pointer}
.cred .passos button:hover{border-color:var(--azul);color:var(--azul-claro)}
.cred .trilha{margin-top:8px;padding-top:8px;border-top:1px solid var(--linha);font-size:11px;color:var(--muted);line-height:1.7}
.dw-acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px;padding-top:16px;border-top:1px solid var(--linha)}
.dw-acoes button{background:var(--painel2);border:1px solid var(--linha);color:var(--texto);border-radius:9px;
  padding:8px 14px;font-size:12px;font-family:inherit;cursor:pointer}
.dw-acoes button:hover{border-color:var(--azul);color:var(--azul-claro)}
@media(max-width:760px){.col{flex:0 0 84vw}.ag-hora{flex:0 0 48px;font-size:12.5px}.ficha{grid-template-columns:96px 1fr}}

/* ══ O CABEÇALHO NO CELULAR ══════════════════════════════════════════════════════════════════
   MEDIDO no laço visual, e não suposto: em 390px o documento tinha 53px de rolagem horizontal.
   O culpado NÃO era o menu lateral (ele já vira faixa com `overflow-x:auto` e estava contido em
   375, conferido) — era o `header`: `scrollWidth` 443 contra 375 de largura.
   A `.faixa-int` é flex SEM `flex-wrap`, e o título + as três visões + o sino somam ~390px numa
   linha de 331px úteis. Sem permissão pra quebrar, o flex empurra pra fora.
   >>> POR QUE QUEBRAR A LINHA E NÃO ENCOLHER O TEXTO: as três visões são NAVEGAÇÃO, e rótulo de
       navegação encolhido vira adivinhação ("Funil de Lic..."). Numa tela estreita sobra altura,
       nunca largura — então a segunda linha é o recurso barato aqui.
   >>> E O SINO FICA NA PRIMEIRA LINHA, colado à direita: ele é o único item do cabeçalho com
       urgência, e mandá-lo pra segunda linha o esconderia abaixo da dobra em telas curtas.
   >>> 900px e não 760: é o MESMO ponto em que o menu lateral vira faixa horizontal. Dois pontos
       de quebra diferentes fariam a tela se reorganizar duas vezes durante o mesmo arrasto. */
@media(max-width:900px){
  header .faixa-int{flex-wrap:wrap;row-gap:10px}

  header nav{order:3;width:100%;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}

}

             dobra não é reforço de marca, é desalinhamento.
         >>> O QUE FICOU NO HEADER é só o que é DESTA tela: o nome dela, as três visões e o

    <!-- ══ A DÍVIDA DO `data-vis` FOI PAGA AQUI (12/08, item 6) ═══════════════════════════════
         O mapa visão→link era por ÍNDICE e vivia em DOIS lugares (o `setVis` e o boot). Ele já

/* ══ O KANBAN VIROU A VISÃO DE ABERTURA (12/08, item 5: "kanban protagonista") ═══════════════

  /* ══ QUEM CHEGA PELO MENU LATERAL MANDA MAIS QUE A ÚLTIMA ESCOLHA ══════════════════════════

// A COLETA pro sino (12/08). Mesma regra das outras fontes: `null` = ainda nao li ·
// `'erro'` = nao consegui ler. Lista vazia diria "esta tudo em dia", e nao e isso que houve.

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ── datas: 'YYYY-MM-DD' comparado como TEXTO ──────────────────────────────────────────────
// Nunca `new Date('2026-08-06') < hoje`: a string vira meia-noite UTC = 21h do dia anterior em
// GO (-03), e a licitação que abre HOJE — a mais urgente do funil — apareceria como vencida.
// Foi exatamente esse defeito que arquivou uma linha na semeadura de 06/08.
const hojeYMD = () => { const d=new Date(), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); };
// dia LOCAL, não o slice(0,10) do ISO: o banco devolve `timestamptz` em UTC, e a sessão das
// 21h em diante já caiu no dia seguinte lá. Fatiar o texto colocaria essa licitação no dia
// errado da agenda — e comparar contra `hojeYMD()`, que é local, misturaria dois calendários.
const diaDe  = iso => { if(!iso) return null; const d = new Date(iso);
  if(isNaN(d)) return String(iso).slice(0,10);
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); };
const horaDe = iso => { if(!iso) return null; const d=new Date(iso); return isNaN(d) ? null
  : d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };
function fmtDtH(iso){
  if(!iso) return null;
  const d = new Date(iso); if(isNaN(d)) return null;
  return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
/* ── "N sessões", escrito num lugar só ───────────────────────────────────────────────────────
   >>> ESTE HELPER NASCEU DE UM DEFEITO QUE ESTAVA NO AR (achado em 12/08 pela suíte do
       calendário, no código da AGENDA que eu não tinha tocado hoje). Ele era escrito assim:

       desde 06/08, num cabeçalho de dia que ninguém lê palavra por palavra.
   >>> A CORREÇÃO NÃO É ARRUMAR O TEXTO NOS TRÊS LUGARES, é ter um lugar. Eu ia copiar a mesma
       linha pro calendário — e copiada, ela repetiria o defeito em mais dois pontos, agora com
       ele já corrigido em um. É a lição S8 pelo avesso: conhecimento repetido envelhece torto.
   >>> E A MINHA PRIMEIRA CORREÇÃO TAMBÉM SAIU ERRADA: `'sessã' + (q===1?'o':'ões')` dá
       "sessãões", porque em português o plural de "sessão" troca o "ã" por "õ" — não acrescenta.
       O assert pegou as duas versões erradas seguidas. Palavra inteira, sem esperteza: */
const nSessoes = q => q + ' ' + (q === 1 ? 'sessão' : 'sessões');
/* Sobe SÓ a primeira letra. O `text-transform:capitalize` do CSS sobe TODAS as palavras, e foi
   assim que o laço visual encontrou "Agosto De 2026" no topo do calendário e "Quarta-Feira" no
   painel do dia — a segunda também estava na AGENDA, desde 06/08. O CSS não sabe o que é
   preposição nem o que é palavra composta; quem sabe é quem escreve o texto. */
const M1 = s => !s ? s : s.charAt(0).toUpperCase() + s.slice(1);
const DIA_SEM = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
function rotuloDia(ymd){
  const [a,m,d] = ymd.split('-').map(Number);
  const dt = new Date(a, m-1, d);            // construtor local: não passa pelo parser UTC
  return { data: `${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${a}`, semana: DIA_SEM[dt.getDay()] };
}

// ══ NOTIFICAÇÕES (item 9, 2º pedaço · 06/08) ══════════════════════════════════════════════
// >>> NÃO TEM TABELA, e isso é decisão: a notificação é DERIVADA do fato (a data de abertura
//     do negócio), igual à Agenda. Fila de mensagens guardada exigiria um processo pra criar,
//     outro pra expirar, e no dia em que um deles falhasse o sino avisaria de sessão que já
//     aconteceu — que é pior que não avisar.
//
// >>> E POR ISSO NÃO EXISTE "MARCAR COMO LIDA". O aviso some quando o fato some (o dia passa,
//     o negócio é arquivado). Um botão de dispensar deixaria alguém esconder a sessão que abre
//     hoje às 8h — exatamente a que o sino existe pra não deixar passar.
const emDias = k => { const d = new Date(); d.setDate(d.getDate() + k); const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); };
// Fases em que a sessão AINDA NÃO deveria ter passado. Se a abertura ficou pra trás e o negócio
// segue aqui, ou ninguém mexeu ou esqueceram de mover — nos dois casos é aviso, não ruído.
const _FASES_ANTES = ['oportunidade','qualificacao'];
function notificacoes(lista){
  const hoje = emDias(0), amanha = emDias(1);
  const vivos = (lista||[]).filter(n => !n.arquivado && n.abertura);
  const porHora = (a,b) => String(a.abertura||'').localeCompare(String(b.abertura||''));
  const hojeL   = vivos.filter(n => diaDe(n.abertura) === hoje).sort(porHora);
  const amanhaL = vivos.filter(n => diaDe(n.abertura) === amanha).sort(porHora);
  const passou  = vivos.filter(n => diaDe(n.abertura) < hoje && _FASES_ANTES.includes(n.estagio))
                       .sort((a,b)=>porHora(b,a));
  // O NÚMERO do sino conta só hoje + amanhã. Somar as atrasadas deixaria o badge acesso pra
  // sempre com histórico velho, e badge que nunca zera é badge que ninguém mais olha.
  return { hoje: hojeL, amanha: amanhaL, passou, urgentes: hojeL.length + amanhaL.length };
}

/* ══ O TETO DE 1000 DO POSTGREST — E O `limit=3000` QUE NÃO RESOLVIA ══════════════════════════
   Medido no ar em 11/08, com a tela aberta: `NEG.length === 1000`, e o banco com 2.558 negócios.
   A consulta pedia `limit=3000` — e o teto NÃO é do pedido, é do servidor (`db-max-rows`). Pedir
   mais do que ele dá não dá erro: dá 1.000 linhas, calado.

   >>> E TODO NÚMERO DO TOPO ESTAVA ERRADO, inclusive os que a empresa usa pra decidir:
         histórico ..... 1.000    (real 2.558)
         ganhas ........ 23       (real 105)
         taxa vitória .. 10,6%    (real 15,1%)
         total ganho ... R$ 12.450.875,10   (real R$ 63.034.332,63)
       Nenhum deles parecia errado. É exatamente o defeito que mordeu a busca do Natanael em
       11/08 ("dizia zero sabendo menos do que sabia"), na mesma instância e pela mesma razão —
       e desta vez ele estava embaixo da taxa de vitória.

   >>> A PAGINAÇÃO USA `Range`, e não `offset`: com `order` estável é o caminho que o PostgREST
       documenta, e é o mesmo já usado no Licitações e no Conferidor. Teto de 20 páginas pra um
       laço que nunca termina não virar uma tela que nunca abre — e se ele for atingido, a tela
       DIZ, porque 20.000 negócios truncados em silêncio seriam este mesmo bug de novo. */
const PAG_NEG = 1000, TETO_PAG_NEG = 20;
async function lerNegociosPaginado(){
  let out = [], pag = 0;
  window._negTruncou = false;
  while(pag < TETO_PAG_NEG){
    const de = pag * PAG_NEG, ate = de + PAG_NEG - 1;
    const r = await fetch(`${SB_URL}/rest/v1/negocios?select=*&order=abertura.desc`,
      { headers: Object.assign({}, SB_H, { Range: `${de}-${ate}`, 'Range-Unit': 'items' }) });
    if(!r.ok) throw new Error('o banco respondeu ' + r.status
      + (r.status===401||r.status===403 ? ' — o funil é tela de gestor' : ''));
    const d = await r.json();
    out = out.concat(d);
    if(d.length < PAG_NEG) return out;
    pag++;
  }
  window._negTruncou = true;   // bateu no teto: a tela avisa em vez de fingir que leu tudo
  return out;
}

    DOCS = rd.ok ? await rd.json() : 'erro';
  }catch(e){ DOCS = 'erro'; }
  // LEMBRETES ABERTOS pro sino — só os que ainda não foram feitos e que vencem até amanhã. O
  // mesmo critério das sessões: o sino é do dia, não da vida inteira.
  try{
    const amanha = new Date(); amanha.setDate(amanha.getDate()+2); amanha.setHours(0,0,0,0);
    // `tipo` vem junto: tarefa e lembrete entram os DOIS no sino (foi o pedido), mas o sino diz
    // qual é qual — "tarefa atrasada" e "lembrete atrasado" pedem coisas diferentes de quem lê.
    const rl = await fetch(`${SB_URL}/rest/v1/lembretes?feito=is.false&quando=lt.${amanha.toISOString()}&select=id,negocio_id,titulo,quando,prioridade,tipo&order=quando.asc&limit=50`, {headers:SB_H});
    LEM_SINO = rl.ok ? await rl.json() : 'erro';
  }catch(e){ LEM_SINO = 'erro'; }
  // CREDENCIAMENTOS PARADOS pro sino. O corte é feito no BANCO (`solicitado_em=lt.<data>`) e não
  // aqui: trazer todos pra filtrar na tela leria a lista inteira de credenciamentos da empresa
  // toda vez que alguém abre o funil, pra usar dois.
  try{
    const limite = new Date(); limite.setDate(limite.getDate() - CRED_DIAS_PARADO);
    const rc = await fetch(`${SB_URL}/rest/v1/credenciamentos?status=in.(solicitado,em_analise)`
      + `&solicitado_em=lt.${limite.toISOString()}`
      + '&select=id,negocio_id,industria,status,solicitado_em&order=solicitado_em.asc&limit=50', {headers:SB_H});
    CRED_SINO = rc.ok ? await rc.json() : 'erro';
  }catch(e){ CRED_SINO = 'erro'; }
  // ESTADO DA COLETA pro sino. Em chamada separada, como as outras: se ela falhar, o funil — que
  // e o motivo de a tela existir — continua abrindo.
  // >>> POR QUE ESTA TELA E NAO O ENCONTRAR: o sino mora aqui. E quem precisa saber que o indice
  //     esta velho e justamente quem esta montando o funil do mes, nao quem ja abriu a busca.
  try{
    const rk = await fetch(`${SB_URL}/rest/v1/coleta_status?fonte=eq.PNCP&select=ultima_ok,ultima_tentativa,ultimo_erro,ultimo_dia_ok`, {headers:SB_H});
    COLETA_SINO = rk.ok ? ((await rk.json())[0] || null) : 'erro';
  }catch(e){ COLETA_SINO = 'erro'; }
  // A CONFERÊNCIA MAIS NOVA DE CADA NEGÓCIO, pro selo do card. Vem ordenada da mais nova pra
  // mais velha e só a primeira de cada negócio entra — as anteriores continuam no banco, mas o
  // card mostra o estado de HOJE, não a história.
  try{
    const rq = await fetch(`${SB_URL}/rest/v1/negocio_conferencias`
      + '?select=negocio_id,acima,itens,quando,cmed_vigente_desde&order=quando.desc&limit=500', {headers:SB_H});
    CONF_POR_NEGOCIO = {};
    if(rq.ok) for(const c of await rq.json()) if(!CONF_POR_NEGOCIO[c.negocio_id]) CONF_POR_NEGOCIO[c.negocio_id] = c;
  }catch(e){ CONF_POR_NEGOCIO = {}; }   // sem selo é "não sei", e o card já não afirma nada
  const sel = document.getElementById('f-empresa');
  // O seletor e o badge de empresa FICAM VISÍVEIS mesmo com uma empresa só — decisão do
  // Lemuel em 05/08, corrigindo a minha recomendação de escondê-los. Igual ao SIGA.
  EMPRESAS.forEach(e => sel.insertAdjacentHTML('beforeend', `<option value="${e.id}">${esc(e.razao_social)}</option>`));
  pinta();
}

function visiveis(){
  const arq = document.getElementById('f-arquivados').checked;
  const emp = document.getElementById('f-empresa').value;
  const q = (document.getElementById('f-busca').value||'').trim().toLowerCase();
  let l = NEG.filter(n => arq ? true : !n.arquivado);
  if(emp) l = l.filter(n => String(n.empresa_id) === emp);
  if(FASE_SEL) l = l.filter(n => n.estagio === FASE_SEL);
  if(q) l = l.filter(n => [n.orgao,n.objeto,n.numero,n.municipio,n.portal].some(x => String(x||'').toLowerCase().includes(q)));
  const ord = document.getElementById('f-ordem').value;
  l.sort((a,b) => ord==='orgao' ? String(a.orgao||'').localeCompare(String(b.orgao||''))
                : ord==='abertura' ? String(a.abertura||'9').localeCompare(String(b.abertura||'9'))
                : String(b.abertura||'').localeCompare(String(a.abertura||'')));
  return l;
}

    document.getElementById('corpo').innerHTML =
