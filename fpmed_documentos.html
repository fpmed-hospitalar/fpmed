<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>LIMEDTEC — FPMED · Documentos</title>
<link rel="icon" type="image/png" sizes="192x192" href="icones/limedtec-192.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="cliente.config.js"></script>
<script src="limedtec-config.js"></script>
<script>LIMEDTEC.aplicaTema();</script>
<script src="limedtec-licenca.js"></script>
<!-- gm-auth: a lista de documentos é da empresa e a RLS exige sessão. Mesma regra das outras
     abas do portal — vendedor/propostas caem no "Sem permissão" de propósito. -->
<script src="gm-auth.js?v=sessao-06ago"></script>
<!-- ══ A FONTE ÚNICA DE ÍCONE (14/08, fatia B19) ══════════════════════════════════════════════
     Esta tela desenhava com EMOJI, e ela era a última das quatro do B que ainda fazia isso. O
     `fpmed_icones.js` existe no projeto desde 13/08 justamente porque o mesmo desenho começava a
     divergir entre telas; emoji é pior que isso: ele muda de desenho conforme o SISTEMA
     OPERACIONAL de quem abre, e não aceita a cor da marca. Duas pessoas olhando a mesma tela
     veem coisas diferentes, e nenhuma das duas está com defeito. -->
<script src="fpmed_icones.js"></script>
<style>
/* ══ ESTA TELA É UMA ILHA DE TEMA, E ISSO É DECISÃO DECLARADA — NÃO DESCUIDO ══════════════════
   Ela não carrega o `fpmed_tema.css`: tem paleta própria, escura, e o `testa_tema_tela_propria`
   guarda essa escolha com uma promessa simples de conferir — "nesta tela o tema do cliente NÃO
   ESCREVE NADA". O `limedtec-config.js` diz, por escrito, que a regra muda quando as 7 telas
   migrarem para `var(--lt-*)`, "e com teste novo". Então a fatia B19 NÃO migrou a paleta: isso
   é outra fatia, com o teste dela junto, e fazer pela metade quebraria a promessa que existe.
   O molde permite a ilha — com uma condição: *"desde que seja declarada como ilha, com as cores
   vindo dos mesmos tokens"*. É a condição que esta fatia cumpre: o `:root` abaixo é a fonte de
   cor DESTA ilha (o ofício que o `fpmed_tema.css` tem para o resto do sistema), e a tela passou
   a só USAR token, em vez de reescrever o valor no meio da regra.
   >>> OS TOKENS DE BAIXO DA LINHA ENTRARAM NESTA FATIA: eram 11 cores escritas à mão espalhadas
       pelas regras (sete `#fff`, o cinza do placeholder, o rosa e o âmbar dos selos, o cinza do
       título) e seis `rgba()` com o RGB digitado. Cor escrita dentro da regra não aparece em
       varredura de paleta — é assim que hex à mão sobrevive a auditoria (BASE 2.3).
   >>> A FORMA `rgba(var(--x-rgb), .13)` É A QUE O PRÓPRIO TEMA DA CASA PUBLICA para tom sobre
       fundo (lá é `--azul-500-rgb`). Ela não é um jeitinho: é o contrato que permite a mesma cor
       aparecer com véu sem ninguém redigitar o número. O que ela NÃO é: a rampa de tons
       declarados (50/100/300) que a BASE pede. Desenhar a rampa desta ilha é decisão de paleta,
       e vai declarada como pendência em vez de eu inventá-la aqui. */
:root{--azul:#2CA9E0;--azul-claro:#5CC3F0;--verde:#8DC63F;--muted:#8fa3b8;
  --bg:#0B1622;--painel:#132234;--painel2:#0F1B29;--linha:#1E3348;--texto:#DCE7F2;
  --vermelho:#e5675a;--ambar:#e0a04a;--topfaixa:#08111B;
  --branco:#fff;--titulo:#b3c4d6;--placeholder:#5f7590;
  --vermelho-claro:#ff9d92;--ambar-claro:#f0c483;
  --azul-rgb:44,169,224;--vermelho-rgb:229,103,90;--ambar-rgb:224,160,74;
  --verde-rgb:141,198,63;--sombra-rgb:0,0,0;
  --sombra:0 6px 22px rgba(var(--sombra-rgb),.28);
  /* ══ A ESCALA DE TEXTO DA ILHA, COM OS MESMOS VALORES DA CASA ═══════════════════════════════
     Ela entrou porque o aplicador do molde se RECUSOU a trabalhar aqui sem ela, e a recusa
     estava certa: `var(--txt-1)` numa tela que não carrega o `fpmed_tema.css` é um token que
     ninguém define. Em CSS isso não dá erro nem avisa — o `font-size` inteiro fica inválido e a
     letra volta ao padrão do navegador, 16px. Seriam seis tamanhos pequenos "consertados" para
     seis tamanhos GRANDES, com a régua atestando piso limpo porque não sobrou número abaixo de
     12. Os valores são copiados do `fpmed_tema.css` de propósito: enquanto a ilha existir, ela
     tem de dizer as mesmas coisas que a casa diz, e no dia da migração os nomes já batem. */
  --txt-0:10px;--txt-1:12px;--txt-2:14px;--txt-3:16px;--txt-4:20px;--txt-5:24px}
*{margin:0;padding:0;box-sizing:border-box}
/* ══ O TAMANHO DO ÍCONE, COPIADO PALAVRA POR PALAVRA DAS OUTRAS TELAS DO B ═══════════════════
   Sem esta regra o `<svg class="ic">` do sprite sai com o tamanho padrão de SVG do navegador —
   um retângulo de 300×150 no meio da faixa. Ela não é enfeite: é o que faz o sprite funcionar.
   >>> O TAMANHO É EM `em`, e não em px: o ícone cresce junto com o texto ao lado dele. Ícone
       que não acompanha a fonte fica pequeno demais no título e grande demais na etiqueta.
   >>> E O `stroke:currentColor` é o que permite o mesmo desenho sair branco no botão e cinza na
       faixa, sem uma segunda cor escrita em lugar nenhum — inclusive nesta ilha de tema. */
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:0 0 auto}

/* ══ O DEDO (14/08, fatia B19) ═══════════════════════════════════════════════════════════════
   Esta tela não tinha UMA media query — nenhuma, de nenhum tipo. Ela tem 5 botões, 9 campos e
   1 lista, e no celular entregava alvos de altura de ponteiro.
   >>> ELA NÃO TEM CAIXINHA DE MARCAR (contadas: zero) NEM BOTÃO SÓ DE ÍCONE (zero), então os
       dois casos perigosos do molde não aparecem aqui. O que ela tem é uma FILEIRA de filtros
       (`.barra`) e uma fita de abas no cabeçalho, e as duas são as causas de vazamento que o
       molde nomeia: linha `flex` que não quebra e peça que não encolhe.
   >>> A `.doc .dir` tem `white-space:nowrap` e `margin-left:auto`: no desktop ela empurra a data
       para a direita do cartão; a 390px ela vira a linha de baixo, senão o cartão inteiro sai
       pela direita levando o selo de "vencido" junto — e o selo é o que a tela existe para
       mostrar. */
@media(max-width:480px){
  .btn{min-height:44px}
  input,select{min-height:44px}
  /* a fileira de filtros quebra em vez de espremer, e o campo de busca para de se recusar a
     encolher (item de `flex` nasce `min-width:auto`, que é a causa que o molde nomeia) */
  .barra{flex-wrap:wrap}
  .barra input,.barra select{min-width:0;flex:1 1 100%}
  /* a fita do portal rola, em vez de empilhar seis abas e empurrar a tela para baixo da dobra */
  header nav.portal{overflow-x:auto;scrollbar-width:thin}
  header nav.portal a{white-space:nowrap;display:inline-flex;align-items:center;min-height:44px}
  /* o cartão do documento passa a ter duas linhas, com a data embaixo em vez de fora da tela */
  .doc .dir{margin-left:0;text-align:left;white-space:normal;width:100%}
  .grid{grid-template-columns:1fr}

  /* ══ O CAMINHO DE VOLTA, QUE SÓ O NAVEGADOR ACHOU (15/08, fatia B21) ══════════════════════
     A 390px de `documentElement.clientWidth`, este é o ÚNICO alvo desta tela abaixo do piso:
     `.topfaixa .faixa-int > a` ("← Sistema"), medido em **85,2 × 24,8px**. A regra acima resolve
     `.btn`, `input`, `select` e as abas do portal — e o caminho de volta não é nenhum dos quatro.
     >>> E ele é o alvo que MENOS pode falhar numa tela de celular: errar o "voltar" é a diferença
         entre sair da tela e ficar preso nela. Ele já tem `padding:4px 12px` e cara de pastilha;
         faltava a altura de dedo, e `min-height` em `<a>` inline não faz nada — por isso o
         `inline-flex` vem antes, que é a armadilha nomeada no molde. */
  .topfaixa a{display:inline-flex;align-items:center;min-height:44px}
}
body{background:var(--bg);color:var(--texto);font-family:'Inter',system-ui,Arial,sans-serif;min-height:100vh}
.faixa-int{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:12px}
.topfaixa{background:var(--topfaixa);color:var(--muted);padding:8px 0;font-size:12.5px}
.topfaixa a{color:var(--azul-claro);text-decoration:none;background:rgba(var(--azul-rgb),.13);padding:4px 12px;border-radius:20px}
header{background:var(--painel);border-bottom:1px solid var(--linha);padding:12px 0;box-shadow:var(--sombra)}
header h1{font-family:Montserrat;font-size:18px;margin:0;color:var(--branco);font-weight:700}
header .marca{display:flex;align-items:center;gap:8px}
header .cruz{width:30px;height:30px;border-radius:7px;background:var(--azul);display:grid;place-items:center;
  color:var(--branco);font-size:19px;font-weight:700;line-height:1;box-shadow:0 2px 10px rgba(var(--azul-rgb),.35)}
header .nome{font-family:Montserrat;font-weight:800;font-size:17px;color:var(--branco);letter-spacing:.6px}
/* ══ O "HOSPITALAR" DA MARCA É A EXCEÇÃO DECLARADA DO PISO — E ESTAVA ABAIXO ATÉ DELA ═════════
   Ele era `font-size:8px`. O aplicador do molde o levou para o piso de 12, e aí a marca deixa de
   encaixar: a segunda linha ficaria quase do tamanho do "FPMED" de cima.
   >>> O DEGRAU CERTO É O `--txt-0` (10px), QUE EXISTE PARA ISSO E TEM CONDIÇÃO. O tema da casa
       publica esse degrau com o ofício escrito ("rótulo de GRUPO, caixa alta e espaçado — nada
       mais"), e a catraca do A cobra a prova MEDÍVEL de que é sigla e não frase pequena: letra
       espaçada de pelo menos 0,1em. Aqui o espaçamento é 2,6px sobre 10px = 0,26em — passa com
       folga, e é o mesmo caso do wordmark do menu.
       Ou seja: 8px era furo até da exceção; 12px era conserto que estragava a marca; 10px com
       letra espaçada é a regra da casa aplicada como ela está escrita. */
       >>> E O ESPAÇAMENTO PASSOU DE `2.6px` PARA `.26em`, QUE É O MESMO VALOR NESTE TAMANHO —
       mas não é troca cosmética. Entreletra em `em` acompanha o corpo da fonte: se a marca
       crescer, o espaçamento cresce junto e a sigla continua sigla. Em `px` ela apertaria. E é
       também a forma que a catraca do A sabe ler (ela cobra a condição em `em`), o que resolve o
       último ponto em que as duas réguas do projeto discordavam sobre esta tela. */
header .nome small{display:block;font-size:var(--txt-0);letter-spacing:.26em;color:var(--muted);font-weight:600;margin-top:-4px}
header .sep{width:1px;height:22px;background:var(--linha);margin:0 4px}
/* a MESMA barra de portal das outras abas — se as telas são um lugar só, a barra é uma só */
header nav.portal{margin-left:auto;display:flex;gap:4px}
header nav.portal a{color:var(--muted);text-decoration:none;font-size:12.5px;padding:4px 12px;
  border-radius:8px;cursor:pointer;transition:background .16s,color .16s}
header nav.portal a:hover{background:var(--painel2);color:var(--texto)}
header nav.portal a.on{background:rgba(var(--azul-rgb),.16);color:var(--azul-claro);font-weight:600}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 64px}

/* ── A RÉGUA DE SITUAÇÃO ── é o coração da tela: quem está vencido, quem está vencendo ── */
.reguas{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.regua{background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:16px 16px}
.regua b{font-family:Montserrat;font-size:25px;display:block;line-height:1.15}
.regua span{font-size:var(--txt-1);color:var(--muted);letter-spacing:.2px}
.regua.vencido b{color:var(--vermelho)} .regua.vencendo b{color:var(--ambar)}
.regua.ok b{color:var(--verde)} .regua.total b{color:var(--branco)}
/* ══ O QUINTO CONTADOR ENTROU NA B25, E ELE JÁ ERA CALCULADO E JOGADO FORA ═══════════════════
   O `cont` sempre teve quatro chaves e o painel mostrava três delas mais o total: os documentos
   sem validade eram somados numa variável que ninguém lia. Isso fazia o painel não fechar a
   conta — vencidos + vencendo + em dia raramente dava o total, e a diferença não tinha nome na
   tela. Contador que não fecha ensina a não confiar no painel.
   >>> E A COR DELE É A DO TEXTO APAGADO DE PROPÓSITO: não é vermelho (não é problema agora) e
       NÃO PODE SER VERDE (verde é promessa, e a promessa aqui seria falsa — a tela não sabe se
       o documento não vence ou se alguém esqueceu de digitar a data). */
.regua.sem_validade b{color:var(--muted)}

.barra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
input,select{background:var(--painel2);color:var(--texto);border:1px solid var(--linha);
  border-radius:9px;padding:8px 12px;font-size:13px;font-family:inherit}
input::placeholder{color:var(--placeholder)}
.btn{background:var(--azul);color:var(--branco);border:0;border-radius:9px;padding:8px 16px;font-weight:600;
  font-size:13px;cursor:pointer;font-family:inherit}
.btn.sec{background:var(--painel2);color:var(--texto);border:1px solid var(--linha)}
.btn.mini{padding:4px 12px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.doc{background:var(--painel);border:1px solid var(--linha);border-left-width:4px;border-radius:12px;
  padding:12px 16px;margin-bottom:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.doc.vencido{border-left-color:var(--vermelho)}
.doc.vencendo{border-left-color:var(--ambar)}
.doc.ok{border-left-color:var(--verde)}
.doc.sem_validade{border-left-color:var(--linha)}
.doc .nome{font-size:14px;font-weight:600;color:var(--branco)}
.doc .sub{font-size:var(--txt-1);color:var(--muted);margin-top:4px}
.doc .dir{margin-left:auto;text-align:right;white-space:nowrap}
.selo{display:inline-block;padding:4px 8px;border-radius:20px;font-size:var(--txt-1);font-weight:700}
.selo.vencido{background:rgba(var(--vermelho-rgb),.18);color:var(--vermelho-claro)}
.selo.vencendo{background:rgba(var(--ambar-rgb),.18);color:var(--ambar-claro)}
.selo.ok{background:rgba(var(--verde-rgb),.16);color:var(--verde)}
.selo.sem_validade{background:var(--painel2);color:var(--muted)}
.hint{font-size:var(--txt-1);color:var(--muted)}
/* ══ A VERSÃO E O HISTÓRICO (B25) ════════════════════════════════════════════════════════════
   A etiqueta de versão fica NO CARTÃO, ao lado do nome, e não escondida atrás do histórico: a
   pergunta "esta é a certidão nova ou a que eu já tinha?" tem de ser respondida sem clique.
   >>> ELA SÓ APARECE DA VERSÃO 2 EM DIANTE. "versão 1" em todo cartão vira ruído em 100% da
       lista para informar 0% de nada — e o que interessa é justamente o cartão que TEM passado. */
.doc .versao{display:inline-block;margin-left:var(--esp-2);padding:0 var(--esp-2);border-radius:20px;
  font-size:var(--txt-1);font-weight:700;background:var(--painel2);color:var(--muted)}
/* O histórico nasce fechado e abre DENTRO do cartão, recuado. Abrir noutro lugar da tela (modal,
   painel lateral) faria a pessoa perder de vista de qual documento é o passado que ela está
   lendo — e é exatamente aí que se confunde a CND velha com a nova. */
.hist{margin:var(--esp-2) 0 var(--esp-1);padding-left:var(--esp-3);border-left:2px solid var(--linha);width:100%}
.hist .linha{display:flex;gap:var(--esp-2);align-items:center;flex-wrap:wrap;
  font-size:var(--txt-1);color:var(--muted);padding:var(--esp-1) 0}
.hist .linha b{color:var(--texto);font-weight:600}
/* O aviso de substituição precisa ser impossível de não ver: quem abriu o formulário por engano
   tem de perceber ANTES de salvar que está criando uma versão, e não um documento novo. */
.subst{background:rgba(var(--ambar-rgb),.13);border:1px solid var(--ambar);border-radius:9px;
  padding:var(--esp-2) var(--esp-3);margin-bottom:var(--esp-3);font-size:var(--txt-1);color:var(--ambar-claro)}
.aviso{background:var(--painel);border:1px dashed var(--linha);border-radius:12px;padding:24px;text-align:center;color:var(--muted)}
#form{display:none;background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:16px;margin-bottom:16px}
#form.open{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label{display:block;font-size:var(--txt-1);font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
</style>
</head>
<body>
<div class="topfaixa" data-limedtec-instalar>
  <div class="faixa-int">
    <a href="fpmed_sistema_final.html">← Sistema</a>
    <!-- o mesmo telefone que o limedtec-menu.js já desenha com `svg('telefone')` no rodapé:
         um número, um desenho, em toda tela do portal. -->
    <span><svg class="ic" aria-hidden="true"><use href="#ic-telefone"/></svg> (62) 3290-4241</span>
  </div>
</div>
<header>
  <div class="faixa-int">
    <!-- A CRUZ DA MARCA ERA O CARACTERE ✚ (U+271A). Não virou SVG: o `limedtec-menu.js` desenha
         esta mesma cruz, em toda tela do portal, como `<div class="lm-cruz">+</div>` — o mais
         ASCII dentro do quadrado azul. Copiar o que a casa já faz vale mais que inventar aqui um
         símbolo novo que só esta tela teria: a marca tem de ser a MESMA nas sete telas, e quem
         decide o desenho dela é o menu, não a aba de documentos. -->
    <div class="marca"><div class="cruz">+</div><div class="nome">FPMED<small>HOSPITALAR</small></div></div>
    <div class="sep"></div>
    <h1 style="font-weight:600;color:var(--titulo)">Documentos</h1>
    <nav class="portal">
      <a href="fpmed_licitacoes.html">Encontrar</a>
      <a href="fpmed_negocios.html">Negócios</a>
      <a class="on">Documentos</a>
      <a href="fpmed_declaracoes.html" title="Modelos de declaração de habilitação, preenchidos com os dados da empresa">Declarações</a>
      <a href="fpmed_pecas.html" title="Impugnação, esclarecimento, recurso e contrarrazões — com o prazo na frente">Peças</a>
      <a href="fpmed_conferidor.html" title="Confere o preço da proposta contra o teto legal da CMED">Conferir</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <!-- A RÉGUA VEM ANTES DA LISTA, e não depois: a pergunta que traz alguém aqui é "tem alguma
       certidão vencida?", não "quais documentos eu tenho". A lista responde a segunda. -->
  <div class="reguas" id="reguas"></div>

  <div class="barra">
    <input type="text" id="busca" placeholder="filtrar por nome, tipo ou órgão…" oninput="pinta()" style="min-width:260px">
    <select id="f-sit" onchange="pinta()">
      <option value="">Todas as situações</option>
      <option value="vencido">Só vencidos</option>
      <option value="vencendo">Só vencendo</option>
      <option value="ok">Só em dia</option>
    </select>
    <button class="btn" onclick="abrirForm()" id="bt-novo">+ Novo documento</button>
    <span class="hint" id="resumo"></span>
  </div>

  <div id="form">
    <!-- O aviso de que isto é uma SUBSTITUIÇÃO, e não um documento novo. Ele é escrito pelo
         `abrirSubstituicao()` e apagado pelo `fecharForm()`. -->
    <div class="subst" id="aviso-subst" style="display:none"></div>
    <div class="grid">
      <div><label>Nome do documento *</label><input type="text" id="f-nome" placeholder="ex.: CND Federal"></div>
      <!-- ══ O TIPO VIROU LISTA NA B25, E ERA CAMPO LIVRE ═══════════════════════════════════
           Campo livre num agrupador é como a mesma certidão vira três: "CND federal", "cnd
           Federal" e "Certidão Negativa Federal" convivem, o filtro por tipo passa a mentir, e
           quem confere a habilitação acha que falta um documento que está ali.
           >>> A LISTA É A DO DONO (ordem de obra aprovada), e ela termina em "outro" com campo
               aberto DE PROPÓSITO: lista fechada num país que inventa exigência de habilitação
               toda semana viraria a tela recusando um documento real. O "outro" é a válvula
               declarada — e ele obriga a escrever, em vez de deixar em branco. -->
      <div><label>Tipo</label>
        <select id="f-tipo" onchange="tipoMudou()" style="width:100%">
          <option value="">— escolha —</option>
          <option>CND Federal</option>
          <option>CND Estadual</option>
          <option>CND Municipal</option>
          <option>CRF FGTS</option>
          <option>CNDT Trabalhista</option>
          <option>Contrato Social</option>
          <option>Balanço Patrimonial</option>
          <option>Atestado de Capacidade Técnica</option>
          <option>Alvará</option>
          <option>Licença Sanitária</option>
          <option>AFE (Autorização de Funcionamento)</option>
          <option value="__outro">outro (escrever)…</option>
        </select>

      <!-- "em branco = não vence" era uma PROMESSA que esta tela não tem como cumprir: ela não
           sabe distinguir contrato social (que de fato não vence) de CND que alguém esqueceu de

      <div><label>Validade</label><input type="date" id="f-validade">
        <div class="hint" style="margin-top:4px">em branco = validade não informada (e aí ele não avisa ninguém)</div></div>
      <!-- POR DOCUMENTO, e não um número fixo: certidão federal sai em minutos, alvará da

      <div><label>Avisar quantos dias antes</label><input type="number" id="f-aviso" value="30" min="0" max="365"></div>
      <div><label>Arquivo (PDF ou imagem, até 20 MB)</label><input type="file" id="f-arq" accept=".pdf,image/*"></div>

<script>
const SB_URL = 'https://xzdowrksuswekwffoluk.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6ZG93cmtzdXN3ZWt3ZmZvbHVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NzE2MTMsImV4cCI6MjEwMDI0NzYxM30.Pk-SlV_pZdniESyrajDdfHdHcnmyCwCMtP_TrShh75Y';
const SB_H  = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };
const SB_HW = Object.assign({'Content-Type':'application/json'}, SB_H);

/* ══ O COFRE DE ARQUIVOS TEM DUAS TRAVAS, E ESTA TELA ESBARRAVA NAS DUAS ═══════════════════
   MEDIDO EM 14/08 (fatia B16), no cofre de verdade, com sessão de verdade:
     crachá anon   + application/pdf   ->  HTTP 400 {"statusCode":"403","new row violates row-level security policy"}
     crachá sessão + application/json  ->  HTTP 400 {"statusCode":"415","invalid_mime_type"}
     crachá sessão + application/pdf   ->  HTTP 200
   >>> TRAVA 1 — O CRACHÁ. O `gm-auth.js` troca o crachá pelo da sessão SÓ nas chamadas de
       `/rest/v1/`; o envio de arquivo vai para `/storage/v1/`, e ia com a chave `anon`. A policy
       do cofre (`docs_storage_sobe`) exige `authenticated` + `cargo_gestor()`. Então o envio era
       recusado ANTES de o tipo sequer ser olhado.
   >>> TRAVA 2 — O TIPO. É a mesma da B15: o cofre valida o formato pelo `Content-Type`, e o
       cabeçalho do REST (`application/json`) não é formato de arquivo nenhum.
   >>> ENTÃO NENHUM "Salvar documento" COM ARQUIVO DESTA TELA FUNCIONAVA — e o "abrir arquivo"
       também não, porque assinar a URL passa pela mesma porta e pela mesma policy. A prova de
       que ninguém tinha conseguido é o próprio banco: `documentos` estava com ZERO linhas.
   >>> POR QUE NENHUMA SUÍTE PEGOU: elas leem o código-fonte, e o código-fonte "manda o arquivo".
       Quem sabia a verdade era o cofre, e ninguém tinha perguntado a ele. */
function tokenDaSessao(){
  // A sessão do gm-auth mora aqui. Ler daqui (em vez de esperar o gmAuth expor o token) mantém
  // o conserto dentro desta tela — o gm-auth é compartilhado com todo o portal.
  try{ const s = JSON.parse(localStorage.getItem('gm_session') || 'null'); return (s && s.access_token) || null; }
  catch(e){ return null; }
}
function cabecalhoCofre(tipo){
  const tk = tokenDaSessao();
  const h = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + (tk || SB_KEY) };
  if(tipo) h['Content-Type'] = tipo;
  return h;
}
/* E O TIPO CONTINUA SENDO DECIDIDO PELO SERVIDOR. Esta tela não guarda uma lista de formatos
   aceitos: ela manda o tipo certo e TRADUZ a recusa. Uma segunda lista aqui um dia discordaria
   da do cofre — e a tela recusaria um arquivo que o cofre aceita, ou prometeria um que ele
   recusa. Mesma decisão da B15, para que as duas telas envelheçam juntas. */
const MIME_POR_EXT = { pdf:'application/pdf', png:'image/png', jpg:'image/jpeg',
                       jpeg:'image/jpeg', webp:'image/webp' };
function tipoDoArquivo(arq){
  // O navegador quase sempre sabe; quando ele não sabe (extensão que o sistema não conhece), a
  // extensão do nome é o melhor palpite honesto — e se estiver errado, quem recusa é o cofre.
  const doNavegador = String((arq && arq.type) || '').trim();
  if(doNavegador) return doNavegador;
  const ext = String((arq && arq.name) || '').toLowerCase().split('.').pop();
  return MIME_POR_EXT[ext] || 'application/octet-stream';
}
// A RECUSA DO COFRE TEM QUE DIZER O QUE FAZER. "HTTP 400" manda a pessoa chamar suporte; "o
// cofre guarda PDF e imagem" manda ela converter o arquivo e seguir sozinha.
function traduzRecusaDoCofre(status, corpo, tipo){
  const t = String(corpo || '');
  if(/invalid_mime_type|415/.test(t))
    return 'o cofre de arquivos não aceita este formato (' + tipo + ') — ele guarda PDF e imagem '
         + '(PNG, JPEG, WEBP). Converta para PDF e mande de novo.';
  if(status === 413 || /exceeded the maximum|413/.test(t))
    return 'o arquivo passou do tamanho que o cofre aceita (20 MB)';
  // O 403 do cofre vem NO CORPO, não no status HTTP: ele responde 400 com {"statusCode":"403"}.
  // Ler só o status fazia a recusa por permissão virar um "HTTP 400" que não ensina nada.
  if(status === 403 || /row-level security|"403"/.test(t))
    return 'só gestor pode enviar arquivo — entre com uma conta de diretor ou gerente';
  if(status === 401 || /JWT|expired/i.test(t))
    return 'sua sessão expirou — recarregue a página e entre de novo';
  return 'não consegui enviar o arquivo (HTTP ' + status + ')';
}

const esc = s => String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
/* ══ O CAMINHO DO ARQUIVO VAI DENTRO DE UM `onclick`, E ISSO PEDE DOIS ESCAPES, NÃO UM ════════
   O `esc()` cuida do HTML (o atributo é delimitado por aspas duplas). Mas o que está DENTRO do
   atributo é código JavaScript com uma string de aspas simples — e uma aspa simples ou uma barra
   invertida no nome do arquivo fecharia essa string e o resto viraria código.
   >>> HOJE O `salvar()` já lava o nome (`[^a-z0-9._-]` vira hífen), então não existe caminho
       perigoso no cofre. Isto aqui é para o dia em que um caminho entrar por outra porta — e
       depender de uma limpeza feita em OUTRA função, cem linhas acima, é a forma de defeito que
       sobrevive a toda revisão. Escapa-se onde se usa. */
const jsq = s => esc(String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));

/* ══ O CAMINHO DO ARQUIVO NA URL SE ESCAPA POR PEDAÇO, E NÃO INTEIRO (B25) ═══════════════════
   MEDIDO EM 19/08, no cofre de verdade, com sessão de verdade, num arquivo em pasta:
     encodeURIComponent(caminho inteiro)  ->  assinar HTTP 200, e a URL assinada volta com `%2F`
                                              ->  BAIXAR HTTP 400. O arquivo some sem erro nenhum.
     caminho.split('/').map(encodeURIComponent).join('/')  ->  assinar 200, baixar 200, 207 bytes.
   A causa é de uma linha: `encodeURIComponent` escapa a BARRA, que é o separador do caminho. O
   cofre aceita, guarda, e devolve a URL assinada com o `%2F` dentro — e aí a própria URL que ele
   assinou não abre. Assinar responde 200 e mente: quem falha é o download, depois.
   >>> HOJE ISSO AINDA NÃO MORDE, e é justamente por isso que ele merecia conserto agora: o
       `salvar()` monta o caminho como `<hora>-<nome lavado>`, sem pasta nenhuma. No dia em que
       alguém organizar o cofre por empresa ou por ano — que é o passo seguinte óbvio de um cofre
       de certidões — TODO "abrir arquivo" passaria a dar 400 e a certidão pareceria perdida.
       Defeito que dorme esperando uma pasta é pior que defeito que aparece hoje. */
const caminhoNaUrl = p => String(p==null?'':p).split('/').map(encodeURIComponent).join('/');
const semAcento = s => { let o=''; for(const c of String(s||'').normalize('NFD')){ const k=c.codePointAt(0); if(k>=0x300&&k<=0x36f) continue; o+=c; } return o.toLowerCase(); };
const brData = s => s ? s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4) : '—';

let DOCS = null, ERRO = null;

/* ══ A CONTA DO PAINEL É PURA, E POR ISSO DÁ PARA CONFERIR CONTRA O BANCO ════════════════════
   Ela estava embutida no meio do `pinta()`, cercada de `innerHTML` — ou seja, só era possível
   conferi-la abrindo a tela e olhando. Fora dali, ela é uma função que recebe uma lista e
   devolve quatro números, e a `tools/prova_cofre_certidoes.js` ARRANCA esta função do arquivo e
   roda a MESMA conta contra o `group by situacao` do Postgres. Se um dia a tela e o banco
   discordarem, a prova reprova — em vez de alguém descobrir olhando.
   >>> AS QUATRO CHAVES NASCEM EM ZERO DE PROPÓSITO. Se elas nascessem do dado, um estado sem
       nenhum documento sumiria do painel em vez de mostrar "0" — e "0 vencidos" é a resposta
       mais importante que esta tela dá. Ausência não é a mesma coisa que zero. */
function contaSituacoes(docs){
  const c = { vencido:0, vencendo:0, ok:0, sem_validade:0 };
  (docs||[]).forEach(d => { if(c[d.situacao] !== undefined) c[d.situacao]++; });
  return c;
}

// A CONTA DE DIAS NÃO É REFEITA AQUI: ela vem da view `v_documentos_situacao`. Se a tela
// calculasse por conta própria, um dia ela diria "vence em 5" e o sino diria "vencido" — e foi
// exatamente esse tipo de divergência (duas implementações da mesma regra) que já custou caro
// neste projeto no preço unitário.
async function carregar(){
  try{
    const r = await fetch(`${SB_URL}/rest/v1/v_documentos_situacao?select=*&order=validade.asc.nullslast`, {headers:SB_H});
    if(!r.ok){
      const t = await r.text();
      throw new Error(r.status===401||r.status===403 ? 'sua sessão expirou ou não tem permissão' : ('HTTP '+r.status+' '+t.slice(0,70)));
    }
    DOCS = await r.json(); ERRO = null;
  }catch(e){ DOCS = null; ERRO = e.message; }
  pinta();
}

function pinta(){
  const lista = document.getElementById('lista'), reg = document.getElementById('reguas');
  // >>> ERRO NÃO PODE VIRAR LISTA VAZIA. "Nenhum documento cadastrado" com o banco fora faria
  //     alguém concluir que a empresa não tem certidão nenhuma. Diz o que houve.
  if(ERRO){
    reg.innerHTML = '';
    lista.innerHTML = '<div class="aviso" style="border-color:var(--vermelho);color:var(--vermelho-claro)">'
      + '<svg class="ic" aria-hidden="true"><use href="#ic-alerta"/></svg> Não consegui ler os documentos: '+esc(ERRO)
      + '<div style="margin-top:12px"><button class="btn" onclick="carregar()">Tentar de novo</button></div></div>';
    document.getElementById('resumo').textContent = '';
    return;
  }
  if(!DOCS){ lista.innerHTML = '<div class="aviso">carregando…</div>'; return; }

  const cont = contaSituacoes(DOCS);
  // >>> OS QUATRO CONTADORES FECHAM COM O TOTAL, E ISSO É CONFERÍVEL A OLHO. Antes da B25 o
  //     painel mostrava três dos quatro estados: os sem validade sumiam da soma e reapareciam
  //     só no total, como uma diferença sem nome. Painel que não fecha a conta é painel que a
  //     pessoa para de conferir — e aí ele pode errar sem ninguém notar.
  reg.innerHTML =
      '<div class="regua vencido"><b>'+cont.vencido+'</b><span>vencidos</span></div>'
    + '<div class="regua vencendo"><b>'+cont.vencendo+'</b><span>vencendo (dentro do aviso)</span></div>'
    + '<div class="regua ok"><b>'+cont.ok+'</b><span>em dia</span></div>'
    + '<div class="regua sem_validade"><b>'+cont.sem_validade+'</b><span>sem validade informada</span></div>'
    + '<div class="regua total"><b>'+DOCS.length+'</b><span>documentos cadastrados</span></div>';

  const q = semAcento(document.getElementById('busca').value.trim());
  const sit = document.getElementById('f-sit').value;
  const vis = DOCS.filter(d => {
    if(sit && d.situacao !== sit) return false;
    if(!q) return true;
    return semAcento([d.nome,d.tipo,d.orgao_emissor,d.numero].filter(Boolean).join(' ')).includes(q);
  });
  document.getElementById('resumo').textContent = vis.length===DOCS.length
    ? '' : (vis.length + ' de ' + DOCS.length + ' documentos');

  if(!DOCS.length){
    lista.innerHTML = '<div class="aviso">Nenhum documento cadastrado ainda.<br>'
      + '<span class="hint">Comece pelas certidões que todo edital pede: CND Federal, FGTS, Trabalhista e Estadual.</span></div>';
    return;
  }
  if(!vis.length){ lista.innerHTML = '<div class="aviso">Nenhum documento bate com o filtro.</div>'; return; }

  // "SEM VALIDADE" dizia que o documento não vence. "VALIDADE NÃO INFORMADA" diz o que a tela
  // realmente sabe: que ninguém digitou a data. A diferença entre as duas é a diferença entre
  // uma promessa e um fato — e a promessa é falsa em toda CND que alguém cadastrou com pressa.
  const rotulo = { vencido:'VENCIDO', vencendo:'VENCE EM BREVE', ok:'EM DIA', sem_validade:'VALIDADE NÃO INFORMADA' };
  lista.innerHTML = vis.map(d => {
    const dias = d.dias_para_vencer;
    const quando = d.situacao==='sem_validade' ? 'validade não informada — este documento não avisa ninguém'
      : d.situacao==='vencido' ? ('venceu em '+brData(d.validade)+' — há '+Math.abs(dias)+' dia(s)')
      : ('vence em '+brData(d.validade)+' — em '+dias+' dia(s)');
    // `versoes_anteriores` vem da view (contagem recursiva no banco). A tela NÃO percorre a
    // corrente para contar: seria a segunda implementação da mesma regra, que é a família de
    // defeito mais cara deste projeto.
    const anteriores = Number(d.versoes_anteriores || 0);
    return '<div class="doc '+d.situacao+'" id="doc-'+d.id+'">'
      + '<div><div class="nome">'+esc(d.nome)
      +     (d.versao > 1 ? '<span class="versao">versão '+d.versao+'</span>' : '')+'</div>'
      +   '<div class="sub">'+[d.tipo, d.orgao_emissor, d.numero?('nº '+d.numero):null].filter(Boolean).map(esc).join(' · ')
      +     (d.emissao?' · emitido em '+brData(d.emissao):'')+'</div>'
      +   '<div class="sub">'+esc(quando)+' · avisa '+d.dias_aviso+' dias antes</div></div>'
      + '<div class="dir"><span class="selo '+d.situacao+'">'+rotulo[d.situacao]+'</span>'
      +   (d.arquivo_path ? ' <button class="btn sec mini" onclick="abrirArquivo(\''+jsq(d.arquivo_path)+'\')">abrir arquivo</button>' : '')
      +   ' <button class="btn sec mini" onclick="abrirSubstituicao('+d.id+')">substituir</button>'
      +   (anteriores ? ' <button class="btn sec mini" onclick="verHistorico('+d.id+')">histórico ('+anteriores+')</button>' : '')
      + '</div>'
      + '<div class="hist" id="hist-'+d.id+'" style="display:none"></div>'
      + '</div>';
  }).join('');
}

function tipoMudou(){
  const s = document.getElementById('f-tipo'), o = document.getElementById('f-tipo-outro');
  o.style.display = s.value === '__outro' ? '' : 'none';
  if(s.value === '__outro') o.focus(); else o.value = '';
}
// O tipo que vai para o banco: a escolha da lista, ou o que a pessoa escreveu em "outro".
function tipoEscolhido(){
  const s = document.getElementById('f-tipo').value;
  if(s === '__outro') return document.getElementById('f-tipo-outro').value.trim() || null;
  return s || null;
}
// O caminho inverso: pôr um tipo GRAVADO de volta no formulário. Um tipo antigo que não está na
// lista (os cadastrados antes da B25 são texto livre) não pode sumir na substituição — ele cai
// em "outro" com o texto original, e quem substitui decide se troca pelo nome canônico.
function poeTipo(valor){
  const s = document.getElementById('f-tipo'), o = document.getElementById('f-tipo-outro');
  const v = String(valor == null ? '' : valor);
  const naLista = [...s.options].some(op => op.value === v || op.text === v);
  if(v && naLista){ s.value = v; o.value=''; o.style.display='none'; }
  else if(v){ s.value = '__outro'; o.value = v; o.style.display = ''; }
  else { s.value = ''; o.value=''; o.style.display='none'; }
}

/* ══ SUBSTITUIR NÃO É EDITAR, E O COFRE GUARDA OS DOIS FATOS ══════════════════════════════════
   Editar diz "eu errei o que estava escrito". Substituir diz "aquela certidão valeu até aqui,
   esta vale daqui". São fatos diferentes sobre o mundo.
   >>> E O PASSADO PRECISA FICAR INTEIRO PORQUE ELE AINDA SERVE: a CND que valia NO DIA DA SESSÃO
       é a que habilita. Se em outubro o órgão pedir a certidão que estava válida em agosto e o
       cofre só tiver a mais recente, a empresa perde um recurso que ela ganharia. Sobrescrever o
       arquivo antigo é apagar prova de habilitação. */
let SUBSTITUINDO = null;   // o documento que esta gravação vai aposentar (null = documento novo)

function abrirForm(){ document.getElementById('form').classList.add('open'); document.getElementById('f-nome').focus(); }
function fecharForm(){
  document.getElementById('form').classList.remove('open');
  document.getElementById('msg-form').textContent='';
  // Sair do formulário SEMPRE apaga a substituição pendente. Deixá-la de pé faria o próximo
  // "+ Novo documento" aposentar em silêncio um documento que ninguém mandou aposentar.
  SUBSTITUINDO = null;
  document.getElementById('aviso-subst').style.display = 'none';
  document.getElementById('bt-salvar').textContent = 'Salvar documento';
}

function abrirSubstituicao(id){
  const d = (DOCS||[]).find(x => x.id === id); if(!d) return;
  SUBSTITUINDO = d;
  /* O QUE SE COPIA E O QUE NÃO SE COPIA — a lista é a regra:
     copia-se o que IDENTIFICA o documento (nome, tipo, órgão, e a antecedência de aviso que
     alguém já pensou uma vez para ESTE documento); NÃO se copia o que muda de uma via para a
     outra (número, emissão, validade, arquivo). Herdar a validade antiga seria o pior defeito
     possível aqui: a versão nova nasceria com a data da velha e a tela diria "em dia". */
  document.getElementById('f-nome').value   = d.nome || '';
  poeTipo(d.tipo);
  document.getElementById('f-orgao').value  = d.orgao_emissor || '';
  document.getElementById('f-aviso').value  = d.dias_aviso == null ? 30 : d.dias_aviso;
  ['f-numero','f-emissao','f-validade','f-arq'].forEach(i => document.getElementById(i).value = '');
  const av = document.getElementById('aviso-subst');
  av.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#ic-alerta"/></svg> '
    + 'Substituindo a <b>versão ' + d.versao + '</b> de «' + esc(d.nome) + '». '
    + 'A via anterior sai da lista e vai para o histórico — ela <b>não é apagada</b>, '
    + 'e o arquivo dela continua no cofre.';
  av.style.display = '';
  document.getElementById('bt-salvar').textContent = 'Gravar a versão ' + (d.versao + 1);
  abrirForm();
  document.getElementById('f-validade').focus();   // é o campo que MUDA numa via nova
}

/* O histórico é UMA consulta e é lido de trás para frente pela corrente `substitui_id`. A view
   `v_documentos_historico` é a única que enxerga quem já saiu de cena (a da tela filtra `ativo`),
   e ela não filtra nada — por isso a corrente é percorrida aqui, com o dado na mão. */
function verHistorico(id){
  const caixa = document.getElementById('hist-'+id); if(!caixa) return;
  if(caixa.style.display !== 'none'){ caixa.style.display='none'; return; }
  caixa.style.display = '';
  carregaHistorico(id);
}
// Abrir e LER são duas coisas: o "tentar de novo" da falha precisa reler sem fechar a gaveta.
async function carregaHistorico(id){
  const caixa = document.getElementById('hist-'+id); if(!caixa) return;
  caixa.innerHTML = '<div class="linha">lendo o histórico…</div>';
  try{
    const r = await fetch(`${SB_URL}/rest/v1/v_documentos_historico?select=*`, {headers:SB_H});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const todos = await r.json();
    const porId = new Map(todos.map(x => [x.id, x]));
    const corrente = [];
    let atual = porId.get(id);
    // >>> A TRAVA DE VOLTA NÃO É PARANOIA: `substitui_id` é uma coluna, e coluna aceita ciclo.
    //     Um ciclo aqui travaria a aba do navegador em silêncio — a tela inteira, por causa de
    //     um clique num botão de histórico.
    const vistos = new Set();
    while(atual && atual.substitui_id != null && !vistos.has(atual.substitui_id)){
      vistos.add(atual.substitui_id);
      atual = porId.get(atual.substitui_id);
      if(atual) corrente.push(atual);
    }
    if(!corrente.length){ caixa.innerHTML = '<div class="linha">sem versões anteriores.</div>'; return; }
    caixa.innerHTML = corrente.map(v =>
      '<div class="linha"><b>versão '+v.versao+'</b> · '
      + (v.validade ? 'valia até '+brData(v.validade) : 'validade não informada')
      + (v.substituido_em ? ' · substituída em '+brData(String(v.substituido_em).slice(0,10)) : '')
      + (v.numero ? ' · nº '+esc(v.numero) : '')
      + (v.arquivo_path ? ' <button class="btn sec mini" onclick="abrirArquivo(\''+jsq(v.arquivo_path)+'\')">abrir arquivo</button>' : '')
      + '</div>').join('');
  }catch(e){
    // Mesma lei da lista: falha de leitura NÃO pode virar "não há histórico".
    caixa.innerHTML = '<div class="linha">não consegui ler o histórico ('+esc(e.message)+') — '
      + '<button class="btn sec mini" onclick="carregaHistorico('+id+')">tentar de novo</button></div>';
  }
}

async function salvar(){
  const msg = document.getElementById('msg-form'), bt = document.getElementById('bt-salvar');
  const nome = document.getElementById('f-nome').value.trim();
  if(!nome){ msg.textContent = 'O nome do documento é obrigatório.'; return; }
  bt.disabled = true; msg.textContent = 'salvando…';
  try{
    const arq = document.getElementById('f-arq').files[0];
    let path = null, bytes = null, arqNome = null;
    if(arq){
      // caminho sem acento e sem espaço: nome de arquivo com caractere estranho quebra a URL
      // assinada na hora de baixar, e o erro só aparece meses depois, na hora de precisar.
      const limpo = semAcento(arq.name).replace(/[^a-z0-9._-]+/g,'-');
      path = Date.now() + '-' + limpo;
      msg.textContent = 'enviando o arquivo…';
      const tipo = tipoDoArquivo(arq);
      const up = await fetch(`${SB_URL}/storage/v1/object/documentos/${caminhoNaUrl(path)}`, {
        method:'POST', headers: cabecalhoCofre(tipo), body: arq });
      if(!up.ok){
        const t = await up.text().catch(() => '');
        throw new Error(traduzRecusaDoCofre(up.status, t, tipo));
      }
      bytes = arq.size; arqNome = arq.name;
    }
    const velho = SUBSTITUINDO;
    const corpo = {
      nome, tipo: tipoEscolhido(),
      orgao_emissor: document.getElementById('f-orgao').value.trim() || null,
      numero: document.getElementById('f-numero').value.trim() || null,
      emissao: document.getElementById('f-emissao').value || null,
      validade: document.getElementById('f-validade').value || null,
      dias_aviso: parseInt(document.getElementById('f-aviso').value || '30', 10),
      arquivo_path: path, arquivo_nome: arqNome, arquivo_bytes: bytes,
      substitui_id: velho ? velho.id : null,
      versao: velho ? (velho.versao || 1) + 1 : 1,
    };
    const r = await fetch(`${SB_URL}/rest/v1/documentos`, {method:'POST',
      headers: Object.assign({'Prefer':'return=representation'}, SB_HW), body: JSON.stringify(corpo)});
    if(!r.ok){
      const t = await r.text();
      throw new Error(r.status===401||r.status===403 ? 'só gestor pode cadastrar documento' : ('HTTP '+r.status+' '+t.slice(0,70)));
    }
    /* ══ A ORDEM DAS DUAS GRAVAÇÕES É A DECISÃO, E ELA TEM UM LADO SEGURO ═══════════════════
       Primeiro NASCE a via nova; só depois a velha sai de cena. Se a segunda chamada falhar (a
       rede cai entre uma e outra), a lista fica com DUAS vias do mesmo documento — feio, e
       visível na hora, e consertável com um clique em "substituir". Na ordem inversa a falha
       deixaria ZERO: a certidão que valia teria saído da lista e a nova nunca teria nascido, e
       ninguém veria nada — o painel diria "3 em dia" com uma certidão a menos. Entre um defeito
       que grita e um que se esconde, escolhe-se o que grita. */
    if(velho){
      const up = await fetch(`${SB_URL}/rest/v1/documentos?id=eq.${velho.id}`, {method:'PATCH',
        headers: SB_HW, body: JSON.stringify({ ativo:false, substituido_em:new Date().toISOString(),
                                               atualizado_em:new Date().toISOString() })});
      if(!up.ok){
        const t = await up.text();
        // A versão nova JÁ ESTÁ GRAVADA — dizer "não consegui salvar" aqui seria mentira, e a
        // pessoa mandaria de novo, criando uma terceira via. A mensagem diz o que ficou pela
        // metade e o que fazer.
        await carregar();
        throw new Error('a versão nova foi gravada, mas a anterior NÃO saiu da lista (HTTP '
          + up.status + ' ' + t.slice(0,60) + '). As duas estão aparecendo — clique em '
          + '"substituir" na antiga para tentar de novo.');
      }
    }
    ['f-nome','f-orgao','f-numero','f-emissao','f-validade','f-arq'].forEach(id=>document.getElementById(id).value='');
    poeTipo('');
    document.getElementById('f-aviso').value = 30;
    fecharForm();
    await carregar();
  // >>> DE `textContent` PARA `innerHTML`, E O `esc()` É O QUE TORNA ISSO SEGURO. O símbolo de
  //     aviso virou o desenho do sprite, e desenho não cabe em `textContent`. A troca só é
  //     honesta acompanhada do escape: a mensagem vem de `e.message`, ou seja do SERVIDOR, e
  //     texto de terceiro caindo em `innerHTML` sem escapar é como marcação alheia vira marcação
  //     nossa. O `esc()` é o mesmo que esta tela já usa no aviso da lista, quinze linhas acima.
  }catch(e){ msg.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#ic-alerta"/></svg> ' + esc(e.message); }
  bt.disabled = false;
}

// URL ASSINADA e não pública: o bucket é privado de propósito. O link vale 60 segundos, que é
// o tempo de abrir — link de certidão que vale para sempre é link que vaza.
// >>> AQUI O `Content-Type: application/json` ESTÁ CERTO (o corpo é JSON de verdade, não é um
//     arquivo); o que estava errado era o CRACHÁ: assinar é `/storage/v1/`, que o gm-auth não
//     toca, e a policy `docs_storage_le` exige sessão. Medido: anon -> 400/403, sessão -> 200.
// >>> ELE PASSOU A RECEBER O CAMINHO, E NÃO O `id` (B25). O botão do histórico abre a via
//     ANTIGA, que por definição não está na lista `DOCS` — procurar por id ali devolveria
//     `undefined` e o botão não faria nada, em silêncio, que é o defeito que a testa_icones
//     chama de "botão que não faz nada" na versão invisível dele.
async function abrirArquivo(caminho){
  if(!caminho) return;
  try{
    const r = await fetch(`${SB_URL}/storage/v1/object/sign/documentos/${caminhoNaUrl(caminho)}`, {
      method:'POST', headers: cabecalhoCofre('application/json'), body: JSON.stringify({ expiresIn: 60 }) });
    if(!r.ok) throw new Error(traduzRecusaDoCofre(r.status, await r.text().catch(()=>''), 'application/json'));
    const j = await r.json();
    window.open(SB_URL + '/storage/v1' + j.signedURL, '_blank', 'noopener');
  }catch(e){ alert('Não consegui abrir o arquivo: ' + e.message); }
}

// CORRIDA COM O gm-auth — a mesma lição de 05/08 e a raiz das travadas de 07/08: o boot() dele
// é assíncrono quando o token precisa ser renovado, e pedir dados antes disso manda a consulta
// como `anon`, que a RLS não atende.
let _iniciado = false;
function iniciar(){ if(_iniciado) return; _iniciado = true; carregar(); }
if(window.gmAuth) iniciar();
else { document.addEventListener('gm-auth-ready', iniciar, { once:true }); setTimeout(iniciar, 12000); }
</script>
