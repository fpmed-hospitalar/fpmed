# ══════════════════════════════════════════════════════════════════════════════════════════
# COLETA DO PNCP — agendamento (item 10, FPMED)
#
# Chama a edge function `coletar-licitacoes` 3x por dia. Quem grava no banco é ELA, não este
# workflow: o repositório é PÚBLICO e a `service_role` ignora toda a RLS, então a chave-mestra
# do banco NUNCA entra num pipeline. Aqui só existe o `COLETA_TOKEN` — um segredo DEDICADO e
# DESCARTÁVEL, cujo poder é exatamente um: mandar gravar licitação pública.
#
# >>> SE ESTE SEGREDO VAZAR: rotacionar é apagar a linha COLETA_TOKEN do segredos.local.txt,
#     rodar `node tools/deploy_edge.js --gera-token`, depois `--segredo COLETA_TOKEN`, e trocar
#     o secret aqui no GitHub. O banco não precisa ser tocado.
#
# ⚠️ PRÉ-CONDIÇÃO (é o Lemuel quem faz, uma vez): GitHub → repo `fpmed-hospitalar/fpmed` →
#    Settings → Secrets and variables → Actions → New repository secret
#      nome:  COLETA_TOKEN
#      valor: a linha COLETA_TOKEN do segredos.local.txt
#    Sem isso o job para na primeira linha com mensagem clara, em vez de falhar sem explicação.
# ══════════════════════════════════════════════════════════════════════════════════════════
name: Coleta PNCP

on:
  schedule:
    # Horários em UTC. Goiás é UTC−3 → 06h, 12h e 18h no horário de lá.
    # Manhã (antes do expediente), meio-dia e fim de tarde: publicação de edital sai no
    # horário comercial, então 3 janelas cobrem o dia sem virar coleta de madrugada à toa.
    - cron: '0 9,15,21 * * *'
  workflow_dispatch:
    inputs:
      dias:
        description: 'Janela em dias (vazio = incremental desde a última coleta OK)'
        required: false
        default: ''
      ufs:
        description: 'UFs separadas por vírgula (vazio = GO,DF,MG,MT,MS,TO,BA)'
        required: false
        default: ''

permissions:
  contents: read          # o workflow nao escreve nada no repositorio
  actions:  read          # so PRA LER o historico de rodadas (o alarme de 2 falhas seguidas)

concurrency:
  group: coleta-pncp
  cancel-in-progress: false   # duas coletas sobrepostas só fariam o PNCP nos limitar mais

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Conferir o segredo
        env:
          COLETA_TOKEN: ${{ secrets.COLETA_TOKEN }}
        run: |
          if [ -z "$COLETA_TOKEN" ]; then
            echo "::error::Falta o secret COLETA_TOKEN no repositório (Settings → Secrets → Actions)."
            echo "Como gerar: node tools/deploy_edge.js --gera-token  →  --segredo COLETA_TOKEN"
            exit 1
          fi

      - name: Chamar a edge function
        env:
          COLETA_TOKEN: ${{ secrets.COLETA_TOKEN }}
          DIAS: ${{ github.event.inputs.dias }}
          UFS: ${{ github.event.inputs.ufs }}
        run: |
          set -euo pipefail
          BODY='{}'
          # if/fi, não `[ ... ] && ...`: com `set -e` um teste falso derruba o passo inteiro.
          if [ -n "${DIAS:-}" ]; then BODY=$(echo "$BODY" | jq --argjson d "$DIAS" '. + {dias:$d}'); fi
          if [ -n "${UFS:-}"  ]; then BODY=$(echo "$BODY" | jq --arg u "$UFS" '. + {ufs:$u}'); fi
          echo "corpo: $BODY"

          # --max-time 540: a função tem orçamento próprio de ~100s e para sozinha; este é o
          # cinto de segurança do lado de cá, pra um socket pendurado não segurar o runner.
          HTTP=$(curl -sS -o resposta.json -w '%{http_code}' --max-time 540 \
            -X POST 'https://xzdowrksuswekwffoluk.supabase.co/functions/v1/coletar-licitacoes' \
            -H 'Content-Type: application/json' \
            -H "x-coleta-token: $COLETA_TOKEN" \
            -d "$BODY")

          echo "HTTP $HTTP"; cat resposta.json; echo

          # HTTP != 200 é problema NOSSO (função fora, token errado, projeto pausado) → falha.
          if [ "$HTTP" != "200" ]; then
            echo "::error::A edge function respondeu HTTP $HTTP"
            exit 1
          fi

          OK=$(jq -r '.ok' resposta.json)
          GRAV=$(jq -r '.gravadas' resposta.json)
          ERRO=$(jq -r '.erro // "—"' resposta.json)
          echo "gravadas: $GRAV · ok: $OK · erro: $ERRO" >> "$GITHUB_STEP_SUMMARY"

          # >>> "O PNCP estava fora" NÃO pinta o job de vermelho, de propósito. Esta fonte caiu
          #     4 vezes em dois dias; um X vermelho diário treina qualquer um a ignorar o CI, e
          #     aí o dia em que a falha for NOSSA passa despercebido. Vira aviso, e o carimbo
          #     de frescor no banco (`coleta_status.ultima_ok`) continua sendo a verdade.
          if [ "$OK" != "true" ]; then
            echo "::warning::Coleta parcial — a fonte não colaborou ($ERRO). O banco ficou como estava; nada foi apagado."
          fi

      # ══ ALARME DE 2 FALHAS NOSSAS SEGUIDAS ═══════════════════════════════════════════════════
      # A cicatriz: a coleta falhou 12 vezes seguidas entre 07 e 10/08 e voltou sozinha ao verde.
      # Ninguem soube. "Falha que se conserta sozinha some do olhar."
      #
      # >>> ELE SO CONTA FALHA NOSSA. "Fonte fora do ar" nao entra, e essa regra ja estava
      #     decidida por escrito acima: HTTP != 200 e problema NOSSO (funcao fora, token errado,
      #     projeto pausado) e derruba o passo; `ok:false` e o PNCP nao colaborando, e vira
      #     aviso. O alarme herda essa fronteira em vez de inventar outra — duas definicoes de
      #     "falhou" no mesmo arquivo divergiriam na primeira vez que alguem mexesse numa.
      #
      # >>> POR QUE `if: failure()`: ele so roda quando o passo de cima caiu, e o passo de cima
      #     so cai por falha NOSSA. Entao a fronteira nao precisa ser reimplementada aqui.
      #
      # >>> E POR QUE O JOB CONTINUA VERMELHO NA 1a: porque ele FALHOU MESMO. Engolir a primeira
      #     pra "nao fazer barulho" apagaria o rastro que a segunda precisa ler — e este passo
      #     descobriria um historico de sucessos onde houve falha. O que muda da 1a pra 2a nao e
      #     a cor: e o TEXTO. A 1a diz "aconteceu"; a 2a diz "isto nao e acaso, va olhar".
      - name: Alarme — duas falhas nossas seguidas
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # historico das ultimas rodadas DESTE workflow, so as ja concluidas
          RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/coleta-pncp.yml/runs?status=completed&per_page=10" \
                 --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})] | .[0:5] | map(.conclusion)' 2>/dev/null || echo '[]')
          echo "conclusoes anteriores: $RUNS"

          # quantas falhas SEGUIDAS logo antes desta (a de agora nao esta na lista)
          SEGUIDAS=$(echo "$RUNS" | jq -r 'map(. == "failure") | index(false) // length')
          TOTAL=$(( SEGUIDAS + 1 ))
          echo "falhas nossas consecutivas, contando esta: $TOTAL"

          {
            echo "### Coleta PNCP — falha nossa"
            echo ""
            echo "Falhas consecutivas, contando esta: **$TOTAL**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$TOTAL" -ge 2 ]; then
            echo "::error::ALARME: a coleta falhou $TOTAL vezes SEGUIDAS por problema NOSSO (HTTP != 200). Isto nao e a fonte fora do ar. Conferir: a edge function esta no ar? o COLETA_TOKEN ainda vale? o projeto Supabase esta ativo?"
            {
              echo ""
              echo "**ALARME** — nao e acaso. Conferir, nesta ordem:"
              echo "1. a edge function \`coletar-licitacoes\` responde?"
              echo "2. o segredo \`COLETA_TOKEN\` ainda vale?"
              echo "3. o projeto Supabase esta ativo (nao pausado)?"
              echo ""
              echo "O sino do Negocios tambem acende quando o indice fica velho ou quando o agendador para — ver \`fpmed_alarme_coleta.js\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::1a falha nossa. Se a proxima rodada tambem falhar, isto vira alarme."
          fi
