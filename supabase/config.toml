# Config do Supabase CLI — FPMED
project_id = "fpmed"

# A edge function 'ler-pedido' e PUBLICA (o app chama sem Authorization).
[functions.ler-pedido]
verify_jwt = false

# A 'coletar-licitacoes' NAO e publica: quem autentica e o header x-coleta-token (segredo
# dedicado). Exigir JWT junto obrigaria o agendador a carregar TAMBEM uma chave do Supabase --
# dois segredos pra uma porta so, e o segundo sem poder nenhum a mais.
[functions.coletar-licitacoes]
verify_jwt = false

# A 'enviar-boletim' segue a MESMA regra da coletar-licitacoes: quem autentica e o header
# x-boletim-token. Ela nao e publica -- sem o segredo responde 401, e sem BOLETIM_TOKEN
# configurado responde 503 (fechada), nunca aberta.
[functions.enviar-boletim]
verify_jwt = false

# A 'ler-edital' e a UNICA que EXIGE JWT de usuario -- e nao por capricho: ela e a trava de
# permissao do piloto (so o gestor de licitacao le) e a que grava o contador de cobranca. Um
# endpoint desses aberto por origem, como os outros, seria botao escondido e nao permissao.
# verify_jwt fica false porque a propria funcao valida o token em /auth/v1/user e precisa
# responder 401/403 com mensagem em portugues em vez do 401 cru da plataforma.
[functions.ler-edital]
verify_jwt = false
